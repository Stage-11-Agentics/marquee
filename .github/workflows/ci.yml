name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    # Generous on purpose: these are hang detectors, not speed gates. The runner
    # is far smaller than a dev machine, so a timeout here reports the hardware
    # rather than the change. Suite speed is an objective, measured and warned
    # about by scripts/checks/run-test.mjs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must satisfy package.json engines (>=22.18.0). That floor is not
          # arbitrary: 22.18 is where Node runs TypeScript directly without a
          # flag, and several checks in tests/node execute .ts entry points
          # (scripts/seed/index.ts among them). On 20.x those throw
          # ERR_UNKNOWN_FILE_EXTENSION — which nobody saw, because the suite was
          # being killed on time before the node-test step ever ran.
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsc -p tsconfig.client.json --noEmit
      - run: npx tsc -p tsconfig.test.json --noEmit
      - run: npm run check:no-op-tests
      - run: npx vite build
      - run: npm run check:design
      - run: npm run check:clocks
      - run: npm run check:schema
      - run: npm run check:speed -- --scope=acceptance
        env:
          MARQUEE_GATE: "1"
      - run: npm test
        # Hang detector, not a speed gate — same reasoning as the job-level
        # limit above. The runner is far smaller than a dev machine, so 5
        # minutes measured the hardware rather than the change: it failed
        # main at 1058ed23 with 855 tests passing and nothing broken.
        # Suite speed stays an objective, reported every run by
        # scripts/checks/run-test.mjs against its 45s budget.
        timeout-minutes: 12
      - run: npm run trace:ac -- --scope=merged
