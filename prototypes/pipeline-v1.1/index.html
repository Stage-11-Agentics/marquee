        if(state.importStep===3) body=`<div class="empty-state"><div><div class="empty-mark">↻</div><h2>Import ready</h2><p>286 rows will be matched idempotently by Sessionize ID. Re-running this export updates matches and inserts new records without duplicates.</p><button class="button primary" id="run-import">Run import</button></div></div>`;
        if(state.importStep===4) body=`<div class="table-wrap" style="min-height:320px"><table class="outcome-table"><thead><tr><th>Row</th><th>Record</th><th>Outcome</th><th>Reason</th></tr></thead><tbody><tr><td>1–241</td><td>Submissions + speakers</td><td><span class="chip published">Created · 241</span></td><td>New Sessionize IDs</td></tr><tr><td>242–278</td><td>Submissions + review history</td><td><span class="chip review">Updated · 37</span></td><td>Matched prior import</td></tr><tr><td>279–284</td><td>Duplicate speaker rows</td><td><span class="chip">Skipped · 6</span></td><td>Relationships already present</td></tr><tr><td>285–286</td><td>Malformed category</td><td><span class="chip overdue">Failed · 2</span></td><td>Missing format; fix and re-run</td></tr></tbody></table></div><div class="modal-actions"><span class="subtle" style="margin-right:auto">Batch SZ-2026-08-08 · 284 applied · 2 failed</span><button class="button danger" id="undo-import">Undo this batch</button><button class="button primary" data-route="submissions">View imported records</button></div>`;
        return shell(`<div class="page">${pageHead("Import from Sessionize", "Move mid-CFP without losing undecided records, relationships, custom fields, or review history.", `<button class="button" data-route="submissions">All submissions</button>`)}<div class="import-steps">${labels.map((l,i)=>`<div class="import-step ${i===state.importStep?"active":""}">${i+1} · ${l}</div>`).join("")}</div><section class="card">${body}</section></div>`);
      }

      function airtableView() {
        return shell(`<div class="page">${pageHead("Airtable mirror", "D1 stays authoritative. The two-way mirror runs off the request path and makes its health visible.", `<a class="button" href="#settings">Conference settings</a><button class="button primary" id="sync-airtable">Sync now</button>`)}${settingsTabs("airtable")}<div class="grid-2"><section class="card"><div class="card-head"><h2>AIE NYC 2026 base</h2><a class="button small" href="https://airtable.com/appAIE2026" target="_blank" rel="noreferrer">Open base ↗</a></div><div class="card-body"><div class="metric-grid"><div class="metric-box"><span class="eyebrow">Marquee rows</span><div class="metric">1,040</div></div><div class="metric-box"><span class="eyebrow">Airtable rows</span><div class="metric">1,040</div></div><div class="metric-box"><span class="eyebrow">Last successful sync</span><div class="metric" style="font-size:16px">23 sec ago</div></div><div class="metric-box"><span class="eyebrow">Outbox depth</span><div class="metric">0</div></div></div><div class="message-preview" style="margin-top:14px"><strong>Webhook healthy · renews automatically</strong><br><span class="subtle">Expires Aug 14, 2026 · keepalive due in 5 days. You’ll see a warning here 48 hours before expiry.</span></div></div></section><section class="card"><div class="card-head"><h2>Live sync log</h2><span class="chip published">Healthy</span></div><div class="card-body"><div class="live-log" id="airtable-log">${state.airtableLog.map((line,i)=>`<div>${i===state.airtableLog.length-1?"<strong>✓</strong>":"·"} ${esc(line)}</div>`).join("")}</div></div></section></div></div>`);
      }

      function apiTokensView() {
        return shell(`<div class="page">${pageHead("API tokens", "Issue revocable credentials for agents, scripts, and integrations independently of browser sessions.", `<a class="button" href="#api/docs">Read API docs</a><button class="button primary" id="create-token">Create token</button>`)}${settingsTabs("apiTokens")}<section class="card table-card"><div class="table-wrap" style="min-height:300px"><table><thead><tr><th>Name</th><th>Token</th><th>Created</th><th>Last used</th><th></th></tr></thead><tbody>${state.apiTokens.map(t=>`<tr><td><strong>${esc(t.name)}</strong></td><td><code>${esc(t.prefix)}</code></td><td>${esc(t.created)}</td><td>${esc(t.lastUsed)}</td><td><button class="button small danger" data-revoke-token="${t.id}">Revoke</button></td></tr>`).join("")||`<tr><td colspan="5" style="height:180px;text-align:center"><strong>No API tokens</strong><div class="subtle">Create one for your first agent or integration.</div></td></tr>`}</tbody></table></div></section></div>`);
      }

      // Outbound webhooks: the other half of "agent-native." The API lets a system
      // ask; webhooks let Marquee tell. Six event types, an HMAC signature over
      // id.timestamp.body, and a deliveries log — because an integration that
      // fails silently is worse than no integration.
      const WEBHOOK_EVENTS = ["submission.created","submission.status_changed","evaluation.completed","task.completed","agenda.published","speaker.confirmed"];
      function webhooksView() {
        return shell(`<div class="page">${pageHead("Webhooks", "Marquee posts a signed payload to your endpoint when something happens here — no polling, no export cron.", `<a class="button" href="#api/docs">Read API docs</a><button class="button primary" id="add-webhook">Add endpoint</button>`)}${settingsTabs("webhooks")}
          <section class="card table-card"><div class="card-head"><div><h2>Endpoints</h2><span class="subtle">Every delivery is signed <code>HMAC-SHA256</code> over <code>id.timestamp.body</code> · retried with backoff · replay-safe by delivery id</span></div></div>
            <div class="table-wrap"><table><thead><tr><th>Endpoint</th><th>Events</th><th>Status</th><th>Last delivery</th><th></th></tr></thead><tbody>${state.webhooks.map(w=>`<tr><td><strong style="font-size:11px">${esc(w.url)}</strong><div class="wave-date">Signing secret <code>${esc(w.secret)}</code></div></td><td>${w.events.map(e=>`<span class="chip">${esc(e)}</span>`).join(" ")}</td><td><span class="chip ${w.enabled?"published":""}">${w.enabled?"Enabled":"Disabled"}</span></td><td class="tabular">${esc(w.lastDelivery)}</td><td><button class="button small" data-test-webhook="${w.id}">Send test</button></td></tr>`).join("")||`<tr><td colspan="5" style="height:170px;text-align:center"><strong>No endpoints yet</strong><div class="subtle">Add one to receive ${WEBHOOK_EVENTS.length} event types as they happen.</div></td></tr>`}</tbody></table></div>
          </section>
          <section class="card table-card"><div class="card-head"><div><h2>Recent deliveries</h2><span class="subtle">A failed delivery is visible here before the integration owner notices</span></div></div>
            <div class="table-wrap" style="min-height:220px"><table><thead><tr><th>Delivery</th><th>Event</th><th>Endpoint</th><th>Response</th><th>Attempts</th><th>When</th></tr></thead><tbody>${state.webhookDeliveries.map(d=>`<tr><td><code>${esc(d.id)}</code></td><td>${esc(d.event)}</td><td class="subtle">${esc(d.url)}</td><td><span class="chip ${d.code>=200&&d.code<300?"published":"overdue"}">${d.code} ${d.code>=200&&d.code<300?"OK":"Failed"}</span></td><td class="tabular">${d.attempts}</td><td class="subtle">${esc(d.time)}</td></tr>`).join("")}</tbody></table></div>
          </section>
        </div>`);
      }

      function apiDocsView() {
        const endpoints=[["GET","/v1/events/:id/submissions","List submissions with status, type, track, search, sort, and cursor filters."],["POST","/v1/events/:id/submissions","Create an Abstract or Session; Session may bypass evaluation."],["PATCH","/v1/submissions/:id","Update status and receive the cascade plan."],["POST","/v1/submissions/:id/reverse-acceptance","Apply explicit retain/cancel choices for dependent work."],["GET","/v1/events/:id/agenda","Read the same filtered agenda shown in the UI."],["POST","/v1/events/:id/imports/sessionize","Create an idempotent import batch."]];
        return shell(`<div class="page">${pageHead("Marquee API", "Rendered OpenAPI 3.1 documentation · everything the admin UI does uses this same surface.", `<button class="button" id="download-openapi">Download OpenAPI JSON</button><a class="button primary" href="#settings/api">Create API token</a>`)}<div class="detail-grid"><section class="card"><div class="card-head"><div><h2>HTTP endpoints</h2><span class="subtle">Base URL · https://marquee.stage11.dev/api</span></div><span class="chip published">v1</span></div><div class="card-body">${endpoints.map(e=>`<div class="api-route"><span class="method">${e[0]}</span><code>${e[1]}</code><span class="subtle">${e[2]}</span></div>`).join("")}</div></section><aside class="stack"><section class="card"><div class="card-head"><h2>Authentication</h2></div><div class="card-body"><p class="subtle">Send a UI-issued token as a bearer credential. Tokens are event-scoped and independently revocable.</p><div class="code-block">curl https://marquee.stage11.dev/api/v1/events/aie-nyc-2026/submissions \\\n  -H 'Authorization: Bearer mq_live_…' \\\n  -G --data-urlencode 'status=in_review'</div></div></section><section class="card"><div class="card-head"><h2>Agent contract</h2></div><div class="card-body"><p class="subtle">Pagination and filter names mirror the UI. Writes return the resulting record plus queued side effects, so agents never infer whether work was accepted.</p></div></section></aside></div></div>`);
      }

      function aiAssistView() {
        return shell(`<div class="page">${pageHead("AI assist", "An optional aid for surfacing likely mismatches. It never makes a program decision or changes status.", `<button class="button" data-route="evaluation">Back to evaluation</button>`)}<section class="card" style="max-width:820px"><div class="card-head"><div><h2>First-pass assistance</h2><span class="subtle">Off by default · deliberately absent from the demo path</span></div><button class="switch ${state.aiEnabled?"on":""}" id="toggle-ai" aria-pressed="${state.aiEnabled}"></button></div><div class="card-body">${state.aiEnabled?`<div class="message-preview"><strong>Aid enabled for preview only</strong><br><span class="subtle">Flags describe evidence for a human reviewer. They cannot accept, reject, promote, or otherwise change a submission.</span></div><div class="divider"></div><button class="button primary" id="run-ai-sample">Analyze 12 unreviewed abstracts</button><div id="ai-results" style="margin-top:14px"></div>`:`<div class="empty-state" style="min-height:280px"><div><div class="empty-mark">◇</div><h2>AI assistance is off</h2><p>Human reviewers see the normal scorecard. Enable this only if you want an additional, clearly labelled evidence pass.</p></div></div>`}</div></section></div>`);
      }

      function onboardingSeverity(person) {
        return person.statuses.reduce((n,s)=>n+(s==="risk"?4:s==="overdue"?2:s==="upcoming"?1:0),0);
      }

      function onboardingFilterCount(filter) {
        if (filter === "all") return onboardingSpeakers.length;
        if (filter === "incomplete") return onboardingSpeakers.filter(p=>p.statuses.some(owesTask)).length;
        if (filter === "overdue") return onboardingSpeakers.filter(p=>p.statuses.includes("overdue")||p.statuses.includes("risk")).length;
        return onboardingSpeakers.filter(p=>p.statuses.includes("risk")).length;
      }

      function filteredOnboardingSpeakers() {
        return onboardingSpeakers.filter(p=>{
          const statusOk = state.onboardingFilter === "all" ||
            (state.onboardingFilter === "incomplete" && p.statuses.some(owesTask)) ||
            (state.onboardingFilter === "overdue" && (p.statuses.includes("overdue")||p.statuses.includes("risk"))) ||
            (state.onboardingFilter === "risk" && p.statuses.includes("risk"));
          const taskIndex = onboardingTaskDefs.findIndex(t=>t.key===state.onboardingTask);
          const taskOk = taskIndex < 0 || owesTask(p.statuses[taskIndex]);
          const trackOk = state.onboardingTrack === "All tracks" || p.sessions.some(s=>(s.tracks||[s.track]).includes(state.onboardingTrack));
          return statusOk && taskOk && trackOk;
        }).sort((a,b)=>onboardingSeverity(b)-onboardingSeverity(a)||a.name.localeCompare(b.name));
      }

      function onboardingTaskState(status) {
        const glyph = status === "done" ? "✓" : status === "risk" ? "×" : status === "overdue" ? "!" : status === "cancelled" ? "–" : "·";
        return `<span class="task-state ${status}" title="${status === "cancelled" ? "cancelled — no longer needed" : status}">${glyph}</span>`;
      }

      function onboardingView() {
        const shown = filteredOnboardingSpeakers();
        const counts = onboardingCounts();
        const everyShownSelected = shown.length && shown.every(p=>state.selectedSpeakers.has(p.id));
        return shell(`<div class="page">
          ${pageHead("Speaker onboarding", `${counts.incomplete} accepted speakers still owe something. The most behind are first; every task and reminder is visible here.`, `<button class="button" data-route="portal">Open speaker portal</button><button class="button primary" id="send-selected-reminder" style="width:162px" ${state.selectedSpeakers.size?"":"disabled"}>Send reminder (${state.selectedSpeakers.size})</button>`)}
          <div class="onboarding-metrics">
            <button class="onboarding-metric ${state.onboardingFilter==="incomplete"?"active":""}" data-onboarding-filter="incomplete"><span>Accepted speakers</span><strong>${onboardingSpeakers.length}</strong><small>${counts.incomplete} still owe something</small></button>
            <button class="onboarding-metric ${state.onboardingFilter==="overdue"?"active":""}" data-onboarding-filter="overdue"><span>Overdue tasks</span><strong>${counts.overdueTasks}</strong><small>Across ${counts.overdue} speakers</small></button>
            <button class="onboarding-metric ${state.onboardingFilter==="risk"?"active":""}" data-onboarding-filter="risk"><span>At risk</span><strong>${counts.risk}</strong><small>Due at least 14 days ago</small></button>
            <button class="onboarding-metric" data-route="agenda"><span>Ready to schedule</span><strong>${state.submissions.filter(s=>s.accepted&&!state.scheduled.some(x=>x.id===s.id)).length}</strong><small>Accepted Sessions in the pool</small></button>
          </div>
          <section class="card table-card">
            <div class="chase-toolbar">
              <div class="chase-filters">
                ${[["all","All"],["overdue","Overdue"],["incomplete","Incomplete"],["risk","At risk"]].map(([value,label])=>`<button class="filter-chip ${state.onboardingFilter===value?"active":""}" data-onboarding-filter="${value}">${label} <b>${onboardingFilterCount(value)}</b></button>`).join("")}
                <select id="onboarding-task-filter"><option value="all">Any task</option>${onboardingTaskDefs.map(t=>`<option value="${t.key}" ${state.onboardingTask===t.key?"selected":""}>${t.label}</option>`).join("")}</select>
                <select id="onboarding-track-filter"><option>All tracks</option>${tracks.map(t=>`<option ${state.onboardingTrack===t.name?"selected":""}>${t.name}</option>`).join("")}</select>
              </div>
              <div class="chase-summary"><strong>${shown.length}</strong> shown · <strong>${state.selectedSpeakers.size}</strong> selected</div>
            </div>
            <div class="table-wrap"><table class="chase-table"><colgroup><col style="width:38px"><col style="width:22%"><col style="width:15%">${onboardingTaskDefs.map(()=>'<col style="width:9%">').join("")}<col style="width:12%"><col style="width:96px"></colgroup>
              <thead><tr><th class="check-col"><input type="checkbox" id="select-onboarding" aria-label="Select all matching speakers" ${everyShownSelected?"checked":""}></th><th>Speaker</th><th>Track</th>${onboardingTaskDefs.map(t=>`<th title="${t.label}">${t.label.split(" ")[0]}</th>`).join("")}<th>Last contact</th><th></th></tr></thead>
              <tbody>${shown.map(p=>{const sent=state.onboardingMessages[p.id]||[];return `<tr class="${state.selectedSpeakers.has(p.id)?"selected":""}"><td class="check-col"><input type="checkbox" class="onboarding-check" data-speaker-id="${p.id}" ${state.selectedSpeakers.has(p.id)?"checked":""}></td><td class="speaker-cell"><button data-speaker-drawer="${p.id}">${esc(p.name)}</button><small>${esc(p.company)} · ${esc(p.wave)} wave${p.sessions.length>1?` · ${p.sessions.length} Sessions`:""}</small></td><td><span style="color:${trackColor(p.track)}">●</span> ${esc(p.track)}</td>${p.statuses.map(s=>`<td class="task-state-cell">${onboardingTaskState(s)}</td>`).join("")}<td>${sent.length?`<span class="chip published">Sent just now</span>`:`<span class="subtle">${(Number(p.id.slice(2))%8)+1}d ago</span>`}</td><td><button class="button small" data-nudge-speaker="${p.id}">${sent.length?"Nudge again":"Nudge"}</button></td></tr>`}).join("")}</tbody>
            </table></div>
          </section>
        </div>`);
      }

      function closeOnboardingDrawer() {
        state.onboardingDrawer = null;
        modalRoot.innerHTML = "";
      }

      function showSpeakerDrawer(id) {
        const p = onboardingSpeakers.find(x=>x.id===id); if (!p) return;
        const sent = state.onboardingMessages[p.id] || [];
        state.onboardingDrawer = { type:"speaker", id };
        modalRoot.innerHTML = `<div class="drawer-backdrop" data-close-drawer></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Speaker context"><header class="drawer-head"><div><h2>${esc(p.name)}</h2><span class="subtle">${esc(p.title)} · ${esc(p.company)}</span></div><button class="drawer-close" data-close-drawer aria-label="Close">×</button></header><div class="drawer-content">
          <section class="drawer-section"><h3>Chase summary</h3><div class="grid-3"><div class="metric-box"><span class="eyebrow">Tasks done</span><div class="metric">${p.statuses.filter(s=>s==="done").length}/5</div></div><div class="metric-box"><span class="eyebrow">Wave</span><div class="metric" style="font-size:16px">${esc(p.wave)}</div></div><div class="metric-box"><span class="eyebrow">Last contact</span><div class="metric" style="font-size:16px">${sent.length?"Now":"6d"}</div></div></div></section>
          <section class="drawer-section"><h3>Tasks</h3>${onboardingTaskDefs.map((t,i)=>`<div class="task-line">${onboardingTaskState(p.statuses[i])}<strong>${esc(t.label)}<small>${esc(t.kind)}</small></strong><span class="subtle">${p.statuses[i]==="done"?"DONE":esc(t.due).toUpperCase()}</span></div>`).join("")}</section>
          <section class="drawer-section"><h3>Sessions</h3>${p.sessions.map(s=>`<div class="message-preview" style="margin-bottom:7px"><span class="chip ${s.entity==="Session"?"session":""}">${s.entity} → Session</span><strong style="display:block;margin:9px 0 5px">${esc(s.title)}</strong><span class="subtle">${esc(s.format)}</span>${trackChips(s,true)}${scheduleMeta(s,true)}</div>`).join("")}<button class="button small" data-route="agenda">Open in agenda</button></section>
          <section class="drawer-section"><h3>Message history</h3><div class="timeline"><div class="timeline-item">Acceptance and portal invitation queued<time>${esc(p.wave)}, 10:04 AM</time></div>${sent.map(m=>`<div class="timeline-item">${esc(m.subject)}<time>Just now · delivered in demo outbox</time></div>`).join("")||'<div class="subtle">No reminders sent yet.</div>'}</div><button class="button primary" data-nudge-speaker="${p.id}">Send reminder</button></section>
          <section class="drawer-section"><h3>Biography</h3><p class="subtle" style="line-height:1.6">${esc(p.bio)}</p><span class="subtle">${esc(p.email)}</span></section>
        </div></aside>`;
        bindDrawerActions();
      }

      function showReminderDrawer(ids) {
        const chosen = onboardingSpeakers.filter(p=>ids.includes(p.id)); if (!chosen.length) return;
        const first = chosen[0];
        const outstandingIndex = first.statuses.findIndex(s=>s==="risk"||s==="overdue");
        const fallbackIndex = first.statuses.findIndex(s=>s!=="done");
        const task = onboardingTaskDefs[Math.max(0,outstandingIndex>=0?outstandingIndex:fallbackIndex)];
        const templates = {
          "Outstanding speaker tasks":{subject:`AIE NYC: ${task.label} is still outstanding`,task:task.label,due:task.due},
          "Headshot deadline":{subject:"AIE NYC: your headshot is overdue",task:"Bio + headshot",due:"Aug 28"},
          "Slides due soon":{subject:"AIE NYC: slides are due October 2",task:"Upload slides",due:"Oct 2"}
        };
        const copy = templates[state.reminderTemplate] || templates["Outstanding speaker tasks"];
        state.onboardingDrawer = { type:"compose", ids };
        modalRoot.innerHTML = `<div class="drawer-backdrop" data-close-drawer></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Compose reminder"><header class="drawer-head"><div><h2>Remind ${chosen.length} ${chosen.length===1?"speaker":"speakers"}</h2><span class="subtle">Demo-safe outbox · no email will be delivered</span></div><button class="drawer-close" data-close-drawer aria-label="Close">×</button></header><div class="drawer-content">
          <div class="field"><label>Template</label><select id="reminder-template">${Object.keys(templates).map(name=>`<option ${state.reminderTemplate===name?"selected":""}>${name}</option>`).join("")}</select></div>
          <div class="field" style="margin-top:13px"><label>Subject</label><input id="reminder-subject" value="${esc(copy.subject)}"></div>
          <div class="field" style="margin-top:13px"><label>Message</label><textarea id="reminder-body">Hi {{speaker.first_name}},\n\nWe’re getting AIE NYC 2026 ready. Your {{task.title}} task was due {{task.due_date}}. Please finish it in your portal so the program stays on track.\n\nThank you,\nAIE program team</textarea></div>
          <section class="drawer-section" style="margin-top:20px"><h3>Merge-field preview · ${esc(first.name)}</h3><div class="message-preview">Hi ${esc(first.name.split(" ")[0])},<br><br>We’re getting AIE NYC 2026 ready. Your <strong>${esc(copy.task)}</strong> task was due <strong>${esc(copy.due)}</strong>. Please finish it in your portal so the program stays on track.<br><br>Thank you,<br>AIE program team</div></section>
        </div><div class="modal-actions" style="position:sticky;bottom:0;background:var(--sunk)"><button class="button" data-close-drawer>Cancel</button><button class="button primary" id="queue-reminders">Queue reminder (${chosen.length})</button></div></aside>`;
        bindDrawerActions();
        document.getElementById("reminder-template").onchange=e=>{state.reminderTemplate=e.target.value;showReminderDrawer(ids);};
        document.getElementById("queue-reminders").onclick=()=>{
          const subject = document.getElementById("reminder-subject").value;
          ids.forEach(id=>{if(!state.onboardingMessages[id])state.onboardingMessages[id]=[];state.onboardingMessages[id].push({subject,date:new Date().toISOString()});});
          state.selectedSpeakers.clear(); closeOnboardingDrawer(); toast(`Queued ${ids.length} ${ids.length===1?"reminder":"reminders"} in the demo-safe outbox.`); render();
        };
      }

      function bindDrawerActions() {
        modalRoot.querySelectorAll("[data-close-drawer]").forEach(el=>el.onclick=closeOnboardingDrawer);
        modalRoot.querySelectorAll("[data-route]").forEach(el=>el.onclick=e=>{e.preventDefault();closeOnboardingDrawer();navigate(el.dataset.route);});

        modalRoot.querySelectorAll("[data-publish-id]").forEach(el=>el.onclick=e=>{e.stopPropagation();showPublishModal(el.dataset.publishId);});
      }

      function agendaView() {
        const scheduledIds = new Set(state.scheduled.map(s=>s.id));
        const q = state.agendaPoolSearch.trim().toLowerCase();
        const pool = state.submissions.filter(s=>s.accepted&&!scheduledIds.has(s.id)&&(state.agendaTrack==="All tracks"||(s.tracks||[s.track]).includes(state.agendaTrack))&&(!q||[s.title,s.speaker,s.format].some(v=>v.toLowerCase().includes(q))));

          <div class="toolbar card" style="margin-bottom:14px"><div class="segment agenda-view-toggle" id="agenda-tabs">${["list","day","week","track","room"].map(v=>`<button data-agenda-view="${v}" class="${state.agendaView===v?"active":""}">${v[0].toUpperCase()+v.slice(1)}</button>`).join("")}</div><select id="agenda-builder-day"><option ${state.agendaBuilderDay==="All days"?"selected":""}>All days</option><option ${state.agendaBuilderDay==="Mon · Oct 12"?"selected":""}>Mon · Oct 12</option><option ${state.agendaBuilderDay==="Tue · Oct 13"?"selected":""}>Tue · Oct 13</option><option ${state.agendaBuilderDay==="Wed · Oct 14"?"selected":""}>Wed · Oct 14</option></select><select id="agenda-track"><option>All tracks</option>${tracks.map(t=>`<option ${state.agendaTrack===t.name?"selected":""}>${t.name}</option>`).join("")}</select><select id="agenda-snap"><option>15 minute snap</option><option>5 minute snap</option><option>30 minute snap</option><option>60 minute snap</option></select><span class="toolbar-spacer"></span><button class="button small" id="add-break">+ Add break</button></div>

      function trackColor(name) { const octave = currentTheme().tracks?.[name]; return octave || tracks.find(t=>t.name===name)?.color || "#635bff"; }
      function visibleAgendaSessions() {
        return state.scheduled.filter(s=>(state.agendaTrack==="All tracks"||(s.tracks||[s.track]).includes(state.agendaTrack))&&(state.agendaBuilderDay==="All days"||s.day===state.agendaBuilderDay));

      function agendaBoard() {
        const visible = visibleAgendaSessions();

        const daySessions = visible.filter(s=>s.day===selectedDay).slice(0,32);
        if (state.agendaView === "track") return renderTrackAgenda(visible);
        if (state.agendaView === "list") return agendaList([...visible]);
        if (state.agendaView === "week") return renderWeekAgenda(visible);
        if (state.agendaView === "room") return renderRoomAgenda(visible);

      }

      function renderWeekAgenda(items) {
        const times=["09:00","10:00","11:00","13:30","14:30","15:30","16:30"],days=["Mon · Oct 12","Tue · Oct 13","Wed · Oct 14"];
        return `<div class="week-grid"><div class="week-cell head time"></div>${days.map(d=>`<div class="week-cell head">${d}</div>`).join("")}${times.map(time=>`<div class="week-cell time">${time}</div>${days.map(day=>`<div class="week-cell drop-target" data-drop-day="${day}" data-drop-time="${time}" data-drop-room="${rooms[(times.indexOf(time)+days.indexOf(day))%rooms.length]}">${items.filter(s=>s.day===day&&s.time===time).map(s=>`<div class="week-session ${s.kind==="break"?"break-tile":""}" style="border-left-color:${s.kind==="break"?"var(--break-tint)":trackColor(s.track)}"><strong>${esc(s.title)}</strong><span>${esc(s.room)} · ${s.kind==="break"?`${s.duration}m Break`:esc(s.speaker)}</span>${s.kind==="break"?"":trackChips(s,true)+scheduleMeta(s,true)}</div>`).join("")}</div>`).join("")}`).join("")}</div>`;
      }

      function renderRoomAgenda(items) {
        const days=state.agendaBuilderDay==="All days"?["Mon · Oct 12","Tue · Oct 13","Wed · Oct 14"]:[state.agendaBuilderDay];
        return `<div class="swimlanes" style="grid-template-columns:repeat(${rooms.length},minmax(220px,1fr));min-width:${Math.max(850,rooms.length*220)}px">${rooms.map(r=>`<div class="swimlane" style="--track-color:var(--muted)"><div class="swimlane-head">${roomHeadLabel(r)}</div><div class="swimlane-body">${days.map(day=>`<div class="track-day-label" style="margin:5px 0"><b>${day.slice(0,3)}</b>${day.split(" · ")[1]}</div>${items.filter(s=>s.room===r&&s.day===day).sort((a,b)=>a.time.localeCompare(b.time)).map(swimlaneSession).join("")||`<div class="drop-target message-preview" data-drop-day="${day}" data-drop-room="${esc(r)}" data-drop-time="16:30">Open lane · drop at 16:30</div>`}`).join("")}</div></div>`).join("")}</div>`;
      }
      function renderTrackAgenda(items) {
        const slots = ["09:00","10:00","11:00","13:30","14:30","15:30","16:30"];
        const days = state.agendaBuilderDay === "All days" ? ["Mon · Oct 12","Tue · Oct 13","Wed · Oct 14"] : [state.agendaBuilderDay];
        const conflictIds = new Set(getAgendaConflicts().flatMap(c=>[c.a.id,c.b.id]));
        const laneTracks=state.agendaTrack==="All tracks"?tracks:tracks.filter(t=>items.some(s=>s.track===t.name));
        return `<div class="track-board"><div class="track-time-axis">${slots.map(t=>`<span>${t}</span>`).join("")}</div>${laneTracks.map(t=>{const laneItems=items.filter(s=>s.track===t.name);return `<section class="track-lane" style="--track-color:${t.color}"><header class="track-lane-label"><i></i><strong>${esc(t.name)}</strong><span>${laneItems.length} scheduled by primary track · ${laneItems.reduce((n,s)=>n+s.duration,0)} min</span></header><div class="track-lane-days">${days.map(day=>`<div class="track-day-band"><div class="track-day-label"><b>${day.slice(0,3)}</b>${day.split(" · ")[1]}</div><div class="track-day-slots">${slots.map((time,i)=>`<div class="track-slot drop-target" data-drop-track="${esc(t.name)}" data-drop-day="${day}" data-drop-time="${time}" data-drop-room="${rooms[i%rooms.length]}">${laneItems.filter(s=>s.day===day&&s.time===time).map(s=>trackAgendaTile(s,conflictIds.has(s.id))).join("")}</div>`).join("")}</div></div>`).join("")}</div></section>`}).join("")}</div>`;
      }
      function agendaList(sessions) {
        const order={day:(a,b)=>(a.day+a.time).localeCompare(b.day+b.time),title:(a,b)=>a.title.localeCompare(b.title),speaker:(a,b)=>(a.speaker||"").localeCompare(b.speaker||""),track:(a,b)=>(a.track||"").localeCompare(b.track||""),room:(a,b)=>a.room.localeCompare(b.room),format:(a,b)=>(a.format||"Break").localeCompare(b.format||"Break")};sessions.sort(order[state.agendaSort]||order.day);
        return `<div><div class="agenda-list-head"><button data-agenda-sort="day">Day</button><span>Time</span><button data-agenda-sort="title">Title</button><button data-agenda-sort="speaker">Speakers</button><button data-agenda-sort="track">Track</button><button data-agenda-sort="room">Room</button><button data-agenda-sort="format">Format</button></div>${sessions.map(s=>`<div class="agenda-list-row"><strong>${s.day}</strong><span class="tabular">${s.time}</span><div><strong>${esc(s.title)}</strong>${s.kind==="break"?"":scheduleMeta(s,true)}</div><span>${esc(s.kind==="break"?"—":s.speakers.join(" · "))}</span><div>${s.kind==="break"?`<span class="chip" style="border-left:3px solid var(--muted)">Break</span>`:trackChips(s,true)}</div><span>${esc(s.room)}</span><span>${esc(s.kind==="break"?`Break · ${s.duration}m`:s.format)}</span></div>`).join("")}</div>`;
      }
      // Geography, as a scheduling constraint -----------------------------------
      // Straight-line distance underestimates a Manhattan walk, so the grid detour
      // factor is applied before converting to minutes at a normal walking pace.
      const WALK_DETOUR = 1.3, WALK_METRES_PER_MIN = 80;

      function haversineMetres(a, b) {
        const R = 6371000, rad = d => d * Math.PI / 180;
        const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
        const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
        return 2 * R * Math.asin(Math.sqrt(h));
      }
      function hasPin(building) { return !!building && building.lat != null && building.lng != null; }
      function walkMinutes(from, to) {
        if (!hasPin(from) || !hasPin(to) || from.id === to.id) return 0;
        return Math.max(1, Math.ceil(haversineMetres(from, to) * WALK_DETOUR / WALK_METRES_PER_MIN));
      }
      // Getting there, plus getting in. Security queues are travel time.
      function requiredGapMinutes(from, to) {
        if (!hasPin(from) || !hasPin(to) || from.id === to.id) return 0;
        return walkMinutes(from, to) + (to.accessMinutes || 0);
      }

      // ── v1.7: geography ──────────────────────────────────────────────────
      // Zoom 2 — address, entrance, access time — is worth the same at one
      // building as at four: a single hotel still has a door and a security desk.
      // Zoom 1 — walk times, "leave by" — needs something to compare against, so
      // it stays dark until a second pinned building exists.
      function pinnedBuildings() { return buildings.filter(hasPin); }
      function geoActive() { return pinnedBuildings().length >= 2; }
      function primaryBuilding() { return pinnedBuildings()[0] || null; }
      function clockToMinutes(v) { const [h,m]=String(v).split(":").map(Number); return h*60+m; }
      function minutesToClock(m) { const t=((Math.round(m)%1440)+1440)%1440; return `${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; }

      // The origin for a "leave by" is the speaker's own previous session, not the
      // main stage — that is the number they actually need. Falls back to the
      // primary building when they have nothing earlier that day.
      function previousSlotFor(slot, speaker) {
        if (!slot || !speaker) return null;
        return state.scheduled
          .filter(s => s.kind!=="break" && s.id!==slot.id && s.day===slot.day
                    && (s.speakers||[s.speaker]).includes(speaker)
                    && clockToMinutes(s.time)+s.duration <= clockToMinutes(slot.time))
          .sort((a,b)=>clockToMinutes(b.time)-clockToMinutes(a.time))[0] || null;
      }
      function transitTo(slot, speaker) {
        if (!geoActive() || !slot) return null;
        const to = buildingForRoom(slot.room); if (!hasPin(to)) return null;
        const prev = previousSlotFor(slot, speaker);
        const from = prev ? buildingForRoom(prev.room) : primaryBuilding();
        if (!hasPin(from) || from.id === to.id) return null;
        const walk = walkMinutes(from, to), access = to.accessMinutes || 0;
        return { from, to, prev, walk, access, needed: walk + access, leaveBy: minutesToClock(clockToMinutes(slot.time) - walk - access) };
      }

      // A map with no map library. OSM raster tiles are positioned as plain
      // images on a fixed-width plane; pins and walking lines are drawn over it.
      // Nothing to initialise, nothing to lazy-load, no reflow when tiles land —
      // and when they never land, the pins still tell the truth over the grid.
      const TILE_PX = 256, tileURL = (z,x,y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
      function mercatorPx(lat, lng, z) {
        const scale = TILE_PX * Math.pow(2, z), sin = Math.sin(lat * Math.PI/180);
        return { x: (lng+180)/360*scale, y: (0.5 - Math.log((1+sin)/(1-sin))/(4*Math.PI))*scale };
      }
      function fitZoom(list, w, h) {
        if (list.length < 2) return 16;
        for (let z=17; z>=10; z--) {
          const pts = list.map(b=>mercatorPx(b.lat,b.lng,z));
          const dx = Math.max(...pts.map(p=>p.x)) - Math.min(...pts.map(p=>p.x));
          const dy = Math.max(...pts.map(p=>p.y)) - Math.min(...pts.map(p=>p.y));
          if (dx <= w-140 && dy <= h-60) return z;
        }
        return 10;
      }
      function venueMap(list, opts = {}) {
        const w = opts.width || 900, h = opts.height || 260, labels = opts.labels !== false;
        const pins = (list||[]).filter(hasPin);
        if (!pins.length) return `<div class="mq-map" style="height:${h}px"><div class="mq-map-empty">No venue has a pin yet. Add coordinates in Conference settings and the map fills in.</div></div>`;
        const z = opts.zoom || fitZoom(pins, w, h);
        const pts = pins.map(b=>mercatorPx(b.lat,b.lng,z));
        // Zoom is fitted to the design width; the tile plane is rendered wider and
        // centre-clipped so a container that turns out broader than expected still
        // shows map rather than bare grid at its edges.
        const planeW = w + 512;
        const left = (Math.min(...pts.map(p=>p.x)) + Math.max(...pts.map(p=>p.x)))/2 - planeW/2;
        const top  = (Math.min(...pts.map(p=>p.y)) + Math.max(...pts.map(p=>p.y)))/2 - h/2;
        let tiles = "";
        for (let tx = Math.floor(left/TILE_PX); tx <= Math.floor((left+planeW)/TILE_PX); tx++)
          for (let ty = Math.floor(top/TILE_PX); ty <= Math.floor((top+h)/TILE_PX); ty++)
            tiles += `<img class="mq-tile" alt="" src="${tileURL(z,tx,ty)}" style="left:${Math.round(tx*TILE_PX-left)}px;top:${Math.round(ty*TILE_PX-top)}px" onerror="this.closest('.mq-map').classList.add('no-tiles')">`;
        const at = pins.map((b,i)=>({ b, x: pts[i].x-left, y: pts[i].y-top }));
        let lines = "";
        if (opts.walk) for (let i=0;i<at.length;i++) for (let j=i+1;j<at.length;j++) {
          const mins = walkMinutes(at[i].b, at[j].b);
          lines += `<line class="mq-walk-line" x1="${at[i].x.toFixed(1)}" y1="${at[i].y.toFixed(1)}" x2="${at[j].x.toFixed(1)}" y2="${at[j].y.toFixed(1)}"></line>`
                 + `<text class="mq-walk-label" x="${((at[i].x+at[j].x)/2).toFixed(1)}" y="${((at[i].y+at[j].y)/2-4).toFixed(1)}" text-anchor="middle">${mins} min</text>`;
        }
        const marks = at.map(p => `<i class="mq-pin${opts.focus && opts.focus !== p.b.id ? " muted" : ""}" style="left:${p.x.toFixed(1)}px;top:${p.y.toFixed(1)}px"></i>`
          + (labels ? `<span class="mq-pin-label" style="left:${p.x.toFixed(1)}px;top:${p.y.toFixed(1)}px">${esc(p.b.name)}</span>` : "")).join("");
        return `<div class="mq-map" style="height:${h}px"><div class="mq-plane" style="width:${planeW}px">${tiles}`
             + `<svg class="mq-overlay" width="${planeW}" height="${h}">${lines}</svg><div class="mq-overlay">${marks}</div>`
             + `</div><span class="mq-attrib">© OpenStreetMap contributors</span></div>`;
      }

      function getAgendaConflicts() {
        const conflicts = [];
        const toMinutes = value => { const [h,m]=value.split(":").map(Number); return h*60+m; };
        const speakersOf = item => item.speakers || [item.speaker];
        for (let i=0;i<state.scheduled.length;i++) for (let j=i+1;j<state.scheduled.length;j++) {
          const a=state.scheduled[i], b=state.scheduled[j]; if(a.day!==b.day) continue;
          const overlaps = toMinutes(a.time) < toMinutes(b.time)+b.duration && toMinutes(b.time) < toMinutes(a.time)+a.duration;
          if (overlaps) {
            if (a.room===b.room) conflicts.push({type:"Room overlap",a,b});
            const shared=speakersOf(a).find(name=>speakersOf(b).includes(name));
            if (shared) conflicts.push({type:`${shared} is double-booked`,a,b});
            continue;
          }
          // Not overlapping is not the same as reachable. A speaker in the Sheraton
          // at 10:00 and the Marriott Marquis at 10:30 reads clean on a day+time
          // check and is a nine-minute walk plus a three-minute access queue.
          const shared = speakersOf(a).find(name=>speakersOf(b).includes(name));
          if (!shared) continue;
          const [first,second] = toMinutes(a.time) <= toMinutes(b.time) ? [a,b] : [b,a];
          const from = buildingForRoom(first.room), to = buildingForRoom(second.room);
          if (!hasPin(from) || !hasPin(to) || from.id === to.id) continue;
          const gap = toMinutes(second.time) - (toMinutes(first.time) + first.duration);
          const needed = requiredGapMinutes(from, to);
          if (gap >= needed) continue;
          const walk = walkMinutes(from, to), access = to.accessMinutes || 0;
          conflicts.push({
            kind: "transit",
            type: `Transit — ${walk} min walk to ${to.name}${access?`, plus ${access} min building security`:""}. ${shared} needs ${needed} min; has ${gap}.`,
            a: first, b: second
          });
        }
        return conflicts;
      }
      function agendaConflictIds() { return new Set(getAgendaConflicts().flatMap(c=>[c.a.id,c.b.id])); }
      function swimlaneSession(s) { const conflict=agendaConflictIds().has(s.id); return `<div class="swimlane-session ${conflict?"conflict":""} ${s.kind==="break"?"break-tile":""}" style="border-left:3px solid ${s.kind==="break"?"var(--break-tint)":trackColor(s.track)}"><strong>${esc(s.title)}</strong><span class="subtle">${esc(s.kind==="break"?`${s.duration} minute reservation`:s.speaker)}</span>${s.kind==="break"?"":trackChips(s,true)+scheduleMeta(s,true)}${conflict?`<span class="conflict-flag">⚠ Live conflict</span>`:""}</div>`; }
      function sessionTile(s) { const conflict=agendaConflictIds().has(s.id); return `<div class="session-tile ${conflict?"conflict":""} ${s.kind==="break"?"break-tile":""}" draggable="${s.kind!=="break"}" data-drag-id="${s.id}" data-session-id="${s.id}" style="--track-color:${s.kind==="break"?"var(--break-tint)":trackColor(s.track)}"><strong>${esc(s.title)}</strong><span>${esc(s.kind==="break"?`${s.duration} minute Break`:s.speaker)}</span>${s.kind==="break"?"":trackChips(s,true)+scheduleMeta(s,true)}${s.kind!=="break"?`<span class="tile-actions"><button data-resize="-5" data-resize-id="${s.id}" aria-label="Shorten">−</button><button data-resize="5" data-resize-id="${s.id}" aria-label="Lengthen">+</button></span>`:""}${conflict?`<span class="conflict-flag">⚠ Live conflict</span>`:""}</div>`; }
      function trackAgendaTile(s,conflict) { return `<article class="track-tile ${conflict?"conflict":""} ${s.kind==="break"?"break-tile":""}" draggable="${s.kind!=="break"}" data-drag-id="${s.id}" data-session-id="${s.id}" style="--track-color:${s.kind==="break"?"var(--break-tint)":trackColor(s.track)}"><strong>${esc(s.title)}</strong><span>${esc(s.kind==="break"?"Break":s.speaker)} · ${s.duration}m</span>${s.kind==="break"?"":trackChips(s,true)+scheduleMeta(s,true)}${s.kind!=="break"?`<span class="tile-actions"><button data-resize="-5" data-resize-id="${s.id}">−</button><button data-resize="5" data-resize-id="${s.id}">+</button></span>`:""}${conflict?'<i class="track-conflict" title="Conflict">!</i>':""}</article>`; }

      function publicAgendaView() {
        const q = state.publicSearch.trim().toLowerCase();

      function stampRecord(id, title, detail) {
        (state.recordEvents[id] = state.recordEvents[id] || []).unshift({ title, detail, time:"Just now", actor:"Maya Chen" });
      }

      // One idempotent operation, called by every path that makes a submission
      // accepted — first acceptance, re-acceptance after a reversal, acceptance
      // after the template set changed. For each template: restore the row if it
      // exists, create it if it does not. `done` and its completed work are never
      // in the write set, so finished homework survives by construction rather
      // than by anybody remembering to preserve it.
      function reconcileTaskSet(submission) {
        let restored = 0;
        if (submission.id === state.portalRecordId) {
          state.tasks.forEach(t => { if (t.cancelledAt) { delete t.cancelledAt; restored++; } });
          if (restored) state.taskCancellation = null;
        }
        const person = onboardingSpeakers.find(p => p.name === submission.speaker);
        if (person) person.statuses = person.statuses.map(s => s === "cancelled" ? "upcoming" : s);
        return restored;
      }

      // The reversal's other half. Cancelling stamps a time on every open task
      // and leaves completed ones alone; it never deletes, because "retained for
      // records" is what a tombstone already gives you.
      function cancelTaskSet(submission, reason) {
        let cancelled = 0;
        if (submission.id === state.portalRecordId) {
          state.tasks.forEach(t => { if (!t.done && !t.cancelledAt) { t.cancelledAt = "just now"; t.overdue = false; cancelled++; } });
          if (cancelled) state.taskCancellation = { reason, time:"Just now" };
        }
        // A speaker with another accepted Session still owes that Session's work,
        // so their chase row is only cleared when this was their last one.
        const person = onboardingSpeakers.find(p => p.name === submission.speaker);
        if (person && !person.sessions.some(x => x.id !== submission.id && x.accepted)) {
          person.statuses = person.statuses.map(s => s === "done" ? s : "cancelled");
        }
        return cancelled;
      }

      function normalizeSearch(value) { return String(value).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,""); }
      function fuzzyMatch(value,query) {
        const hay=normalizeSearch(value),needle=normalizeSearch(query); if(!needle)return true; if(hay.includes(needle))return true;
        let j=0; for(const ch of hay)if(ch===needle[j])j++; return j===needle.length;
      }
      function globalSearchResults(query) {
        if(state.emptyInstall)return [];
        const submissions=state.submissions.filter(s=>[s.title,s.id,s.company].some(v=>fuzzyMatch(v,query))).slice(0,6).map(s=>({type:s.entity,title:s.title,note:`${s.id} · ${s.speaker}`,route:`submissions/${s.id}`}));
        const speakers=onboardingSpeakers.filter(p=>fuzzyMatch(p.name,query)||fuzzyMatch(p.company,query)).slice(0,4).map(p=>({type:"Speaker",title:p.name,note:`${p.company} · ${p.sessions.length} Sessions`,route:"onboarding",speakerId:p.id}));
        const forms=fuzzyMatch("Call for speakers",query)?[{type:"Form",title:"Call for speakers",note:"Open · closes Sep 12",route:"forms"}]:[];
        return [...submissions,...speakers,...forms].slice(0,10);
      }

          dashboard:["Your program starts here","Create conference details, then open a CFP or import an existing Sessionize program.","Set up the conference","settings"],
          board:["No submissions to board yet","Open a CFP or import an active program; each record will appear in its lifecycle column.","Import from Sessionize","import"],
          settings:["Name the conference","Add dates, venue, timezone, formats, tracks, and rooms before opening intake.","Create conference details","settings"],
          forms:["No CFP forms yet","Build an Abstract form for competitive submissions or a Session form for guaranteed programming.","Create a form","forms"],
          cfp:["This call for speakers is not open","Publish a CFP form before sharing this page with submitters.","Open organizer demo","forms"],
          portal:["No speaker work yet","A portal appears after a submission is created. Import from Sessionize or open your CFP.","Import from Sessionize","import"],
          evaluation:["No evaluation plan","Create the first scorecard and committee before assigning reviews.","Create evaluation plan","evaluation"],
          reviewer:["Nothing assigned","Ask the program lead to add you to a committee or assign submissions.","Return to evaluation","evaluation"],
          submissions:["No Abstracts or Sessions","Open a CFP, add an invited Session, or import your in-flight program from Sessionize.","Import from Sessionize","import"],
          submissionDetail:["No submission record","Create an Abstract or Session before opening its record.","Create submission","submissions/new"],
          submissionNew:["Create the first program record","Choose Abstract for evaluation or Session to bypass evaluation and reach the agenda.","Create submission","submissions/new"],
          onboarding:["No accepted speakers yet","Accept an Abstract or add an invited Session; Marquee will assign the speaker task set automatically.","Review submissions","submissions"],
          agenda:["Nothing to schedule","Accept an Abstract or create a Session. Accepted-and-unplaced work appears in the pool automatically.","Add a Session","submissions/new"],
          publicAgenda:["The agenda is not published","Schedule and publish at least one Session before sharing the conference site.","Open organizer demo","agenda"],
          comms:["No communication templates","Create a template, then connect it to a lifecycle trigger.","Create a template","comms"],
          venues:["No venues yet","Buildings and rooms belong to a conference. Create one and the site map fills in.","Create conference","conferences/new"],
          taskTemplates:["No speaker task templates","Add acknowledgements, forms, and file requests before the first acceptance.","Add task template","settings/tasks"],
          importer:["Import your active program","Upload Sessionize Sessions and Speakers exports to preserve undecided records and review history.","Start mocked import","import"],
          airtable:["Airtable is not connected","Connect a Team-plan base to start the off-request-path two-way mirror.","Connect Airtable","settings/airtable"],
          apiTokens:["No API tokens","Create a conference-scoped token for your first agent or integration.","Create API token","settings/api"],
          apiDocs:["API ready for a conference","Create a conference to populate examples and issue an event-scoped token.","Create conference","settings"],
          aiAssist:["AI assistance is off","This optional aid stays absent from the demo path and never changes submission status.","Return to evaluation","evaluation"],
          publicSession:["Session not found","Only published Sessions have public permalinks; private titles never leak here.","View conference site","publicAgenda"],
          publicSpeaker:["Speaker not found","Public profiles appear only for speakers attached to published Sessions.","View conference site","publicAgenda"]
        };
        // In the fresh-install walk the empty states *are* the walk, so every
        // action has to be the genuine next step. The stock copy sent three of
        // them to a screen that could not yet do anything — including one that
        // pointed at itself.
        const setupStates = {
          landing:["Create your first conference","A fresh Marquee install has no conferences yet. Create one from scratch, or import an in-flight program from Sessionize.","Create conference","conferences/new"],
          dashboard:["Your program starts here","Create the conference record first — every form, portal, agenda time, and calendar invite is scoped to it.","Create conference","conferences/new"],
          settings:["Nothing to configure yet","Tracks, formats, rooms, and buildings all belong to a conference. Create one and this screen fills in.","Create conference","conferences/new"],
          importer:["Create the conference first","A Sessionize import needs somewhere to land. Create the conference, then bring the export across.","Create conference","conferences/new"],
          apiDocs:["API ready for a conference","Create a conference to populate examples and issue an event-scoped token.","Create conference","conferences/new"],
          forms:["No call for speakers yet","Build an Abstract form for competitive submissions, or a Session form for guaranteed programming.","Create the call for speakers","",'id="setup-create-form"'],
          evaluation:["No evaluation plan","Set the scorecard, the committee, and the review rounds before the first abstracts land.","Create evaluation plan","",'data-setup-complete="evaluation" data-setup-toast="Evaluation plan created · open intake next"']
        };
        const entry = (state.setup.active && (setupStates[route] || [ ...(states[route]||states.dashboard).slice(0,2), "Continue setup →", "dashboard" ])) || states[route] || states.dashboard;
        const [title,copy,action,target,extra=""]=entry;
        const cta = target ? `<a class="button primary" href="#${target}">${action}</a>` : `<button class="button primary" ${extra}>${action}</button>`;
        const content=`<section class="card empty-state"><div><div class="empty-mark">＋</div><h2>${title}</h2><p>${copy}</p>${cta}</div></section>`;
        if(["landing","cfp","portal","publicAgenda","publicSession","publicSpeaker"].includes(route))return `<div class="public-shell"><header class="public-top"><a class="public-event" href="#landing"><span class="brand-mark">M</span>Marquee</a><button class="button small" id="exit-fresh-install">Exit fresh install</button></header><main class="public-body wide">${content}</main></div>`;
        return shell(`<div class="page">${pageHead(routeNames[route],"Fresh install · nothing here yet, and every action below is the real next step.")} ${content}</div>`);
      }

      // Room detail panel. Rendered at body level and positioned fixed so the
      // agenda's overflow container cannot clip it, and so opening it never
      // reflows the grid. Hover previews; click pins until dismissed.
      let roomPanelPinned = false;
      function roomPanel() {
        let el = document.getElementById("room-panel");
        if (!el) { el = document.createElement("div"); el.id = "room-panel"; el.className = "room-panel"; el.hidden = true; document.body.appendChild(el); }
        return el;
      }
      function showRoomPanel(anchor, name, pin) {
        const info = roomInfo(name); if (!info) return;
        const el = roomPanel();
        el.innerHTML = `<div class="rp-head"><strong>${esc(info.name)}</strong><span class="rp-cap tabular">${info.capacity ? info.capacity.toLocaleString() + " seats" : "—"}</span></div>
          <div class="rp-building">${info.building ? `<strong>${esc(info.building.name)}</strong>${info.building.address ? `<span>${esc(info.building.address)}</span>` : ""}` : `<span class="rp-empty">No building assigned</span>`}</div>
          ${hasPin(info.building) ? venueMap([info.building], {width:248, height:108, labels:false, zoom:16}) : ""}
          ${geoActive() && hasPin(info.building) && primaryBuilding() && primaryBuilding().id !== info.building.id
            ? `<div class="rp-section"><span class="rp-label">From ${esc(primaryBuilding().name)}</span><p class="rp-notes">${walkMinutes(primaryBuilding(), info.building)} min walk${info.building.accessMinutes?` · allow ${info.building.accessMinutes} min to get in`:""}</p></div>` : ""}
          ${info.building && info.building.accessNote ? `<div class="rp-section"><span class="rp-label">Getting in</span><p class="rp-notes">${esc(info.building.accessNote)}</p></div>` : ""}
          <div class="rp-section"><span class="rp-label">AV</span>${info.av.length ? `<div class="rp-tags">${info.av.map(t => `<span class="rp-tag">${esc(t)}</span>`).join("")}</div>` : `<span class="rp-empty">No AV equipment recorded</span>`}</div>
          <div class="rp-section"><span class="rp-label">Notes</span>${info.notes ? `<p class="rp-notes">${esc(info.notes)}</p>` : `<span class="rp-empty">No notes</span>`}</div>`;
        el.hidden = false;
        const r = anchor.getBoundingClientRect(), w = 280;
        el.style.left = Math.round(Math.min(Math.max(8, r.left), innerWidth - w - 8)) + "px";
        el.style.top = Math.round(Math.min(r.bottom + 6, innerHeight - el.offsetHeight - 8)) + "px";
        roomPanelPinned = !!pin;
      }
      function hideRoomPanel(force) { if (roomPanelPinned && !force) return; const el = document.getElementById("room-panel"); if (el) el.hidden = true; }
      function bindRoomHeads() {
        document.querySelectorAll("[data-room-head]").forEach(btn => {
          const name = btn.dataset.roomHead;
          btn.addEventListener("mouseenter", () => { if (!roomPanelPinned) showRoomPanel(btn, name, false); });
          btn.addEventListener("mouseleave", () => hideRoomPanel(false));
          btn.addEventListener("focus", () => { if (!roomPanelPinned) showRoomPanel(btn, name, false); });
          btn.addEventListener("blur", () => hideRoomPanel(false));
          btn.addEventListener("click", e => {
            e.stopPropagation();
            const el = document.getElementById("room-panel");
            if (roomPanelPinned && el && !el.hidden) { roomPanelPinned = false; hideRoomPanel(true); }
            else showRoomPanel(btn, name, true);
          });
        });
      }
      addEventListener("click", () => { if (roomPanelPinned) { roomPanelPinned = false; hideRoomPanel(true); } });
      addEventListener("keydown", e => { if (e.key === "Escape") { roomPanelPinned = false; hideRoomPanel(true); } });

      function render() {
        state.route = currentRoute();
        const views = { landing:landingView, settings:settingsView, dashboard:dashboardView, board:boardView, forms:formsView, cfp:cfpView, portal:portalView, evaluation:evaluationView, reviewer:reviewerView, submissions:submissionsView,submissionDetail:submissionDetailView,submissionNew:submissionNewView,eventNew:eventNewView,onboarding:onboardingView,agenda:agendaView,publicAgenda:publicAgendaView,comms:commsView,venues:venuesView,taskTemplates:taskTemplatesView,importer:importerView,airtable:airtableView,apiTokens:apiTokensView,webhooks:webhooksView,apiDocs:apiDocsView,aiAssist:aiAssistView,publicSession:publicSessionView,publicSpeaker:publicSpeakerView,setupAgent:agentSetupView,claim:claimView,handoff:handoffView };
        // During the fresh-install walk the dashboard is the setup checklist, the
        // landing is the unclaimed-instance page, and screens with genuinely no
        // data render their empty state; everything else renders for real. While
        // peeking at the demo conference, the walk's overrides stand down.
        const inWalk = state.setup.active && !state.demoPeek;
        const showEmpty = showsEmptyState(state.route);
        const view = showEmpty ? null
          : inWalk && state.route === "dashboard" ? setupDashboardView
          : inWalk && state.route === "landing" ? freshLandingView
          : views[state.route];
        app.innerHTML = showEmpty ? emptyStateView(state.route) : view();
        modalRoot.innerHTML = "";
        hideRoomPanel(true); roomPanelPinned = false;
        bindCommon();
        bindRoomHeads();
        bindMdToolbars();
        const binder={landing:bindLanding,dashboard:bindDashboard,board:bindBoard,settings:bindSettings,venues:bindSettings,forms:bindForms,cfp:bindCfp,portal:bindPortal,evaluation:bindEvaluation,reviewer:bindReviewer,submissions:bindSubmissions,submissionDetail:bindSubmissionDetail,submissionNew:bindSubmissionNew,eventNew:bindEventNew,onboarding:bindOnboarding,agenda:bindAgenda,publicAgenda:bindPublicAgenda,comms:bindComms,taskTemplates:bindTaskTemplates,importer:bindImporter,airtable:bindAirtable,apiTokens:bindApiTokens,webhooks:bindWebhooks,apiDocs:bindApiDocs,aiAssist:bindAiAssist,claim:bindClaim,handoff:bindHandoff}[state.route];
        // The setup dashboard and fresh landing have no binder of their own —
        // bindCommon carries their links.
        if(!showEmpty && binder && !(inWalk && (state.route === "dashboard" || state.route === "landing"))) binder();
        window.scrollTo(0,0);
      }

      applyTheme();
      addEventListener("hashchange",render);
      addEventListener("keydown",e=>{
        if ((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k") { e.preventDefault(); openGlobalSearch(); }
        if (e.key==="/" && !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)) { e.preventDefault(); openGlobalSearch(); }
        if(e.key==="Escape"&&modalRoot.innerHTML){document.querySelector("[data-review-detail-modal]")?closeFullReviewSubmission():modalRoot.innerHTML="";}
        if (state.route==="reviewer" && /^[1-5]$/.test(e.key) && !["INPUT","TEXTAREA"].includes(document.activeElement?.tagName)) { const b=document.querySelector(`[data-score="${e.key}"]`);b?.click(); }
        if (state.route==="reviewer" && ["a","m","d"].includes(e.key.toLowerCase()) && !["INPUT","TEXTAREA"].includes(document.activeElement?.tagName)) { const labels={a:"Approve",m:"Maybe",d:"Deny"};document.querySelector(`[data-recommendation="${labels[e.key.toLowerCase()]}"]`)?.click(); }
      });
      render();
    })();
  </script>
</body>
</html>
