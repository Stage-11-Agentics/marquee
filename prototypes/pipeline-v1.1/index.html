    .room-row-main input:focus, .room-row-main select:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); outline:none; }
    .room-row-meta { display:grid; grid-template-columns:46px minmax(0,1fr); align-items:center; gap:9px; padding-left:27px; }
    .room-meta-label { font:600 9px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .room-row-meta input { width:100%; min-width:0; height:28px; border:1px solid var(--line); border-radius:var(--radius); padding:0 8px; background:var(--sunk); font-size:11.5px; }
    .room-row-meta input:focus { border-color:var(--accent); background:var(--panel); box-shadow:0 0 0 2px var(--accent-soft); outline:none; }
    .av-tags { display:flex; gap:5px; flex-wrap:wrap; }
    /* fixed width + constant weight: toggling a tag must not move its neighbours */
    .av-tag { min-width:132px; height:26px; padding:0 9px; border:1px solid var(--line-strong); border-radius:2px; background:var(--panel);
      color:var(--muted); font:400 10px/1 var(--mono); text-align:center; transition:background 110ms, border-color 110ms, color 110ms; }
    .av-tag:hover { border-color:var(--accent); color:var(--accent-dark); }
    .av-tag.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-dark); }

    /* Room label inside an agenda grid header: one line, ellipsised, so the
       header height is identical whether or not a building is assigned. */
    .room-head { display:flex; align-items:center; gap:6px; width:100%; min-width:0; padding:0; border:0; background:none;
      color:inherit; font:inherit; text-align:left; }
    .room-head-text { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .room-head-info { flex:0 0 auto; width:13px; height:13px; display:grid; place-items:center; border:1px solid var(--line-strong);
      border-radius:50%; color:var(--muted); font:600 8px/1 var(--mono); text-transform:none; letter-spacing:0; }
    .room-head:hover .room-head-text, .room-head:focus-visible .room-head-text { color:var(--accent-dark); }
    .room-head:hover .room-head-info, .room-head:focus-visible .room-head-info { border-color:var(--accent); color:var(--accent); }

    .room-panel { position:fixed; z-index:1100; width:280px; background:var(--panel); border:1px solid var(--accent);
      border-radius:var(--radius); padding:12px 13px; display:grid; gap:9px; box-shadow:none; }
    .room-panel[hidden] { display:none; }
    .rp-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
    .rp-head strong { font:600 12px/1.2 var(--mono); letter-spacing:.04em; }
    .rp-cap { color:var(--muted); font:400 10px/1 var(--mono); white-space:nowrap; }
    .rp-building { display:grid; gap:3px; }
    .rp-building strong { font-size:11.5px; font-weight:600; }
    .rp-building span { color:var(--muted); font-size:10.5px; line-height:1.45; }
    .rp-section { display:grid; gap:5px; }
    .rp-label { font:600 9px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .rp-tags { display:flex; gap:4px; flex-wrap:wrap; }
    .rp-tag { border:1px solid var(--line-strong); border-radius:2px; background:var(--sunk); color:var(--ink-soft);
      padding:2px 6px; font:400 9.5px/1.3 var(--mono); }
    .rp-notes { margin:0; font-size:11px; line-height:1.5; color:var(--ink-soft); }
    .rp-empty { color:var(--muted); font-size:10.5px; font-style:italic; }

    /* ── v1.7: venue map — tile mosaic, pins, walking lines ──────────────────
       A map with no map library. OSM raster tiles are plain <img> positioned on
       a fixed-width plane; pins and walking lines are drawn over it. The plane is
       centred and clipped so the box is fluid but never reflows on tile arrival,
       and when tiles fail the pins still read over the graph-paper grid. */
    .mq-map { position:relative; overflow:hidden; border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--sunk);
              background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:8px 8px; }
    .mq-plane { position:absolute; top:0; left:50%; transform:translateX(-50%); height:100%; }
    .mq-tile { position:absolute; width:256px; height:256px; filter:grayscale(1) contrast(.9) brightness(1.07); -webkit-user-drag:none; user-select:none; }
    .mq-map.no-tiles .mq-tile { display:none; }
    .mq-overlay { position:absolute; inset:0; pointer-events:none; overflow:visible; }
    .mq-pin { position:absolute; width:11px; height:11px; margin:-6px 0 0 -6px; border-radius:50%; background:var(--accent); border:2px solid var(--panel); box-shadow:0 0 0 1px var(--accent); }
    .mq-pin.muted { background:var(--muted); box-shadow:0 0 0 1px var(--muted); }
    .mq-pin-label { position:absolute; transform:translate(-50%,7px); white-space:nowrap; font:600 9px/1.6 var(--mono); letter-spacing:.06em; text-transform:uppercase;
                    background:var(--panel); border:1px solid var(--line-strong); border-radius:2px; padding:0 4px; color:var(--ink); }
    .mq-walk-line { stroke:var(--accent); stroke-width:1.5; stroke-dasharray:3 3; opacity:.8; }
    .mq-walk-label { fill:var(--ink); font:600 9px var(--mono); paint-order:stroke; stroke:var(--panel); stroke-width:3px; }
    .mq-attrib { position:absolute; right:3px; bottom:2px; z-index:2; font:400 8.5px/1.5 var(--mono); color:var(--muted); background:var(--panel); padding:0 3px; border-radius:2px; }
    .mq-map-empty { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:14px; color:var(--muted); font-size:10.5px; font-style:italic; }

    /* Venue overview list */
    .venue-item { display:grid; grid-template-columns:16px minmax(0,1fr) auto; gap:10px; align-items:baseline; padding:11px 0; border-bottom:1px solid var(--line); width:100%; text-align:left; background:none; border-left:0; border-right:0; border-top:0; cursor:pointer; }
    .venue-item:last-child { border-bottom:0; }
    .venue-item.active { background:var(--sunk); }
    .venue-item .vi-num { font:600 9px/1.7 var(--mono); color:var(--muted); }
    .venue-item strong { font-size:12px; font-weight:600; display:block; }
    .venue-item .vi-sub { color:var(--muted); font-size:10.5px; line-height:1.45; display:block; margin-top:2px; }
    .venue-item .vi-rooms { color:var(--ink-soft); font:400 10px/1.5 var(--mono); display:block; margin-top:4px; }
    .venue-stat { text-align:right; white-space:nowrap; font:600 13px/1.2 var(--mono); }
    .venue-stat span { display:block; font:400 9px/1.7 var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }

    /* Speaker-portal location card — zoom 2, the instruction set */
    .loc-line { display:grid; grid-template-columns:74px minmax(0,1fr); gap:10px; align-items:baseline; padding:6px 0; }
    .loc-label { font:600 9px/1.7 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .loc-value { font-size:12px; line-height:1.5; }
    .loc-leave { border:1px solid var(--accent); background:var(--accent-soft); border-radius:var(--radius); padding:9px 11px; font-size:12px; line-height:1.55; margin-top:4px; }
    .loc-leave b { font-family:var(--mono); font-weight:600; }

    /* Merge-field reference */
    .merge-fields { display:flex; flex-wrap:wrap; gap:4px; }
    .merge-chip { border:1px solid var(--line-strong); background:var(--sunk); border-radius:2px; font:400 9.5px/1.8 var(--mono); padding:0 5px; color:var(--ink-soft); cursor:pointer; }
    .merge-chip:hover { border-color:var(--accent); color:var(--accent); }

    /* Agenda building band — the grid encodes geography before any map does */
    .bb-seg { font:600 9px/2 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); background:var(--sunk);
              border-bottom:2px solid var(--accent); padding:0 8px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bb-seg.none { border-bottom-color:var(--line-strong); color:var(--muted); }
    .bb-spacer { border-bottom:2px solid transparent; }

    /* One building means nothing to compare, so the embedded map arrives folded */
    .map-fold { margin-bottom:12px; }
    .map-fold > summary { cursor:pointer; list-style:none; font:600 9px/2.4 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .map-fold > summary::-webkit-details-marker { display:none; }
    .map-fold > summary::before { content:"▸ "; }
    .map-fold[open] > summary::before { content:"▾ "; }
    .map-fold > summary:hover { color:var(--accent); }

    /* Building authoring: name/address on one line, coordinates below */
    .building-block { padding:10px 0; border-bottom:1px solid var(--line); }
    .building-block:last-child { border-bottom:0; }
    .building-block .building-row { border-bottom:0; padding:0; }
    .building-geo { display:grid; grid-template-columns:18px repeat(3, minmax(0,1fr)) minmax(0,2fr); gap:9px; align-items:end; margin-top:8px; }
    .building-geo label { font:600 9px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:4px; }
    .building-geo input { width:100%; min-width:0; height:28px; border:1px solid var(--line-strong); border-radius:var(--radius); padding:0 8px; background:var(--panel); font:400 11px var(--mono); }
    .building-geo input:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); outline:none; }
    .building-geo .bg-note { font:400 10px/1.5 var(--mono); color:var(--muted); }

    /* Dark-canvas overrides: `.track-tile span` out-specifies `.chip`, so light
       chips inherited the canvas's muted text colour (measured 2.2-2.3:1).
       Inherited from v1.4; fixed here rather than carried into the contract. */

    .track-tile .tile-actions button:hover { background: var(--canvas-btn-line); border-color: var(--canvas-accent); color: var(--canvas-tile-ink); }

    .form-section-row { display:flex; align-items:center; gap:9px; padding:9px 12px; background:var(--sunk); border:1px dashed var(--line-strong); border-radius:var(--radius); }

    .pacing-chart { width:100%; height:auto; display:block; }
    .pacing-readout { font:400 11px var(--mono); color:var(--muted); min-height:18px; display:flex; gap:14px; align-items:center; }

    .axis-toggle button { width:118px; }
    .impersonation-bar { display:flex; align-items:center; gap:9px; background:var(--ink); color:var(--on-ink-plain); padding:6px 14px; font:500 11px var(--sans); position:sticky; top:0; z-index:250; }

    .impersonation-bar .button:hover { border-color:var(--on-ink-hover); color:var(--on-ink-hover); }
    .notified-cell { font:400 10px var(--mono); color:var(--muted); white-space:nowrap; }
    .notified-cell.sent { color:var(--ink); }
    .notified-cell.gap { color:var(--warning); font-weight:600; }

      function exitFreshInstall() {
        if (state.demoPeek) endDemoPeek();

        state.emptyInstall = false;

      // The in-walk fork: look at the demo conference without leaving the walk.
      // Your fresh setup is stashed and restored exactly as you left it.
      function startDemoPeek() {
        if (state.demoPeek || !state.setupSnapshot) return;
        state.peekStash = snapshotLive(false);
        // The snapshot carries `instance` for the meta-level exit; the peek must
        // NOT apply it — the demo conference is being viewed on YOUR instance.
        const { instance, ...demoData } = state.setupSnapshot;
        restoreFrom(demoData);
        state.demoPeek = true;
      }
      function endDemoPeek() {
        if (!state.demoPeek) return;
        // Re-snapshot the demo first, so edits made while peeking survive the
        // eventual exit — the fork stays non-destructive in both directions.
        const inst = state.setupSnapshot.instance;
        state.setupSnapshot = snapshotLive(false);
        state.setupSnapshot.instance = inst;
        restoreFrom(state.peekStash);
        state.peekStash = null;
        state.demoPeek = false;
      }

      // The cold start, as one ordered list. Each step names the screen that

      // ── v1.8: submission pacing — the one dashboard analytic that drives a
      // real decision: do we extend the CFP? Cumulative intake this edition
      // against the prior edition (real Feb-2025 program capture), aligned by
      // days-before-event. The prior curve is aggregate reference data only.
      const PACING = (() => {
        const openT = 87, todayT = 63, closeT = 30;        // 2026 · opened Jul 17, today Aug 10, closes Sep 12
        const priorOpenT = 84, priorCloseT = 25;           // 2025 edition, aligned by days-before-event
        const curr = [], prior = [];
        let c = 0, p = 0;
        for (let t = 90; t >= 0; t--) {
          if (t <= openT && t >= todayT) c += 8 + Math.round(seededRandom(t * 3) * 14 + (openT - t < 4 ? 26 : 0));
          if (t <= priorOpenT && t >= priorCloseT) p += 5 + Math.round(seededRandom(t * 7) * 11 + (t - priorCloseT < 6 ? 24 : 0));
          curr.push({ t, n: t > openT ? 0 : (t < todayT ? null : c) });
          prior.push({ t, n: t > priorOpenT ? 0 : p });
        }
        const anchor = curr.find(d => d.t === todayT).n || 1;
        curr.forEach(d => { if (d.n != null) d.n = Math.round(d.n * 1040 / anchor); });
        return { curr, prior, openT, todayT, closeT, priorTotal: p };
      })();

      function pacingChart() {
        const W = 1100, H = 232, L = 50, R = 118, T = 14, B = 26, yMax = 1200;
        const x = t => L + (90 - t) / 90 * (W - L - R);
        const y = n => T + (1 - n / yMax) * (H - T - B);
        const path = pts => pts.filter(d => d.n != null).map((d, i) => `${i ? "L" : "M"}${x(d.t).toFixed(1)},${y(d.n).toFixed(1)}`).join(" ");
        const priorAtToday = PACING.prior.find(d => d.t === PACING.todayT).n;
        const delta = 1040 - priorAtToday;
        const ticks = [90, 60, 30, 0];
        const tickLabel = t => state.pacingAxis === "days" ? (t === 0 ? "Event" : `T−${t}`) : ({90:"Jul 14",60:"Aug 13",30:"Sep 12",0:"Oct 12"})[t];
        const currEnd = PACING.curr.find(d => d.t === PACING.todayT), priorEnd = PACING.prior.find(d => d.t === 0);
        return `
          <div class="pacing-readout" id="pacing-readout" data-default="T−${PACING.todayT} · <strong>2026: 1,040</strong> · 2025 edition: ${priorAtToday.toLocaleString()} · <strong>${delta >= 0 ? "+" + delta.toLocaleString() : delta.toLocaleString()} vs prior</strong> — on pace, no extension needed">T−${PACING.todayT} · <strong>2026: 1,040</strong> · 2025 edition: ${priorAtToday.toLocaleString()} · <strong>${delta >= 0 ? "+" + delta.toLocaleString() : delta.toLocaleString()} vs prior</strong> — on pace, no extension needed</div>
          <svg class="pacing-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative submissions, this edition versus the 2025 edition" id="pacing-svg">
            ${[0, 400, 800, 1200].map(n => `<line x1="${L}" y1="${y(n)}" x2="${W - R}" y2="${y(n)}" stroke="var(--line)" stroke-width="1"></line><text x="${L - 7}" y="${y(n) + 3}" text-anchor="end" style="font:400 9px var(--mono);fill:var(--muted)">${n ? (n / 1000).toFixed(1).replace(".0", "") + (n >= 1000 ? "k" : "") : "0"}</text>`).join("")}
            ${ticks.map(t => `<text x="${x(t)}" y="${H - 8}" text-anchor="middle" style="font:400 9px var(--mono);fill:var(--muted)">${tickLabel(t)}</text>`).join("")}
            <line x1="${x(PACING.closeT)}" y1="${T}" x2="${x(PACING.closeT)}" y2="${H - B}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2 3"></line>
            <text x="${x(PACING.closeT)}" y="${T - 3}" text-anchor="middle" style="font:600 8px var(--mono);letter-spacing:.1em;fill:var(--muted)">CFP CLOSES</text>
            <path d="${path(PACING.prior)}" fill="none" stroke="var(--break-tint)" stroke-width="2" stroke-dasharray="5 4"></path>
            <path d="${path(PACING.curr)}" fill="none" stroke="var(--accent)" stroke-width="2"></path>
            <circle cx="${x(currEnd.t)}" cy="${y(currEnd.n)}" r="3.5" fill="var(--accent)"></circle>
            <text x="${x(currEnd.t) + 8}" y="${y(currEnd.n) - 6}" style="font:600 10px var(--mono);fill:var(--accent)">2026 · 1,040 today</text>
            <text x="${x(priorEnd.t) + 8}" y="${y(priorEnd.n) + 3}" style="font:600 10px var(--mono);fill:var(--muted)">2025 · ${priorEnd.n.toLocaleString()} final</text>
            <line id="pacing-cross" x1="0" y1="${T}" x2="0" y2="${H - B}" stroke="var(--ink)" stroke-width="1" visibility="hidden"></line>
            <rect id="pacing-hover" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"></rect>
          </svg>`;
      }

      const programBoardStages = [
        {name:"Submitted",hint:"Received and waiting"},
        {name:"In Review",hint:"Committee work underway"},
        {name:"Waved",hint:"Decision wave prepared"},
        {name:"Accepted",label:"Ready to place",hint:"Accepted and ready for scheduling"},
        {name:"Onboarding",hint:"Speaker work underway",derived:true,entry:"Open an accepted record to manage speaker tasks and onboarding."},
        {name:"Scheduled",hint:"Placed on working agenda",derived:true,entry:"Open an accepted record, then choose Place on agenda."},
        {name:"Published",hint:"Live on public site",derived:true,entry:"Open a scheduled record, then choose Publish Session."}
      ];

      function filteredBoardSubmissions() {
        const q=state.boardSearch.trim().toLowerCase();
        return state.submissions.filter(s=>s.status!=="Draft" &&
          (!q||[s.id,s.title,s.company,...s.speakers].some(value=>String(value).toLowerCase().includes(q))) &&
          (state.boardType==="All types"||`${s.entity}s`===state.boardType) &&
          (state.boardTrack==="All tracks"||(s.tracks||[s.track]).includes(state.boardTrack)) &&
          (state.boardFormat==="All formats"||s.format===state.boardFormat) &&
          (state.boardWave==="All waves"||(state.boardWave==="Unwaved"?!s.wave:`Wave ${s.wave}`===state.boardWave))
        );
      }

      function boardCard(submission) {
        const actualStatus = submission.status!==boardStageFor(submission) ? `<span class="chip">${submission.status==="Waitlisted"?"Maybe":esc(submission.status)}</span>` : "";
        return `<article class="board-card" role="link" tabindex="0" data-board-card="${submission.id}" data-board-record="${submission.id}" aria-label="Open ${esc(submission.id)}: ${esc(submission.title)}" style="--track-color:${trackColor(submission.track)}"><div style="display:flex;align-items:center;justify-content:space-between;gap:6px"><span class="chip ${submission.entity==="Session"?"session":""}">${submission.entity}</span>${actualStatus}</div><h3>${esc(submission.title)}</h3><p>${esc(submission.speakers.join(" · "))}</p>${trackChips(submission,true)}${scheduleMeta(submission,true,false)}<div class="board-card-foot"><span>${esc(submission.format)} · ${submission.wave?`Wave ${submission.wave}`:"Unwaved"}</span><strong>${formatTimeInStage(submission.timeInStageHours)}</strong></div></article>`;
      }

          </div></div></div></section>
        </div>`);

      function showLifecycleTransition(id,targetStage) {
        const submission=state.submissions.find(s=>s.id===id); if(!submission)return;
        const fromStage=boardStageFor(submission); if(fromStage===targetStage){toast(`${submission.id} is already in ${targetStage}`);return;}
        const slot=sessionSlot(submission), accepting=targetStage==="Accepted";
        modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div class="eyebrow">Lifecycle transition</div><h2>Move ${esc(submission.id)} to ${esc(targetStage)}?</h2><p>${esc(fromStage)} → ${esc(targetStage)} · the record updates only after confirmation.</p></div><div class="modal-body stack"><div class="message-preview"><strong>${esc(submission.title)}</strong><br><span class="subtle">${esc(submission.speakers.join(" · "))}</span></div>${accepting?`<div class="wave-row"><strong>Portal + acceptance email</strong><span></span><strong>Queue</strong></div><div class="wave-row"><strong>Speaker task set</strong><span></span><strong>Assign</strong></div>`:""}${slot?`<div class="wave-row"><strong>Agenda + public surfaces</strong><span></span><strong class="chip overdue">Remove</strong></div>`:""}<p class="subtle">The transition is stamped in history. Existing review evidence remains attached to the record.</p></div><div class="modal-actions"><button class="button" id="cancel-lifecycle-transition">Cancel</button><button class="button primary" id="confirm-lifecycle-transition">Move to ${esc(targetStage)}</button></div></section></div>`;
        document.getElementById("cancel-lifecycle-transition").onclick=()=>modalRoot.innerHTML="";
        document.getElementById("confirm-lifecycle-transition").onclick=()=>{
          if(slot)state.scheduled=state.scheduled.filter(item=>item.id!==submission.id);
          submission.boardStage=targetStage;
          submission.timeInStageHours=1;
          if(targetStage==="Submitted"){submission.status="Submitted";submission.accepted=false;submission.wave=null;}
          if(targetStage==="In Review"){submission.status="In Review";submission.accepted=false;}
          if(targetStage==="Waved"){submission.status="Waitlisted";submission.accepted=false;submission.wave=submission.wave||2;}
          if(targetStage==="Accepted"){submission.status="Accepted";submission.accepted=true;submission.wave=submission.wave||2;submission.waveDate=submission.waveDate||waveDates[submission.wave-1];ensureOnboardingSpeaker(submission);}
          modalRoot.innerHTML="";
          toast(`${submission.id} moved to ${targetStage} · history stamped`);
          render();
        };
      }

      function bindBoard() {
        let searchTimer;document.getElementById("board-search")?.addEventListener("input",e=>{state.boardSearch=e.target.value;const cursor=e.target.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const next=document.getElementById("board-search");next?.focus();next?.setSelectionRange?.(cursor,cursor);},80);});
        document.getElementById("board-type-filter")?.addEventListener("change",e=>{state.boardType=e.target.value;render();});
        document.getElementById("board-track-filter")?.addEventListener("change",e=>{state.boardTrack=e.target.value;render();});
        document.getElementById("board-format-filter")?.addEventListener("change",e=>{state.boardFormat=e.target.value;render();});
        document.getElementById("board-wave-filter")?.addEventListener("change",e=>{state.boardWave=e.target.value;render();});
        document.getElementById("clear-board-filters")?.addEventListener("click",()=>{state.boardSearch="";state.boardType="All types";state.boardTrack="All tracks";state.boardFormat="All formats";state.boardWave="All waves";render();});
        document.querySelectorAll("[data-board-record]").forEach(card=>{const open=()=>navigate(`submissions/${card.dataset.boardRecord}`);card.addEventListener("click",open);card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});});
      }

      function pipelineCounts() {
        const result = { Submitted: 0, "In Review": 0, Accepted: 0, Scheduled: 0, Published: 0, AcceptedTotal: 0, ReadyToPlace: 0 };
        state.submissions.forEach(s => { if (result[s.status] !== undefined) result[s.status]++; if (s.accepted) { result.AcceptedTotal++; if (boardStageFor(s) === "Accepted") result.ReadyToPlace++; } });
        result.Scheduled += result.Published;
        return result;
      }
      function pipelineStage(name, count, note, filter, route = "submissions", meaning = "") {
        return `<button class="pipeline-stage" data-pipeline-filter="${esc(filter)}" data-pipeline-route="${route}"><span class="pipeline-name">${esc(name)}</span><strong class="pipeline-count">${count.toLocaleString()}</strong><span class="pipeline-delta">${esc(note)} →</span>${meaning?`<span class="pipeline-meaning">${esc(meaning)}</span>`:""}</button>`;
      }
      // "Still owes something" means a task that is neither done nor cancelled.
      // Every count on the chase board goes through this predicate, so a
      // cancelled task cannot make a speaker look behind on work nobody wants.
      function owesTask(s) { return s !== "done" && s !== "cancelled"; }
      function onboardingCounts() {
        return {
          incomplete:onboardingSpeakers.filter(p=>p.statuses.some(owesTask)).length,
          overdue:onboardingSpeakers.filter(p=>p.statuses.includes("overdue")||p.statuses.includes("risk")).length,
          overdueTasks:onboardingSpeakers.reduce((n,p)=>n+p.statuses.filter(s=>s==="overdue"||s==="risk").length,0),
          risk:onboardingSpeakers.filter(p=>p.statuses.includes("risk")).length
        };
      }
      function notNotifiedCount() { return state.submissions.filter(s => s.notifyGap).length; }
      // A record with no address cannot be notified by any button, so the count
      // on the action says what will actually happen rather than what we wish did.
      function sendableGap() { return state.submissions.filter(s => s.notifyGap && s.notifyGap !== "no-recipient").length; }
      function acceptedByWave(wave) { return state.submissions.filter(s => s.accepted && s.wave === wave).length; }
      function unreviewedTrackCount(track) { return state.submissions.filter(s => ["Submitted","In Review"].includes(s.status) && (s.tracks||[s.track]).includes(track)).length; }
      function waveRow(name, date, count, target) {
        return `<div class="wave-row"><div><strong style="font-size:12px">${name}</strong><div class="wave-date">${date}</div></div><div><div class="wave-bar"><i style="width:${Math.min(100, Math.round(count / target * 100))}%"></i></div><div class="wave-date">${count} accepted</div></div><strong class="tabular" style="text-align:right;font-size:11px">${target} target</strong></div>`;
      }

      function settingsTabs(active) {
        const tabs = [["settings","Conference"],["settings/venues","Venues"],["settings/tasks","Task templates"],["settings/airtable","Airtable"],["settings/api","API tokens"],["settings/webhooks","Webhooks"]];
        return `<nav class="route-tabs">${tabs.map(([href,label])=>`<a class="button ${routeKey(href)===active?"active":""}" href="#${href}">${esc(label)}</a>`).join("")}</nav>`;
      }

      // The venue overview. With one building this is a single pin and a room
      // list — reachable, never insisted upon. With several it is the only screen
      // that shows the conference as a place rather than a schedule.
      function venuesView() {
        const remote = buildings.filter(b=>!hasPin(b));
        return shell(`<div class="page">
          ${pageHead("Venues", "Buildings, coordinates, entrance instructions, and rooms. Walking times and transit conflicts come from what you set here.", `<a class="button" href="#agenda">Open agenda</a><button class="button primary" id="save-venues">Save venues</button>`)}
          ${settingsTabs("venues")}
          <section class="card"><div class="card-head"><div><h2>Site map</h2><span class="subtle">${geoActive()?"Dashed lines are walking time between buildings, on the street grid":"Pin a second building and walking times appear here"}</span></div><span class="chip">${pinnedBuildings().length} of ${buildings.length} pinned</span></div>
            <div class="card-body">${venueMap(buildings,{width:1100,height:360,walk:geoActive(),focus:state.venueFocus})}
              ${remote.length?`<span class="subtle" style="display:block;margin-top:9px">${remote.map(b=>esc(b.name)).join(" · ")} ${remote.length===1?"has":"have"} no location — streamed and remote venues never take a pin.</span>`:""}</div></section>
          <div style="margin-top:14px">${buildingsCard()}</div>
          <div style="margin-top:14px">${roomsCard()}</div>
        </div>`);
      }

      // Buildings and rooms are authored on the Venues screen — a tab named for
      // them that could not edit them was the defect worth fixing.
      function sessionsToday(b) {
        return state.scheduled.filter(s=>s.kind!=="break" && s.day===state.agendaDay && buildingForRoom(s.room)?.id===b.id).length;
      }
      function buildingsCard() { return `<section class="card" style="grid-column:1/-1"><div class="card-head"><div><h2>Buildings</h2><span class="subtle">Coordinates drive walking times, transit conflicts, and the map above</span></div><button class="button small" id="add-building">+ Add building</button></div><div class="card-body">${buildings.map((b,i) => `<div class="building-block"><div class="building-row"><span class="drag-handle">${i+1}</span><input aria-label="Building name" data-building-name="${b.id}" value="${esc(b.name)}"><input aria-label="Building address" data-building-address="${b.id}" value="${esc(b.address)}" placeholder="Street address, floor, entrance notes"><span class="building-rooms tabular">${roomsInBuilding(b.id)} ${roomsInBuilding(b.id)===1?"room":"rooms"}${sessionsToday(b)?` · ${sessionsToday(b)} today`:""}</span><button class="button small" data-remove-building="${b.id}" ${buildings.length<=1?"disabled":""}>Remove</button></div><div class="building-geo"><span></span><div><label for="lat-${b.id}">Latitude</label><input id="lat-${b.id}" data-building-lat="${b.id}" value="${b.lat==null?"":b.lat}" placeholder="40.75600"></div><div><label for="lng-${b.id}">Longitude</label><input id="lng-${b.id}" data-building-lng="${b.id}" value="${b.lng==null?"":b.lng}" placeholder="-73.98923"></div><div><label for="acc-${b.id}">Minutes to get in</label><input id="acc-${b.id}" data-building-access="${b.id}" type="number" min="0" step="1" value="${b.accessMinutes||0}"></div><div><label for="note-${b.id}">Entrance note</label><input id="note-${b.id}" data-building-note="${b.id}" value="${esc(b.accessNote||"")}" placeholder="Doors, ID, lifts — shown to speakers"></div></div></div>`).join("")}</div></section>`; }
      function roomsCard() { return `<section class="card" style="grid-column:1/-1"><div class="card-head"><div><h2>Rooms</h2><span class="subtle">Capacity, building, AV capability, and the notes an ops lead needs on the day</span></div><button class="button small" id="add-room">+ Add room</button></div><div class="card-body">${rooms.map((r,i) => `<div class="room-row"><div class="room-row-main"><span class="drag-handle">${i+1}</span><input aria-label="Room name" data-room-name="${i}" value="${esc(r)}"><input aria-label="Room capacity" data-room-capacity="${i}" type="number" min="1" step="1" value="${state.roomCapacities[i]}"><select aria-label="Building" data-room-building="${i}"><option value="">Unassigned</option>${buildings.map(b=>`<option value="${b.id}" ${state.roomBuildings[i]===b.id?"selected":""}>${esc(b.name)}</option>`).join("")}</select><button class="button small" data-remove-room="${i}" ${rooms.length<=1?"disabled":""}>Remove</button></div><div class="room-row-meta"><span class="room-meta-label">AV</span><div class="av-tags">${AV_TAGS.map(tag=>`<button class="av-tag ${(state.roomAV[i]||[]).includes(tag)?"on":""}" data-room-av="${i}" data-av-tag="${esc(tag)}" aria-pressed="${(state.roomAV[i]||[]).includes(tag)?"true":"false"}">${esc(tag)}</button>`).join("")}</div></div><div class="room-row-meta"><span class="room-meta-label">Notes</span><input aria-label="Room notes" data-room-notes="${i}" value="${esc(state.roomNotes[i]||"")}" placeholder="Access, load-in, quirks — shown on the agenda and to speakers"></div></div>`).join("")}</div></section>`; }

      // Organizers are instance-level people, surfaced inside Conference
      // settings because that is where an organizer already looks. Invites are
      // one-time links the owner hands over on any channel — the same trick as
      // the claim link, so a co-organizer can join before mail exists.
      function organizersCard() {
        const orgs = state.instance.organizers;
        const dash = w => `<span class="subtle" style="display:inline-block;width:${w}px;text-align:center">—</span>`;
        return `<section class="card"><div class="card-head"><div><h2>Organizers</h2><span class="subtle">Everyone who can run this instance · invites are links, never dependent on mail</span></div><button class="button small" id="invite-organizer">+ Invite additional organizer</button></div>
          <div class="card-body" style="padding-top:2px;padding-bottom:2px">
            ${orgs.length ? orgs.map((o,i)=> o.pending
              ? `<div class="org-row"><span class="org-name">Invite link minted<span class="org-note">${esc(o.minted)} · single use · expires in 7 days</span></span><span class="org-email">—</span><span class="chip">Pending</span><button class="button small" data-revoke-invite="${i}" style="width:76px">Revoke</button></div>`
              : `<div class="org-row"><span class="org-name">${esc(o.name)}${o.you?` <span class="chip" style="width:auto;margin-left:4px">you</span>`:""}<span class="org-note">${esc(o.note||"")}</span></span><span class="org-email">${esc(o.email)}</span><span class="chip ${o.role==="Owner"?"published":""}">${esc(o.role)}</span>${o.role==="Owner"?dash(76):`<button class="button small" data-remove-organizer="${i}" style="width:76px">Remove</button>`}</div>`).join("")
            : `<div class="org-row"><span class="org-name">No organizers yet<span class="org-note">Claiming the instance creates the first owner</span></span><span class="org-email">—</span><span class="chip">—</span>${dash(76)}</div>`}
          </div></section>`;
      }

      function settingsView() {
        return shell(`<div class="page">
          ${pageHead("Conference settings", "The conference record is inherited by forms, portals, agenda times, and calendar invites.", `<button class="button" id="preview-branding">Preview branding</button><button class="button primary" id="save-settings">Save conference settings</button>`)}
          ${settingsTabs("settings")}
          <div class="grid-2">
            <section class="card"><div class="card-head"><h2>Conference details</h2><span class="chip published"><span class="dot"></span> Published</span></div><div class="card-body stack">
              <div class="field"><label for="event-name">Conference name</label><input id="event-name" value="${esc(state.event.name)}"></div>

              <div class="field"><label for="event-timezone">Timezone</label><select id="event-timezone"><option selected>America/New_York</option><option>America/Los_Angeles</option><option>Europe/London</option></select><span class="field-note">Agenda and calendar invites inherit this timezone.</span></div>
              <div class="field"><label for="event-submission-limit">Submissions per person · conference default</label><input id="event-submission-limit" type="number" min="1" max="10" value="${state.event.submissionLimit||3}" style="width:80px"><span class="field-note">Applies when a form sets no limit of its own. Saved drafts count toward it.</span></div>
            </div></section>
            ${organizersCard()}
            <section class="card"><div class="card-head"><h2>Formats</h2><button class="button small" id="add-format">+ Add format</button></div><div class="card-body" id="format-settings">
              ${formats.map((f,i) => `<div class="settings-row" data-format-index="${i}"><span class="drag-handle">⋮</span><input aria-label="Format name" data-format-name="${i}" value="${esc(f)}"><input aria-label="Allowed range" data-format-range="${i}" value="${esc(formatRanges[f]||"15–30")}"><label class="field" style="display:flex;align-items:center;gap:4px"><input aria-label="Default duration" data-format-duration="${i}" type="number" min="5" max="180" value="${formatDurations[f]}"><span class="subtle">min</span></label></div>`).join("")}
            </div></section>
            <section class="card"><div class="card-head"><div><h2>Tracks</h2><span class="subtle">Drag to reorder · edit names and colors in place</span></div><button class="button small" id="add-track">+ Add track</button></div><div class="card-body" id="track-settings">${tracks.map((t,i) => `<div class="settings-row" draggable="true" data-track-index="${i}"><button class="drag-button" aria-label="Drag ${esc(t.name)}">⋮⋮</button><input aria-label="Track name" data-track-name="${i}" value="${esc(t.name)}"><input aria-label="Track color" data-track-color="${i}" type="color" value="${t.color}"><span class="chip" style="border-left:3px solid ${t.color}">${i+1}</span></div>`).join("")}</div></section>
            <section class="card"><div class="card-head"><div><h2>Tags</h2><span class="subtle">Free taxonomy · chips on rows, a multi-select on forms</span></div><button class="button small" id="add-tag">+ Add tag</button></div><div class="card-body" id="tag-settings">${sessionTags.map((t,i) => `<div class="settings-row" data-tag-index="${i}"><span class="drag-handle">${i+1}</span><input aria-label="Tag name" data-tag-name="${i}" value="${esc(t)}"><span class="chip">${state.submissions.filter(s=>(s.tags||[]).includes(t)).length} tagged</span></div>`).join("")}</div></section>
            <section class="card"><div class="card-head"><div><h2>Levels</h2><span class="subtle">Audience experience · a single-select on forms</span></div><button class="button small" id="add-level">+ Add level</button></div><div class="card-body" id="level-settings">${levels.map((l,i) => `<div class="settings-row" data-level-index="${i}"><span class="drag-handle">${i+1}</span><input aria-label="Level name" data-level-name="${i}" value="${esc(l)}"><span class="chip">${state.submissions.filter(s=>s.level===l).length}</span></div>`).join("")}</div></section>
            <section class="card" style="grid-column:1/-1"><div class="card-head"><div><h2>Venues and rooms</h2><span class="subtle">Buildings, coordinates, entrance instructions, and rooms live on their own screen</span></div><a class="button small" href="#settings/venues">Open Venues →</a></div><div class="card-body"><span class="subtle">${buildings.length} ${buildings.length===1?"building":"buildings"} · ${rooms.length} ${rooms.length===1?"room":"rooms"}${geoActive()?` · ${pinnedBuildings().length} pinned`:""}</span></div></section>
          </div>
        </div>`);
      }

      function formsView() {
        const activeForm=state.forms.find(form=>form.id===state.activeFormId)||state.forms[0];
        return shell(`<div class="page">
          ${pageHead("Forms", `${state.forms.length} conference ${state.forms.length===1?"form":"forms"} · each has its own audience, fields, rules, response state, and public or private link.`, `<button class="button" id="duplicate-form">Duplicate</button><button class="button" id="new-form">+ New form</button><button class="button primary" id="publish-form">Publish changes</button>`)}
          <section class="form-catalog" aria-label="Conference forms">${state.forms.map(form=>`<button class="form-catalog-card ${form.id===state.activeFormId?"active":""}" data-form-id="${form.id}"><span class="chip ${form.status==="Open"?"published":""}">${form.status}</span><strong>${esc(form.name)}</strong><small>${esc(form.detail)}<br>${form.responses.toLocaleString()} ${form.responses===1?"response":"responses"} · collects ${form.target}s</small></button>`).join("")}</section>
          <div class="message-preview" style="margin-bottom:14px"><strong>Editing · ${esc(activeForm.name)}</strong><br><span class="subtle">${esc(activeForm.detail)} · changes and publication are isolated to this form.</span></div>
          <div class="builder">

              ${["Type & basics","Welcome","Form fields","Participants","Rules & routing","Messages","Publish"].map((s,i) => `<button class="builder-step ${state.builderStep === i ? "active" : ""}" data-builder-step="${i}"><span class="step-number">${i+1}</span><span>${s}</span></button>`).join("")}
              <div class="divider"></div>
              <div class="field"><label>Collects</label><div class="segment"><button data-form-target="Abstract" class="${state.formTarget === "Abstract" ? "active" : ""}">Abstracts</button><button data-form-target="Session" class="${state.formTarget === "Session" ? "active" : ""}">Sessions</button></div><span class="field-note">${state.formTarget === "Abstract" ? "Enters the evaluation pipeline." : "Bypasses evaluation; ready for agenda."}</span></div>
              <div class="divider"></div>

              <div class="field"><label>Submissions per person</label><input id="form-limit" type="number" placeholder="${state.event.submissionLimit||3}" min="1" max="10"><span class="field-note">Conference default: ${state.event.submissionLimit||3} · applies when this form sets none. Saved drafts count.</span></div>
            </section>
            ${builderCenterView()}
              <section class="card preview-card"><div class="card-head"><h2>Live preview</h2><span class="chip">Public</span></div><div class="preview-window"><div class="preview-top"><i></i><i></i><i></i></div><div class="preview-form"><div class="eyebrow">${esc(state.event.name || "Your conference")}</div><h3>Call for speakers</h3><p>${state.formTarget === "Abstract" ? "Share an idea for the program." : "Add a guaranteed session to the program."}</p>${state.builderFields.slice(0,6).map(f => f.kind==="Divider" ? `<div style="border-top:1px solid var(--line-strong);margin:11px 0"></div>` : f.element ? `<div style="margin:11px 0 8px;font:600 8px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">${esc(f.label)}</div>` : `<div style="margin-bottom:13px"><strong style="font-size:9px">${esc(f.label)}${f.required ? " *" : ""}</strong><div class="preview-input"></div></div>`).join("")}<button class="button primary small" data-route="cfp">Open complete form</button></div></div></section>
          </div>
        </div>`);
      }

      function builderCenterView() {
        if(state.builderStep===2)return `<section class="card"><div class="card-head"><div><h2>Form fields</h2><span class="subtle">Drag a field or use its arrows to reorder · section elements break up a long form</span></div><span class="chip ${state.formTarget === "Session" ? "session" : ""}">${state.formTarget}</span></div><div class="form-fields">${state.builderFields.map((f,i) => {
          const controls=`<div class="field-controls"><button aria-label="Move up" data-move-field="up" data-id="${f.id}" ${i === 0 ? "disabled" : ""}>↑</button><button aria-label="Move down" data-move-field="down" data-id="${f.id}" ${i === state.builderFields.length-1 ? "disabled" : ""}>↓</button></div>`;
          if(f.kind==="Divider")return `<div class="form-divider-row" draggable="true" data-field-drag="${f.id}" data-field-id="${f.id}"><span class="drag-handle">⋮⋮</span><i></i><span class="section-kind">Divider</span><i></i>${controls}</div>`;
          if(f.element)return `<div class="form-section-row" draggable="true" data-field-drag="${f.id}" data-field-id="${f.id}"><span class="drag-handle">⋮⋮</span><span class="section-kind">Section</span><strong>${esc(f.label)}</strong><span style="flex:1"></span>${controls}</div>`;
          return `<div class="form-field-row ${state.builderActive === f.id ? "active" : ""}" draggable="true" data-field-drag="${f.id}" data-field-id="${f.id}"><span class="drag-handle">⋮⋮</span><div><strong style="font-size:11px">${esc(f.label)}${f.required ? " *" : ""}</strong><div class="field-kind">${esc(f.kind)} · ${f.required ? "Required" : "Optional"}</div></div>${controls}</div>`;
        }).join("")}<div style="display:flex;gap:8px"><button class="add-field" id="add-field" style="flex:1">＋ Add a field</button><button class="add-field" id="add-section-element" style="flex:1">＋ Add section element</button></div></div></section>`;
        const panels=[
          ["Type & basics",`<div class="field"><label>Internal form name</label><input value="Call for speakers · 2026 main CFP"><span class="field-note">How your team tells twenty forms apart. Never shown publicly.</span></div><div class="field"><label>External form title</label><input value="Call for speakers"><span class="field-note">The public page title submitters see.</span></div><div class="field"><label>Public slug</label><input value="aie-nyc-2026"></div>`],
          ["Welcome",`<div class="field"><label>Headline</label><input value="Share your work with AIE NYC."></div><div class="field"><label>Welcome copy</label>${mdToolbar("builder-welcome-copy")}<textarea id="builder-welcome-copy">We welcome **practical, specific** sessions for people building and operating AI systems.</textarea><span class="field-note">Rendered above the first field of the public form.</span></div>`],

          ["Participants",`<div class="grid-2"><div class="field"><label>Minimum speakers</label><input type="number" value="1" min="1"></div><div class="field"><label>Maximum speakers</label><input type="number" value="4" min="1"></div></div><span class="field-note">One speaker minimum is the default on every new form.</span>`],
          ["Rules & routing",`<div class="field"><label>Rule</label><select><option>Track is AI in Financial Services</option></select></div><div class="field"><label>Route to</label><select><option>AIE 2026 program review · Initial screen</option></select></div><label class="toggle-line"><span>Vendor content flag routes to workshop review</span><input type="checkbox" checked></label>`],

        else content=`${switcher}<div class="eyebrow">${resumed?"Draft restored from private email link · saved 2 hours ago":"Call for speakers · closes Sep 12"}</div><h1>${resumed?"Finish your proposal.":"Share your work with AIE NYC."}</h1><p>${mdToHtml("We welcome **practical, specific** sessions for people building and operating AI systems. You can submit without an account and return to a saved draft by email.")}</p>

            <div class="field"><label for="cfp-outcome">What will attendees learn? *</label><textarea id="cfp-outcome" placeholder="A concrete outcome">${resumed?"A practical evidence ladder and escalation checklist.":""}</textarea><div class="field-error" id="error-outcome"></div></div>
            <div class="field"><label for="cfp-format">Format *</label><select id="cfp-format"><option value="">Choose a format</option>${formats.map(f=>`<option ${resumed&&f==="Stage Talk"?"selected":""}>${f}</option>`).join("")}</select><div class="field-note">One speaker minimum · up to four</div><div class="field-error" id="error-format"></div></div>

            <div class="grid-2"><div class="field"><label for="cfp-level">Audience level</label><select id="cfp-level"><option value="">Choose a level</option>${levels.map(l=>`<option ${resumed&&l==="Intermediate"?"selected":""}>${esc(l)}</option>`).join("")}</select></div><div class="field"><label id="cfp-tags-label">Tags</label><div class="track-picker" role="group" aria-labelledby="cfp-tags-label">${sessionTags.map(t=>`<button type="button" data-cfp-tag="${esc(t)}" class="${resumed&&t==="Case study"?"active":""}" aria-pressed="${resumed&&t==="Case study"?"true":"false"}">${esc(t)}</button>`).join("")}</div></div></div>

            <div class="grid-2"><div class="field"><label for="cfp-role">Role / title *</label><input id="cfp-role" value="${resumed?"Director of Applied AI":""}"><div class="field-error" id="error-role"></div></div><div class="field"><label for="cfp-company">Company / affiliation *</label><input id="cfp-company" value="${resumed?"Capital One":""}"><div class="field-error" id="error-company"></div></div></div>

            <div class="field" id="cfp-product-field" style="${state.cfpVendorContent==="Yes"?"":"display:none"}"><label for="cfp-product">Which product or service? *</label><input id="cfp-product" value="${resumed?"":""}"><span class="field-note">This conditional answer routes the proposal to workshop review.</span><div class="field-error" id="error-product"></div></div>

        return `<div class="public-shell"><header class="public-top"><a class="public-event" href="#landing"><span class="brand-mark">M</span>${esc(state.event.name)}</a><button class="button small" data-cfp-state="resumed">Resume draft</button></header><main class="public-body"><section class="public-card" id="cfp-card">${content}</section></main></div>`;

      // A cancelled task is neither open nor done. It keeps completed_at — work
      // already finished stays finished — and drops out of every count, every
      // chase, and every reminder. `live` is the set that still owes something.
      function liveTasks() { return state.tasks.filter(t => !t.cancelledAt); }
      function cancelledTasks() { return state.tasks.filter(t => t.cancelledAt); }

      function portalView() {
        const live = liveTasks(), cancelled = cancelledTasks();
        const done = live.filter(t => t.done).length;
        const overdue = live.filter(t => t.overdue && !t.done).length;
        return `<div class="public-shell">${state.impersonating?`<div class="impersonation-bar"><span>Viewing the portal as <strong>Amara van der Meer</strong> — organizer session unchanged</span><span style="flex:1"></span><button class="button small" id="back-to-admin">← Back to Admin Mode</button></div>`:""}<header class="public-top"><a class="public-event" href="#landing"><span class="brand-mark">M</span>${esc(state.event.name)} · Speaker portal</a><a class="button small" href="#landing">Sign out</a></header><main class="public-body wide">
          <div class="portal-head"><div><div class="eyebrow">Welcome back</div><h1>Amara van der Meer</h1><span class="subtle">Your status, tasks, profile, and conference details in one place.</span></div><div class="portal-progress"><strong style="font-size:12px">${done} of ${live.length} tasks done</strong><div class="progress-track"><i style="width:${live.length?done/live.length*100:100}%"></i></div></div></div>
          ${portalSubmissionCard()}
          ${portalDecisionFeedback()}
          ${portalLocationCard()}
          <div class="portal-grid">
            <section class="card"><div class="card-head"><div><h2>Your tasks</h2><span class="subtle">${overdue?"Complete the overdue item first":live.length?"Nothing overdue right now":"Nothing outstanding"}</span></div><span class="chip ${overdue?"overdue":""}">${overdue} overdue</span></div><div class="card-body" id="task-list">${live.length?live.map(taskRow).join(""):`<p class="subtle" style="margin:0">You have no outstanding tasks.</p>`}${cancelled.length?`<div class="cancelled-block"><span class="eyebrow">Cancelled · ${cancelled.length}</span><p class="cancelled-reason">${esc(state.taskCancellation?.reason||"These are no longer needed.")} You do not need to do anything with them, and anything you already finished stays finished.</p>${cancelled.map(taskRow).join("")}</div>`:""}</div></section>
            <div class="stack">
              <section class="card"><div class="card-head"><h2>Speaker profile</h2><button class="button small" id="edit-profile">Edit</button></div><div class="card-body"><div class="profile-block"><div class="avatar">AV</div><strong>Amara van der Meer</strong><div class="subtle" style="margin-top:4px">she/her · Director of Applied AI · Capital One</div></div><p class="subtle" style="line-height:1.55">Amara builds evaluation and governance systems for AI teams operating in regulated environments.</p><div class="subtle" style="margin-top:9px;display:flex;gap:11px"><span>in LinkedIn</span><span>𝕏 @amara_vdm</span><span>↗ amara.dev</span></div></div></section>
              <section class="card"><div class="card-head"><h2>Speaker handbook</h2><span class="chip">Handbook page</span></div><div class="card-body"><button class="button ghost" style="width:100%;justify-content:space-between" data-handbook="venue"><span>Venue, arrival, and green room</span><span>→</span></button><button class="button ghost" style="width:100%;justify-content:space-between" data-handbook="av"><span>Presentation and A/V guidance</span><span>→</span></button></div></section>
            </div>
          </div>
        </main></div>`;
      }
      // The post-acceptance question nobody else answers: where do I go, when do
      // I need to leave, and how do I get in. Text first; the map is the receipt.
      function portalLocationCard() {
        const slot = sessionSlot(state.portalRecordId); if (!slot) return "";
        const info = roomInfo(slot.room), b = info && info.building;
        const t = transitTo(slot, PORTAL_SPEAKER);
        const directions = hasPin(b) ? `https://www.google.com/maps/search/?api=1&query=${b.lat},${b.lng}` : "";
        let leave = "";
        if (t && t.prev) leave = `Your previous session ends <b>${minutesToClock(clockToMinutes(t.prev.time)+t.prev.duration)}</b> at ${esc(t.from.name)} — <b>${t.walk} min walk</b>${t.access?`, plus <b>${t.access} min</b> at the door`:""}. Leave by <b>${t.leaveBy}</b>.`;
        else if (t) leave = `<b>${t.walk} min walk</b> from ${esc(t.from.name)}${t.access?`, plus <b>${t.access} min</b> to get in`:""}. Be on your way by <b>${t.leaveBy}</b>.`;
        else if (b && b.accessMinutes) leave = `Allow <b>${b.accessMinutes} min</b> to get through the door — arrive by <b>${minutesToClock(clockToMinutes(slot.time)-b.accessMinutes-5)}</b>.`;
        return `<section class="card" style="margin-bottom:16px"><div class="card-head"><div><h2>Where you are speaking</h2><span class="subtle">${esc(slot.day)} · ${esc(slot.time)}</span></div>${directions?`<a class="button small" href="${directions}" target="_blank" rel="noreferrer">Directions ↗</a>`:""}</div>
          <div class="card-body"><div class="grid-2" style="gap:18px;align-items:start"><div>
            <div class="loc-line"><span class="loc-label">Room</span><span class="loc-value"><strong>${esc(slot.room)}</strong>${info&&info.capacity?` · ${info.capacity.toLocaleString()} seats`:""}</span></div>
            <div class="loc-line"><span class="loc-label">Building</span><span class="loc-value">${b?`<strong>${esc(b.name)}</strong>${b.address?`<br><span class="subtle">${esc(b.address)}</span>`:""}`:`<span class="rp-empty">No building assigned yet</span>`}</span></div>
            ${b&&b.accessNote?`<div class="loc-line"><span class="loc-label">Getting in</span><span class="loc-value">${esc(b.accessNote)}</span></div>`:""}
            ${info&&info.notes?`<div class="loc-line"><span class="loc-label">Room notes</span><span class="loc-value">${esc(info.notes)}</span></div>`:""}
            ${leave?`<div class="loc-leave">${leave}</div>`:""}
          </div><div>${hasPin(b)?venueMap([b],{width:430,height:196,labels:false,zoom:16}):`<div class="mq-map" style="height:196px"><div class="mq-map-empty">This session has no physical location.</div></div>`}</div></div></div></section>`;
      }

      function portalSubmissionCard() {
        const portalRecord=state.submissions.find(s=>s.id===state.portalRecordId), slot=sessionSlot(state.portalRecordId);
        if(state.portalEditing)return `<section class="status-hero"><div class="stack"><div class="eyebrow">${slot?"Scheduled":"Accepted"} · Wave 2 · Editing talk</div><div class="field"><label for="portal-talk-title">Talk title</label><input id="portal-talk-title" value="${esc(state.portalSessionTitle)}"></div><div class="field"><label for="portal-talk-description">Talk description</label><textarea id="portal-talk-description" style="min-height:110px">${esc(state.portalSessionDescription)}</textarea></div>${scheduleMeta(portalRecord)}<span class="field-note">Editing closes when the CFP closes on Sep 12. The organizer can re-open editing for this submission afterward.</span><div style="display:flex;gap:7px"><button class="button primary small" id="save-talk-edit">Save talk</button><button class="button small" id="cancel-talk-edit">Cancel</button></div></div><div><span class="chip review">CFP open</span><p class="subtle">Changes update the organizer record immediately and are stamped in its history.</p></div></section>`;
        return `<section class="status-hero"><div><div class="eyebrow">${slot?"Scheduled":"Accepted"} · Wave 2</div><h2>${esc(state.portalSessionTitle)}</h2><p>${esc(state.portalSessionDescription)}</p><p class="subtle">Stage Talk</p>${scheduleMeta(portalRecord)}<div style="display:flex;gap:7px;margin-top:12px"><button class="button primary small" id="confirm-role">Confirm this role</button><button class="button small danger" id="decline-role">Decline</button><button class="button small" id="edit-talk">Edit title & description</button></div><span class="field-note" style="display:block;margin-top:9px">Editing closes when the CFP closes on Sep 12.</span></div><button class="button" id="download-invite">Add to calendar</button></section>`;
      }
      function portalDecisionFeedback() { const feedback=state.decisionFeedback[state.portalRecordId];return feedback?`<section class="message-preview" style="margin-bottom:16px"><strong>Program feedback · ${esc(feedback.decision)}</strong><br>${esc(feedback.note||"No additional note was included.")}<br><span class="subtle">${esc(feedback.time)} · this is the same feedback rendered in your decision email</span></section>`:""; }
      function taskRow(t) {
        // Only open tasks are ever cancelled, so a speaker's finished work never
        // lands here — it stays in the active list, still reading as done.
        if (t.cancelledAt) return `<div class="task-row cancelled" data-task-row="${t.id}"><span class="task-toggle" aria-hidden="true">–</span><div><div class="task-title">${esc(t.title)}</div><div class="task-meta">${esc(t.kind)} · was due ${esc(t.due.replace(/^(Due|Overdue · )/,""))} · cancelled ${esc(t.cancelledAt)}</div></div><span class="chip">Cancelled</span></div>`;
        return `<div class="task-row ${t.done ? "done" : ""}" data-task-row="${t.id}"><span class="task-toggle" aria-hidden="true">${t.done ? "✓" : ""}</span><div><div class="task-title">${esc(t.title)}</div><div class="task-meta">${esc(t.kind)} · ${esc(t.due)} · ${t.kind==="Form"?"opens required fields":t.kind==="File request"?"opens secure upload":"opens acknowledgment"}</div></div><button class="button small ${t.overdue&&!t.done?"danger":""}" data-task="${t.id}">${t.done?"Update":"Complete"}</button></div>`;
      }

      function showPortalTask(id) {
        const task=state.tasks.find(item=>item.id===Number(id)); if(!task)return;
        const body=task.kind==="Acknowledge"
          ? `<div class="message-preview">I have read the speaker agreement and accept the recording, code-of-conduct, and participation terms for this role.</div><label class="toggle-line"><span>I acknowledge and accept</span><input id="portal-task-ack" type="checkbox" ${task.done?"checked":""}></label>`
          : task.kind==="File request"
            ? `<div class="field"><label for="portal-task-file">${esc(task.title)}</label><input id="portal-task-file" type="file" ${task.title.includes("headshot")?'accept="image/*"':'accept=".pdf,.ppt,.pptx,.key"'}><span class="field-note">${task.done?"Current file retained until a replacement finishes uploading.":"The task completes only after an accepted file is uploaded."}</span></div>${task.done?`<div class="message-preview"><strong>Current file</strong><br><span class="subtle">${task.title.includes("headshot")?"amara-headshot.jpg · 2.4 MB":"aie-final-slides.pdf · 8.7 MB"} · virus scan passed</span></div>`:""}`
            : task.title.includes("Travel")
              ? `<div class="grid-2"><div class="field"><label>Arrival date *</label><input id="portal-task-required" type="date" value="2026-10-11"></div><div class="field"><label>Departure date *</label><input type="date" value="2026-10-14"></div></div><div class="field"><label>Accommodation or accessibility notes</label><textarea>Late arrival; no accommodation required.</textarea></div>`
              : `<div class="grid-2"><div class="field"><label>Name *</label><input id="portal-task-required" value="Amara van der Meer"></div><div class="field"><label>Company *</label><input value="Capital One"></div></div><div class="field"><label>Role / title *</label><input value="Director of Applied AI"></div>`;
        modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div class="eyebrow">${esc(task.kind)} · ${esc(task.due)}</div><h2>${esc(task.title)}</h2><p>Saving this task updates the organizer’s onboarding dashboard immediately.</p></div><div class="modal-body stack">${body}<div class="field-error" id="portal-task-error"></div></div><div class="modal-actions"><button class="button" id="cancel-portal-task">Cancel</button><button class="button primary" id="save-portal-task">${task.done?"Save update":"Complete task"}</button></div></section></div>`;
        document.getElementById("cancel-portal-task").onclick=()=>modalRoot.innerHTML="";
        document.getElementById("save-portal-task").onclick=()=>{const ack=document.getElementById("portal-task-ack"),file=document.getElementById("portal-task-file"),required=document.getElementById("portal-task-required");if((ack&&!ack.checked)||(file&&!task.done&&!file.files.length)||(required&&!required.value)){document.getElementById("portal-task-error").textContent=ack?"Accept the agreement to complete this task.":file?"Choose a file before completing this request.":"Complete the required fields.";return;}task.done=true;task.overdue=false;modalRoot.innerHTML="";toast(`${task.title} completed · organizer dashboard updated`);render();};
      }

      function evaluationView() {
        return shell(`<div class="page">
          ${pageHead("Evaluation plan", "A two-round funnel turns 1,000 abstracts into a focused committee decision without order-dependent setup.", `<button class="button" data-route="reviewer">Open reviewer view</button><button class="button" data-route="evaluation/ai">AI assist</button><button class="button primary" data-eval-action="plan">+ New evaluation plan</button>`)}

      function filteredSubmissions() {
        const q = state.submissionSearch.trim().toLowerCase();
        let list = state.submissions.filter(s =>
          (state.submissionFilter === "All" ||
            (state.submissionFilter === "AcceptedAny" && s.accepted) ||
            (state.submissionFilter === "Accepted" && boardStageFor(s) === "Accepted") ||
            (state.submissionFilter === "Onboarding" && boardStageFor(s) === "Onboarding") ||
            (state.submissionFilter === "Waved" && s.accepted && s.wave <= 2) ||
            (state.submissionFilter === "Scheduled" && ["Scheduled","Published"].includes(s.status)) ||
            (state.submissionFilter === "Unreviewed" && ["Submitted","In Review"].includes(s.status)) ||
            (state.submissionFilter === "NotNotified" && !!s.notifyGap) ||
            s.status === state.submissionFilter) &&
          (state.submissionType === "All" || s.entity === state.submissionType) &&
          (state.submissionTrack === "All" || (s.tracks||[s.track]).includes(state.submissionTrack)) &&
          (!q || (() => {
            const hit = [s.id,s.title,s.speaker,s.company,(s.tracks||[s.track]).join(" ")].some(v => v.toLowerCase().includes(q));
            if (state.submissionSearchOp === "does not contain") return !hit;
            if (state.submissionSearchOp === "starts with") return s.title.toLowerCase().startsWith(q);
            return hit;
          })())
        );
        if (state.submissionSort === "score") list.sort((a,b) => Number(b.score === "—" ? -1 : b.score) - Number(a.score === "—" ? -1 : a.score));
        if (state.submissionSort === "planRating") list.sort((a,b) => Number(b.planRating === "—" ? -1 : b.planRating) - Number(a.planRating === "—" ? -1 : a.planRating));
        if (state.submissionSort === "title") list.sort((a,b) => a.title.localeCompare(b.title));
        return list;
      }

      function applySavedView(id) {
        const view=state.savedViews.find(item=>item.id===id); if(!view)return;
        const config=view.config;
        state.submissionSearch=config.search||"";state.submissionSearchOp=config.searchOp||"contains";state.submissionFilter=config.status||"All";state.submissionType=config.type||"All";state.submissionTrack=config.track||"All";state.submissionSort=config.sort||"newest";state.submissionColumns=[...(config.columns||state.submissionColumns)];state.activeSavedView=id;state.submissionPage=1;state.selected.clear();state.selectAllMatching=false;persistSubmissionPreferences();render();
      }

      function currentSubmissionViewConfig() {
        return {search:state.submissionSearch,searchOp:state.submissionSearchOp,status:state.submissionFilter,type:state.submissionType,track:state.submissionTrack,sort:state.submissionSort,columns:[...state.submissionColumns]};
      }

      function submissionCell(submission,column) {
        if(column==="type")return `<span class="chip ${submission.entity==="Session"?"session":""}">${submission.entity}</span>`;
        if(column==="id")return `<strong class="tabular">${submission.id}</strong>`;
        if(column==="title")return `<a href="#submissions/${submission.id}" class="table-title" title="${esc(submission.title)}">${esc(submission.title)}</a><span class="wave-date">${submission.id} · ${submission.source}</span>${scheduleMeta(submission)}`;
        if(column==="speakers")return `<span title="${esc(submission.speakers.join(", "))}">${esc(submission.speakers.length>1?`${submission.speaker} +${submission.speakers.length-1}`:submission.speaker)}</span>${submission.status==="Draft"?`<span class="wave-date">${esc(submission.email)}</span>`:""}`;
        if(column==="status")return `<span class="chip ${submission.status.toLowerCase().replace(" ","-")}">${submission.status}</span>`;
        if(column==="tracks")return `<div style="display:flex;gap:3px;overflow:hidden">${(submission.tracks||[submission.track]).map((name,index)=>`<span class="chip" title="${index===0?"Primary track":"Additional track"}" style="border-left:3px solid ${trackColor(name)}">${esc(name)}${index===0?" · Primary":""}</span>`).join("")}</div>`;
        if(column==="score")return submission.score;
        if(column==="planRating")return `<strong class="tabular">${submission.planRating}</strong>`;
        if(column==="tags")return (submission.tags||[]).length?`<div style="display:flex;gap:3px;overflow:hidden">${submission.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:`<span class="subtle">—</span>`;
        if(column==="level")return submission.level?`<span class="chip">${esc(submission.level)}</span>`:"—";
        if(column==="notified"){
          if(submission.notifiedAt)return `<span class="notified-cell sent" title="Decision email delivered · from this record's outbox entry">✓ ${esc(submission.notifiedAt)}</span>`;
          if(submission.notifyGap)return `<span class="notified-cell gap" title="${esc(NOTIFY_GAPS[submission.notifyGap].why)}">! ${esc(NOTIFY_GAPS[submission.notifyGap].label)}</span>`;
          return `<span class="notified-cell">—</span>`;
        }
        if(column==="submitted")return submission.status==="Draft"?"Not submitted":submission.submitted;
        if(column==="updated")return submission.updated||"Today";
        if(column==="origin")return submission.source;
        if(column==="missing")return submission.missingFields?.length?`<span class="draft-warning">${esc(submission.missingFields.join(" · "))}</span>`:`<span class="subtle">Complete</span>`;
        return "";
      }

      function recordActionCard(submission) {
        const stage=submission.status==="Draft"?"Draft":boardStageFor(submission), slot=sessionSlot(submission);
        let buttons="";
        if(stage==="Draft")buttons=`<button class="button" data-record-message="resume">Email private resume link</button><span class="subtle">Opening and editing this record never changes Draft status.</span>`;
        if(stage==="Submitted")buttons=`<button class="button primary" data-lifecycle-target="In Review">Start review</button>`;
        if(stage==="In Review")buttons=`<button class="button" data-lifecycle-target="Waved">Move to decision wave</button><button class="button" data-program-decision="Deny">Deny…</button><button class="button" data-program-decision="Maybe">Maybe…</button><button class="button primary" data-program-decision="Approve">Approve…</button>`;
        if(stage==="Waved")buttons=`<button class="button" data-lifecycle-target="In Review">Return to review</button><button class="button" data-program-decision="Deny">Deny…</button><button class="button" data-program-decision="Maybe">Maybe…</button><button class="button primary" data-program-decision="Approve">Approve…</button>`;
        if(stage==="Accepted"||stage==="Onboarding")buttons=`<button class="button" data-route="onboarding">Manage speaker onboarding</button><button class="button primary" data-route="agenda">Place on agenda</button>`;
        if(stage==="Scheduled")buttons=`<button class="button" data-route="agenda">Open working agenda</button><button class="button primary" data-publish-id="${submission.id}">Publish Session</button>`;
        if(stage==="Published")buttons=`<button class="button" data-route="agenda">Open agenda</button><button class="button primary" data-route="s/${submission.id}">View public Session ↗</button>`;
        if(stage!=="Draft")buttons+=`<button class="button" data-record-message="changes">Request changes</button><button class="button" data-record-message="email">Email speaker</button>`;
        return `<section class="card record-action-card"><div class="card-head"><div><h2>Record actions</h2><span class="subtle">${esc(stage)} · consequential changes are confirmed, previewed, and stamped in history</span></div><span class="chip ${slot?.status==="Published"?"published":slot?"scheduled":""}">${esc(stage)}</span></div><div class="card-body record-action-buttons">${buttons}</div></section>`;

      function showProgramDecision(id,decision) {
        const submission=state.submissions.find(item=>item.id===id);if(!submission)return;
        const mapping={Approve:"Accepted",Maybe:"Waitlisted",Deny:"Rejected"},outcome=mapping[decision];
        modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div class="eyebrow">Program decision · ${esc(decision)}</div><h2>${esc(decision)} ${esc(submission.title)}?</h2><p>${esc(decision)} maps to ${outcome}. The speaker email and portal render the same feedback after confirmation.</p></div><div class="modal-body stack"><div class="field"><label for="decision-feedback">Feedback for the speaker · optional</label><textarea id="decision-feedback" placeholder="Share useful context with the decision.">${esc(state.decisionFeedback[id]?.note||"")}</textarea></div><div class="message-preview"><strong>Email preview · ${esc(decision)}</strong><br><span class="subtle">Hi ${esc(submission.speaker.split(" ")[0])}, here is an update on “${esc(submission.title)}.” <span id="feedback-preview">Feedback appears here and in the portal.</span></span></div><div class="wave-row"><strong>Lifecycle status</strong><span>${esc(submission.status)} → ${outcome}</span><strong>1 record</strong></div><div class="wave-row"><strong>Email + portal</strong><span>Same rendered feedback</span><strong>Queue</strong></div></div><div class="modal-actions"><button class="button" id="cancel-program-decision">Cancel</button><button class="button primary" id="confirm-program-decision">Confirm ${esc(decision)}</button></div></section></div>`;
        const feedback=document.getElementById("decision-feedback");feedback.oninput=()=>document.getElementById("feedback-preview").textContent=feedback.value||"No additional feedback.";
        document.getElementById("cancel-program-decision").onclick=()=>modalRoot.innerHTML="";
        document.getElementById("confirm-program-decision").onclick=()=>{const note=feedback.value.trim();state.decisionFeedback[id]={decision,note,time:"Just now"};submission.status=outcome;submission.timeInStageHours=1;if(decision==="Approve"){submission.accepted=true;submission.wave=submission.wave||2;submission.waveDate=submission.waveDate||waveDates[1];submission.boardStage="Accepted";ensureOnboardingSpeaker(submission);const restored=reconcileTaskSet(submission);stampRecord(id,restored?"Speaker tasks restored":"Speaker task set assigned",restored?`${restored} cancelled task${restored===1?"":"s"} reopened with their original due dates · completed tasks were never re-opened`:`Task set assigned from the event's templates`);}else{submission.accepted=false;submission.boardStage="Waved";if(decision==="Maybe")submission.wave=submission.wave||2;}submission.notifiedAt="Just now";state.outbox.unshift({id:`MSG-${String(1843+state.outbox.length).padStart(5,"0")}`,recipient:submission.email,template:`Decision · ${decision}`,subject:`An update on ${submission.title}`,outcome:"Queued",time:"Just now"});modalRoot.innerHTML="";toast(`${decision} confirmed · ${outcome.toLowerCase()} · email and portal feedback queued`);render();};
      }
