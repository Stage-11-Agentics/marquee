<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Marquee — Pipeline v1.3 prototype</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #fff;
      --ink: #17181b;
      --muted: #686b73;
      --line: #e5e7eb;
      --line-strong: #d7d9df;
      --accent: #635bff;
      --accent-soft: #eeedff;
      --accent-dark: #4338ca;
      --danger: #c63c36;
      --danger-soft: #fff0ee;
      --warning: #9a6500;
      --warning-soft: #fff7df;
      --success: #16845b;
      --success-soft: #e9f8f1;
      --shadow: 0 1px 2px rgba(19,24,39,.04), 0 10px 34px rgba(19,24,39,.06);
      --radius: 12px;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --display: Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); color: var(--ink); font-family: var(--sans); }
    body { margin: 0; min-width: 320px; }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    [hidden] { display: none !important; }
    .tabular, .metric, .pipeline-count, td { font-variant-numeric: tabular-nums; }
    .prototype-badge {
      position: fixed; z-index: 1000; right: 12px; top: 12px;
      background: #15161a; color: #fff; border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 8px 24px rgba(0,0,0,.22); border-radius: 999px;
      padding: 7px 11px; font-size: 10px; font-weight: 780; letter-spacing: .11em;
      text-transform: uppercase; pointer-events: none;
    }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 224px minmax(0,1fr); }
    .sidebar {
      background: #fbfbfc; border-right: 1px solid var(--line); padding: 20px 14px;
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 21px; }
    .brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: white; display: grid; place-items: center; font-weight: 800; }
    .brand-name { font: italic 650 18px/1 var(--display); letter-spacing: -.035em; }
    .event-switcher { margin: 0 4px 18px; border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; background: white; }
    .event-switcher small { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
    .event-switcher strong { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-label { color: #9a9ca3; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin: 12px 10px 6px; }
    .nav { display: grid; gap: 3px; }
    .nav a { min-height: 36px; padding: 9px 10px; border-radius: 8px; color: #4b4d54; font-size: 13px; display: flex; align-items: center; gap: 9px; transition: background 120ms, color 120ms; }
    .nav a:hover { background: #f0f0f3; color: var(--ink); }
    .nav a.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 680; }
    .nav-icon { width: 16px; text-align: center; color: #8b8e96; }
    .nav a.active .nav-icon { color: var(--accent); }
    .sidebar-foot { margin-top: auto; display: grid; gap: 5px; }
    .sidebar-foot button { border: 0; background: none; text-align: left; color: var(--muted); padding: 8px 10px; border-radius: 8px; font-size: 12px; }
    .sidebar-foot button:hover { background: #f0f0f3; }
    .main { min-width: 0; }
    .topbar { height: 58px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.82); backdrop-filter: blur(14px); display: flex; align-items: center; gap: 12px; padding: 0 26px; position: sticky; top: 0; z-index: 50; }
    .breadcrumbs { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .breadcrumbs strong { color: var(--ink); }
    .global-search { margin-left: auto; width: min(330px,38vw); position: relative; }
    .global-search input { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 55px 0 31px; background: #f7f7f9; color: var(--ink); outline: none; }
    .global-search input:focus { border-color: #aaa6ff; background: white; box-shadow: 0 0 0 3px var(--accent-soft); }
    .search-glyph { position: absolute; left: 10px; top: 8px; color: #8b8e96; font-size: 13px; }
    .shortcut { position: absolute; right: 8px; top: 7px; color: #8b8e96; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 10px; background: white; }
    .search-results { position: absolute; right: 0; top: 40px; width: 420px; max-width: 80vw; background: white; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 80; }
    .search-result { width: 100%; border: 0; background: transparent; text-align: left; padding: 10px; border-radius: 7px; display: grid; grid-template-columns: 72px 1fr; gap: 8px; }
    .search-result:hover { background: var(--bg); }
    .result-type { color: var(--accent-dark); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
    .result-title { font-size: 12px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .top-user { width: 30px; height: 30px; border-radius: 50%; background: #292b31; color: white; display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: 0 0 auto; }
    .page { padding: 30px 34px 56px; max-width: 1500px; margin: 0 auto; }
    .page-head { min-height: 66px; display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 22px; }
    .page-head h1 { margin: 0 0 7px; letter-spacing: -.035em; font-size: 25px; line-height: 1.15; }
    .page-head p { margin: 0; color: var(--muted); max-width: 680px; font-size: 13px; line-height: 1.5; }
    .head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; min-height: 36px; }
    .button { min-height: 34px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 12px; background: white; color: #303239; font-weight: 650; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: transform 120ms, background 120ms, border 120ms; }
    .button:hover { background: #f7f7f9; border-color: #c7c9d0; }
    .button:active { transform: translateY(1px); }
    .button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .button.primary:hover { background: #554ce8; }
    .button.danger { color: var(--danger); }
    .button.small { min-height: 28px; padding: 5px 9px; font-size: 11px; }
    .button.ghost { border-color: transparent; background: transparent; }
    .button:disabled { opacity: .45; cursor: not-allowed; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 1px rgba(15,23,42,.02); }
    .card-head { padding: 17px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 58px; }
    .card-head h2, .card-head h3 { margin: 0; font-size: 13px; letter-spacing: -.01em; }
    .card-body { padding: 18px; }
    .subtle { color: var(--muted); font-size: 12px; }
    .eyebrow { color: var(--muted); font-size: 10px; font-weight: 740; letter-spacing: .09em; text-transform: uppercase; }
    .divider { height: 1px; background: var(--line); margin: 16px 0; }
    .grid-2 { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 16px; }
    .stack { display: grid; gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 11px; font-weight: 680; color: #44464d; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; background: white; min-height: 36px; padding: 8px 10px; color: var(--ink); outline: none; }
    .field textarea { min-height: 90px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #9f9aff; box-shadow: 0 0 0 3px var(--accent-soft); }
    .field-note { font-size: 10px; color: var(--muted); min-height: 13px; }
    .field-error { color: var(--danger); font-size: 11px; min-height: 15px; }
    .segment { display: inline-flex; border: 1px solid var(--line); background: #f7f7f9; border-radius: 8px; padding: 2px; gap: 2px; }
    .segment button { border: 0; background: transparent; border-radius: 6px; padding: 7px 10px; color: var(--muted); font-size: 11px; min-width: 56px; }
    .segment button.active { background: white; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); font-weight: 680; }
    .chip { display: inline-flex; align-items: center; gap: 5px; min-height: 21px; padding: 3px 7px; border-radius: 999px; background: #f0f1f3; color: #555861; font-size: 10px; font-weight: 650; white-space: nowrap; }
    .chip.accepted, .chip.published, .chip.scheduled { color: var(--success); background: var(--success-soft); }
    .chip.review, .chip.in-review { color: var(--warning); background: var(--warning-soft); }
    .chip.rejected, .chip.overdue { color: var(--danger); background: var(--danger-soft); }
    .chip.session { color: var(--accent-dark); background: var(--accent-soft); border: 1px solid #d9d6ff; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%,12px); z-index: 1200; background: #17181b; color: white; border-radius: 9px; padding: 10px 13px; font-size: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.24); opacity: 0; pointer-events: none; transition: opacity 120ms, transform 120ms; max-width: min(500px,88vw); }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(21,22,26,.42); z-index: 500; display: grid; place-items: center; padding: 18px; }
    .modal { width: min(540px,100%); background: white; border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.25); overflow: hidden; }
    .modal-head { padding: 20px 22px 13px; }
    .modal-head h2 { margin: 0 0 7px; font-size: 18px; }
    .modal-head p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .modal-body { padding: 10px 22px 20px; }
    .modal-actions { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }

    /* v1.2 completion surfaces */
    .route-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
    .route-tabs .button.active { color:var(--accent-dark); border-color:#aaa6ff; background:var(--accent-soft); }
    .empty-state { min-height:420px; display:grid; place-items:center; text-align:center; padding:48px 24px; }
    .empty-state > div { max-width:520px; }
    .empty-mark { width:54px; height:54px; border-radius:14px; margin:0 auto 18px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-dark); font-size:23px; }
    .empty-state h2 { margin:0 0 9px; font-size:20px; }
    .empty-state p { margin:0 auto 20px; color:var(--muted); font-size:13px; line-height:1.6; }
    .empty-preview { position:fixed; z-index:999; right:12px; top:51px; font-size:9px; color:#fff; background:#363842; border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:5px 9px; }
    .detail-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr); gap:16px; align-items:start; }
    .definition-list { display:grid; grid-template-columns:150px 1fr; gap:0; }
    .definition-list dt, .definition-list dd { margin:0; padding:11px 0; border-bottom:1px solid var(--line); font-size:11px; }
    .definition-list dt { color:var(--muted); }
    .definition-list dd { font-weight:620; }
    .history-row { position:relative; padding:0 0 18px 22px; font-size:11px; line-height:1.5; }
    .history-row::before { content:""; position:absolute; left:5px; top:4px; bottom:-4px; width:1px; background:var(--line); }
    .history-row::after { content:""; position:absolute; left:1px; top:4px; width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .history-row:last-child::before { display:none; }
    .settings-row { display:grid; grid-template-columns:18px minmax(0,1fr) minmax(80px,.45fr) auto; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--line); }
    .settings-row:last-child { border-bottom:0; }
    .settings-row input, .settings-row select { width:100%; min-width:0; height:32px; border:1px solid var(--line-strong); border-radius:7px; padding:0 8px; background:#fff; }
    .settings-row.dragging { opacity:.45; }
    .drag-button { border:0; background:transparent; color:#999ca4; padding:0; cursor:grab; }
    .search-dialog { width:min(720px,100%); align-self:start; margin-top:min(14vh,120px); }
    .search-dialog .search-input { width:100%; height:52px; border:0; border-bottom:1px solid var(--line); padding:0 20px; font-size:15px; outline:none; }
    .search-dialog-results { max-height:460px; overflow:auto; padding:8px; }
    .search-dialog .search-result { grid-template-columns:92px 1fr auto; align-items:center; min-height:50px; }
    .search-dialog .search-result kbd { color:var(--muted); font-size:9px; }
    .comms-layout { display:grid; grid-template-columns:minmax(230px,.65fr) minmax(360px,1fr); gap:16px; align-items:start; }
    .list-button { width:100%; border:0; border-bottom:1px solid var(--line); background:#fff; text-align:left; padding:13px 16px; display:flex; justify-content:space-between; gap:10px; }
    .list-button.active { background:var(--accent-soft); color:var(--accent-dark); }
    .list-button:last-child { border-bottom:0; }
    .toggle-line { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
    .toggle-line:last-child { border-bottom:0; }
    .switch { width:38px; height:22px; border:0; border-radius:99px; background:#c7c9cf; padding:3px; }
    .switch::after { content:""; display:block; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform 120ms; box-shadow:0 1px 3px rgba(0,0,0,.25); }
    .switch.on { background:var(--accent); }
    .switch.on::after { transform:translateX(16px); }
    .import-steps { display:grid; grid-template-columns:repeat(5,1fr); margin-bottom:16px; overflow:hidden; }
    .import-step { padding:11px; background:#f4f4f6; color:var(--muted); border-right:1px solid var(--line); font-size:10px; text-align:center; }
    .import-step.active { background:var(--accent-soft); color:var(--accent-dark); font-weight:700; }
    .code-block { background:#17181b; color:#e8e9ef; border-radius:9px; padding:14px; overflow:auto; font:11px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre; }
    .live-log { background:#17181b; color:#cfd2dc; border-radius:9px; padding:12px; min-height:150px; font:10px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .live-log strong { color:#8bf0c8; font-weight:600; }
    .agenda-list-head, .agenda-list-row { display:grid; grid-template-columns:110px 72px minmax(220px,1fr) minmax(150px,.7fr) 130px 150px 90px; gap:10px; align-items:center; padding:0 14px; }
    .agenda-list-head { min-height:38px; position:sticky; top:0; z-index:2; background:#fafafb; border-bottom:1px solid var(--line); color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.07em; font-weight:730; }
    .agenda-list-head button { border:0; background:transparent; color:inherit; text-align:left; padding:0; font:inherit; text-transform:inherit; letter-spacing:inherit; }
    .agenda-list-row { min-height:58px; border-bottom:1px solid var(--line); font-size:10px; }
    .agenda-list-row > * { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .week-grid { min-width:900px; display:grid; grid-template-columns:68px repeat(3,minmax(260px,1fr)); }
    .week-cell { min-height:100px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; }
    .week-cell.time { background:#fafafb; color:var(--muted); text-align:right; font-size:9px; padding-right:10px; }
    .week-cell.head { min-height:42px; position:sticky; top:0; z-index:2; background:#fafafb; font-size:10px; font-weight:700; }
    .week-session { border-left:3px solid var(--accent); border-radius:6px; background:#f7f7fa; padding:7px; margin-bottom:5px; font-size:9px; }
    .week-session strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .session-tile .tile-actions, .track-tile .tile-actions { display:flex; gap:3px; margin-top:4px; }
    .tile-actions button { width:19px; height:18px; border:1px solid var(--line); border-radius:4px; background:white; font-size:9px; padding:0; }
    .break-tile { border-left-color:#81838b !important; background:repeating-linear-gradient(135deg,#f2f2f4,#f2f2f4 6px,#fafafa 6px,#fafafa 12px) !important; }
    .api-route { display:grid; grid-template-columns:62px 210px 1fr; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:11px; }
    .method { font-weight:800; color:var(--accent-dark); }
    .outcome-table { width:100%; min-width:620px; }
    .outcome-table td { height:42px; }
    .track-picker { display:flex; flex-wrap:wrap; gap:7px; padding:10px; border:1px solid var(--line-strong); border-radius:8px; background:#fff; outline:none; }
    .track-picker:focus { border-color:#9f9aff; box-shadow:0 0 0 3px var(--accent-soft); }
    .track-picker button { border:1px solid var(--line); background:#f7f7f9; border-radius:999px; padding:6px 9px; color:var(--muted); font-size:10px; }
    .track-picker button.active { border-color:#aaa6ff; background:var(--accent-soft); color:var(--accent-dark); font-weight:700; }
    .track-picker button small { margin-left:5px; font-size:8px; text-transform:uppercase; letter-spacing:.05em; }

    /* Landing */
    .landing { min-height: 100vh; background: #f7f7fa; display: grid; grid-template-rows: auto 1fr auto; }
    .landing-nav { padding: 20px clamp(20px,5vw,70px); display: flex; align-items: center; justify-content: space-between; }
    .landing-nav .brand { padding: 0; }
    .landing-links { display: flex; gap: 8px; }
    .hero { width: min(1180px,90vw); margin: auto; display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(35px,8vw,100px); align-items: center; padding: 55px 0 70px; }
    .hero-copy .eyebrow { color: var(--accent-dark); margin-bottom: 15px; }
    .hero h1 { font: 500 clamp(42px,6vw,74px)/.98 var(--display); letter-spacing: -.062em; margin: 0 0 22px; max-width: 720px; }
    .hero p { color: #5b5e67; font-size: 17px; line-height: 1.65; max-width: 600px; margin: 0 0 28px; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .hero-actions .button { min-height: 43px; padding: 10px 16px; }
    .hero-note { margin-top: 15px; color: var(--muted); font-size: 11px; }
    .hero-pipeline { background: linear-gradient(145deg,#fff 0 68%,#f4f1ff); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; transform: rotate(1deg); }
    .mini-pipeline { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 17px 0; }
    .mini-stage { border: 1px solid var(--line); border-radius: 9px; padding: 12px; min-height: 72px; }
    .mini-stage strong { display: block; font-size: 22px; margin-top: 9px; }
    .mini-attention { padding: 12px; background: var(--warning-soft); color: #624400; border-radius: 9px; font-size: 11px; line-height: 1.5; }
    .landing-foot { border-top: 1px solid var(--line); padding: 18px clamp(20px,5vw,70px); color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; }

    /* Pipeline dashboard */
    .pipeline-card { overflow: hidden; }
    .pipeline { display: grid; grid-template-columns: repeat(7,minmax(120px,1fr)); overflow-x: auto; border-top: 3px solid transparent; border-image: linear-gradient(90deg,#635bff,#db4c3f,#0d9488,#d97706,#2563eb,#9333ea,#4d7c0f) 1; }
    .pipeline-stage { position: relative; min-width: 130px; border: 0; border-right: 1px solid var(--line); background: white; text-align: left; padding: 20px 17px 18px; min-height: 120px; transition: background 120ms; }
    .pipeline-stage:last-child { border-right: 0; }
    .pipeline-stage:hover { background: #fafafe; }
    .pipeline-stage::after { content: "›"; position: absolute; right: -7px; top: 48px; z-index: 2; width: 14px; height: 14px; display: grid; place-items: center; border-radius: 50%; background: white; border: 1px solid var(--line); color: #a2a4aa; font-size: 12px; }
    .pipeline-stage:last-child::after { display: none; }
    .pipeline-name { color: var(--muted); font-size: 11px; font-weight: 650; }
    .pipeline-count { display: block; font-size: 29px; letter-spacing: -.04em; font-weight: 730; margin: 8px 0 7px; }
    .pipeline-delta { color: var(--muted); font-size: 10px; }
    .pipeline-meaning { display:block; min-height:22px; margin-top:7px; color:var(--ink); font-size:9px; line-height:1.35; font-weight:680; }
    .attention-strip { margin: 16px 0; display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .attention-item { border: 1px solid var(--line); background: white; border-radius: 9px; text-align: left; padding: 12px 13px; min-height: 62px; transition: border 120ms, transform 120ms; }
    .attention-item:hover { border-color: #bdb9ff; transform: translateY(-1px); }
    .attention-item strong { display: block; font-size: 12px; margin-bottom: 5px; }
    .attention-item span { color: var(--muted); font-size: 10px; }
    .dashboard-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; }
    .wave-list { display: grid; }
    .wave-row { display: grid; grid-template-columns: 1fr 80px 62px; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding: 13px 0; }
    .wave-row:last-child { border-bottom: 0; }
    .wave-date { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .wave-bar { height: 6px; background: #eeeef2; border-radius: 99px; overflow: hidden; }
    .wave-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

    /* Program board + scheduled-session legibility */
    .slot-meta { display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:6px; }
    .slot-chip { display:inline-flex; align-items:center; max-width:100%; border:1px solid #cfe8df; border-radius:999px; background:#f0faf6; color:#176044; padding:3px 7px; font-size:8px; font-weight:720; line-height:1.25; white-space:normal; }
    .slot-meta.compact { gap:3px; margin-top:4px; }
    .slot-meta.compact .slot-chip { padding:2px 5px; font-size:7px; }
    .not-public { display:inline-flex; align-items:center; border-radius:999px; background:var(--warning-soft); color:#765300; padding:3px 7px; font-size:8px; font-weight:750; white-space:nowrap; }
    .publish-link { border:0; border-bottom:1px solid currentColor; background:transparent; color:var(--accent-dark); padding:2px 1px; font-size:8px; font-weight:760; cursor:pointer; }
    .track-chip-row { display:flex; gap:4px; flex-wrap:wrap; min-width:0; }
    .program-board-shell { overflow-x:auto; padding-bottom:10px; }
    .program-board { display:grid; grid-template-columns:repeat(7,minmax(248px,1fr)); gap:10px; min-width:1800px; align-items:start; }
    .board-column { min-height:620px; border:1px solid var(--line); border-radius:11px; background:#f7f7f9; overflow:hidden; }
    .board-column-head { position:sticky; top:0; z-index:3; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; min-height:69px; padding:12px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.96); backdrop-filter:blur(8px); }
    .board-column-head strong { display:block; font-size:11px; }
    .board-column-head small { display:block; margin-top:4px; color:var(--muted); font-size:8px; line-height:1.35; }
    .board-derived-note { margin:8px; padding:8px; border:1px dashed #d6b25c; border-radius:7px; background:#fffaf0; color:#765300; font-size:8px; line-height:1.45; }
    .board-card-list { height:calc(100vh - 275px); min-height:520px; overflow-y:auto; padding:8px; }
    .board-card { content-visibility:auto; contain:layout paint style; contain-intrinsic-size:148px; border:1px solid var(--line); border-left:3px solid var(--track-color,var(--accent)); border-radius:8px; background:#fff; padding:9px; margin-bottom:7px; box-shadow:0 1px 2px rgba(20,21,26,.04); cursor:pointer; transition:border-color 120ms,box-shadow 120ms,transform 120ms; }
    .board-card:hover, .board-card:focus { border-color:#aaa6ff; box-shadow:0 5px 16px rgba(60,53,155,.12); transform:translateY(-1px); outline:none; }
    .board-card h3 { margin:7px 0 5px; font-size:10px; line-height:1.35; }
    .board-card p { margin:0; color:var(--muted); font-size:8px; line-height:1.4; white-space:normal; }
    .board-card-foot { display:flex; justify-content:space-between; gap:7px; align-items:center; margin-top:8px; color:var(--muted); font-size:8px; }
    .board-count { flex:0 0 auto; display:grid; place-items:center; min-width:25px; height:25px; padding:0 6px; border-radius:999px; background:var(--accent-soft); color:var(--accent-dark); font-size:9px; font-weight:800; }
    .board-filter-summary { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:10px; }
    .record-action-card { border-left:3px solid var(--accent); }
    .record-action-buttons { display:flex; gap:7px; flex-wrap:wrap; }
    .metric-grid { display: grid; grid-template-columns: repeat(2,1fr); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .metric-box { padding: 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 84px; }
    .metric-box:nth-child(2n) { border-right: 0; }
    .metric-box:nth-last-child(-n+2) { border-bottom: 0; }
    .metric { font-size: 23px; letter-spacing: -.04em; font-weight: 730; margin: 7px 0 2px; }
    .spark { height: 36px; display: flex; align-items: end; gap: 3px; margin-top: 8px; }
    .spark i { flex: 1; background: var(--accent-soft); border-radius: 2px 2px 0 0; }

    /* Tables */
    .table-card { overflow: hidden; }
    .toolbar { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 58px; }
    .toolbar input, .toolbar select { height: 32px; border: 1px solid var(--line-strong); border-radius: 7px; background: white; padding: 0 9px; font-size: 11px; outline: none; }
    .toolbar input { min-width: 210px; }
    .toolbar-spacer { flex: 1; }
    .selection-bar { padding: 10px 14px; min-height: 48px; background: var(--accent-soft); border-bottom: 1px solid #dad7ff; display: flex; align-items: center; gap: 10px; color: var(--accent-dark); font-size: 11px; }
    .selection-bar strong { min-width: 92px; }
    .table-wrap { overflow: auto; min-height: 460px; }
    table { width: 100%; min-width: 900px; border-collapse: collapse; table-layout: fixed; }
    th { height: 38px; position: sticky; top: 0; z-index: 2; background: #fafafb; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .07em; font-weight: 730; text-align: left; padding: 0 10px; }
    td { height: 49px; border-bottom: 1px solid #eff0f2; padding: 7px 10px; font-size: 11px; color: #44464e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    tbody tr:hover { background: #fafafe; }
    .submission-row { cursor: pointer; }
    .submission-row:focus-within { background: #f7f6ff; box-shadow: inset 3px 0 0 var(--accent); }
    .check-col { width: 38px; text-align: center; }
    .type-col { width: 82px; }
    .title-col { width: 31%; }
    .speaker-col { width: 18%; }
    .status-col { width: 104px; }
    .track-col { width: 16%; }
    .score-col { width: 65px; text-align: right; }
    .table-title { color: var(--ink); font-weight: 640; overflow: hidden; text-overflow: ellipsis; }
    .pagination { min-height: 48px; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
    .page-buttons { display: flex; gap: 5px; }

    /* Form builder */
    .builder { display: grid; grid-template-columns: 280px minmax(340px,1fr) minmax(300px,.78fr); gap: 14px; align-items: start; }
    .builder-steps { padding: 10px; }
    .builder-step { width: 100%; border: 0; background: transparent; border-radius: 8px; padding: 10px; text-align: left; display: flex; gap: 10px; color: var(--muted); font-size: 11px; }
    .builder-step.active { color: var(--accent-dark); background: var(--accent-soft); font-weight: 680; }
    .step-number { width: 20px; height: 20px; border-radius: 50%; background: #ececf0; display: grid; place-items: center; font-size: 9px; flex: 0 0 auto; }
    .active .step-number { background: var(--accent); color: white; }
    .form-fields { padding: 14px; display: grid; gap: 8px; }
    .form-field-row { border: 1px solid var(--line); border-radius: 9px; padding: 12px; display: grid; grid-template-columns: 18px 1fr auto; gap: 9px; align-items: center; background: white; }
    .form-field-row.active { border-color: #aaa6ff; box-shadow: 0 0 0 2px var(--accent-soft); }
    .drag-handle { color: #a4a6ad; letter-spacing: -3px; }
    .field-kind { color: var(--muted); font-size: 9px; margin-top: 3px; }
    .field-controls { display: flex; gap: 3px; }
    .field-controls button { width: 25px; height: 25px; border: 0; background: #f4f4f6; border-radius: 5px; color: #777a82; }
    .add-field { border: 1px dashed #c9cbd1; background: #fafafb; border-radius: 9px; padding: 12px; color: var(--accent-dark); font-weight: 650; }
    .preview-card { position: sticky; top: 76px; }
    .preview-window { margin: 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fafafa; }
    .preview-top { height: 36px; border-bottom: 1px solid var(--line); background: white; display: flex; align-items: center; gap: 5px; padding: 0 10px; }
    .preview-top i { width: 6px; height: 6px; border-radius: 50%; background: #d2d3d8; }
    .preview-form { padding: 22px 18px; }
    .preview-form h3 { margin: 0 0 5px; font-size: 15px; }
    .preview-form p { margin: 0 0 17px; color: var(--muted); font-size: 10px; }
    .preview-input { height: 32px; border: 1px solid var(--line); border-radius: 6px; background: white; margin-top: 6px; }

    /* Public form + portal */
    .public-shell { min-height: 100vh; background: #f7f7fa; }
    .public-top { height: 64px; background: white; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(18px,5vw,70px); }
    .public-event { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 680; }
    .public-event .brand-mark { width: 25px; height: 25px; font-size: 11px; }
    .public-body { width: min(750px,calc(100% - 32px)); margin: 0 auto; padding: 48px 0 80px; }
    .public-body.wide { width: min(1160px,calc(100% - 32px)); }
    .public-card { background: white; border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 8px 35px rgba(23,24,27,.05); padding: clamp(20px,4vw,38px); }
    .public-card h1 { font-size: 30px; letter-spacing: -.04em; margin: 0 0 10px; }
    .public-card > p { color: var(--muted); line-height: 1.6; font-size: 13px; }
    .cfp-progress { display: flex; gap: 5px; margin: 28px 0 30px; }
    .cfp-progress i { height: 3px; border-radius: 99px; flex: 1; background: #e7e7ea; }
    .cfp-progress i.active { background: var(--accent); }
    .cfp-form { display: grid; gap: 17px; }
    .save-status { min-height: 18px; color: var(--muted); font-size: 10px; }
    .portal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .portal-head h1 { margin: 0 0 7px; font-size: 26px; }
    .portal-progress { width: 190px; }
    .progress-track { height: 7px; background: #e9e9ed; border-radius: 99px; overflow: hidden; margin-top: 7px; }
    .progress-track i { display: block; height: 100%; background: var(--success); transition: width 120ms; }
    .status-hero { background: #17181b; color: white; border-radius: 13px; padding: 21px; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; margin-bottom: 16px; }
    .status-hero .eyebrow { color: #aaa9b0; }
    .status-hero h2 { margin: 7px 0 5px; font-size: 18px; }
    .status-hero p { margin: 0; color: #c9c9ce; font-size: 11px; }
    .portal-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; }
    .task-row { min-height: 67px; padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; }
    .task-row:last-child { border-bottom: 0; }
    .task-toggle { width: 25px; height: 25px; border-radius: 7px; border: 1px solid var(--line-strong); background: white; color: white; }
    .task-row.done .task-toggle { background: var(--success); border-color: var(--success); }
    .task-row.done .task-title { text-decoration: line-through; color: var(--muted); }
    .task-title { font-size: 12px; font-weight: 650; margin-bottom: 4px; }
    .task-meta { color: var(--muted); font-size: 10px; }
    .profile-block { text-align: center; padding: 8px 0 14px; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px; background: linear-gradient(145deg,#c0baff,#655dff); color: white; display: grid; place-items: center; font-size: 19px; font-weight: 740; }

    /* Evaluation */
    .round-flow { display: grid; grid-template-columns: 1fr 50px 1fr; align-items: center; gap: 10px; }
    .round-card { border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .round-card strong { display: block; margin: 5px 0 12px; font-size: 14px; }
    .round-arrow { text-align: center; color: var(--accent); font-size: 24px; }
    .committee-list { display: grid; gap: 10px; }
    .committee-person { display: grid; grid-template-columns: 28px 1fr 70px; gap: 9px; align-items: center; }
    .mini-avatar { width: 28px; height: 28px; border-radius: 50%; background: #ececf2; display: grid; place-items: center; font-size: 9px; font-weight: 700; }
    .review-layout { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(310px,.6fr); gap: 18px; }
    .review-copy { font-size: 13px; line-height: 1.65; color: #43454c; }
    .review-copy h2 { color: var(--ink); font-size: 21px; letter-spacing: -.025em; }
    .review-submission-card { cursor: pointer; transition: border-color 120ms, box-shadow 120ms, transform 120ms; }
    .review-submission-card:hover { border-color: #aaa6ff; box-shadow: 0 8px 26px rgba(45,39,150,.10); transform: translateY(-1px); }
    .review-submission-card:focus-visible { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
    .review-open-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .review-detail-modal { width: min(900px,100%); max-height: calc(100vh - 36px); display: flex; flex-direction: column; }
    .review-detail-modal .modal-head { border-bottom: 1px solid var(--line); }
    .review-detail-scroll { overflow-y: auto; padding-top: 18px; }
    .review-detail-section + .review-detail-section { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
    .review-detail-section h3 { margin: 0 0 10px; font-size: 13px; }
    .review-detail-section p, .review-detail-section li { color: #43454c; font-size: 12px; line-height: 1.65; }
    .review-detail-section p { margin: 0 0 10px; }
    .review-field-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .review-field { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: #fafafb; }
    .review-field dt { color: var(--muted); font-size: 9px; font-weight: 720; letter-spacing: .06em; text-transform: uppercase; }
    .review-field dd { margin: 5px 0 0; color: var(--ink); font-size: 11px; line-height: 1.5; }
    .blind-redaction { display: inline-flex; align-items: center; gap: 6px; color: #6a6c74; font-style: italic; }
    .blind-redaction::before { content: ""; width: 18px; height: 7px; border-radius: 2px; background: repeating-linear-gradient(135deg,#bbbcc3 0 3px,#e2e2e6 3px 6px); }
    .review-file-list { display: grid; gap: 8px; }
    .review-file-row { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; }
    .review-file-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 7px; background: var(--accent-soft); color: var(--accent-dark); font-size: 9px; font-weight: 750; }
    .review-score { position: sticky; top: 76px; }
    .score-buttons { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; margin: 15px 0; }
    .score-button { border: 1px solid var(--line-strong); background: white; border-radius: 8px; min-height: 46px; font-weight: 730; color: #50525a; }
    .score-button:hover, .score-button.active { background: var(--accent-soft); border-color: #aaa6ff; color: var(--accent-dark); }

    /* Agenda */
    .agenda-layout { display: grid; grid-template-columns: 250px minmax(0,1fr); gap: 14px; }
    .unscheduled { max-height: 700px; overflow: auto; padding: 10px; }
    .unscheduled-item { border: 1px solid var(--line); background: white; border-left: 3px solid var(--track-color,var(--accent)); border-radius: 7px; padding: 9px; margin-bottom: 7px; cursor: grab; }
    .unscheduled-item:active { cursor: grabbing; }
    .unscheduled-item strong { display: block; font-size: 10px; line-height: 1.35; margin-bottom: 5px; }
    .unscheduled-item span { color: var(--muted); font-size: 9px; }
    .agenda-board { overflow: auto; min-height: 620px; }
    .agenda-grid { min-width: 760px; display: grid; grid-template-columns: 68px repeat(4,minmax(160px,1fr)); position: relative; }
    .agenda-cell { min-height: 87px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; }
    .agenda-cell.time { color: var(--muted); font-size: 9px; text-align: right; padding-right: 10px; background: #fafafb; }
    .agenda-cell.head { min-height: 42px; position: sticky; top: 0; z-index: 2; background: #fafafb; font-size: 10px; font-weight: 680; display: flex; align-items: center; }
    .agenda-cell.drop-target.drag-over { background: var(--accent-soft); box-shadow: inset 0 0 0 2px #aaa6ff; }
    .session-tile { border-left: 3px solid var(--track-color,var(--accent)); background: white; border-radius: 6px; padding: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.09); height: 100%; position: relative; overflow: hidden; }
    .session-tile strong { display: block; font-size: 9px; line-height: 1.3; margin-bottom: 5px; }
    .session-tile span { color: var(--muted); font-size: 8px; }
    .session-tile.conflict { background: var(--danger-soft); box-shadow: inset 0 0 0 1px #efaaa5; }
    .conflict-flag { color: var(--danger) !important; font-weight: 730; display: block; margin-top: 5px; }
    .swimlanes { display: grid; grid-template-columns: repeat(8,minmax(170px,1fr)); min-width: 1180px; }
    .swimlane { border-right: 1px solid var(--line); min-height: 580px; background: #fafafb; }
    .swimlane-head { position: sticky; top: 0; z-index: 2; background: white; border-top: 4px solid var(--track-color); border-bottom: 1px solid var(--line); padding: 10px; font-size: 10px; min-height: 51px; }
    .swimlane-body { padding: 8px; display: grid; gap: 8px; align-content: start; }
    .swimlane-session { background: white; border: 1px solid var(--line); border-radius: 7px; padding: 9px; }
    .swimlane-session time { color: var(--muted); font-size: 8px; }
    .swimlane-session strong { display: block; font-size: 9px; line-height: 1.35; margin-top: 5px; }
    .agenda-list-row { display: grid; grid-template-columns: 120px 90px minmax(180px,1fr) 170px 130px; border-bottom: 1px solid var(--line); gap: 10px; align-items: center; min-height: 54px; padding: 0 14px; font-size: 10px; }
    .public-agenda-controls { display: flex; gap: 8px; margin: 22px 0; flex-wrap: wrap; }
    .public-session { display: grid; grid-template-columns: 95px 1fr auto; gap: 20px; padding: 20px 0; border-bottom: 1px solid var(--line); align-items: start; }
    .public-session time { color: var(--muted); font-size: 11px; }
    .public-session h3 { margin: 0 0 7px; font-size: 15px; }
    .public-session p { margin: 0; color: var(--muted); font-size: 11px; }

    /* Onboarding chase board */
    .onboarding-metrics { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-bottom: 14px; }
    .onboarding-metric { min-height: 94px; border: 1px solid var(--line); border-radius: var(--radius); background: white; padding: 14px; text-align: left; }
    .onboarding-metric.active { border-color: #aaa6ff; box-shadow: 0 0 0 3px var(--accent-soft); }
    .onboarding-metric span { display: block; color: var(--muted); font-size: 10px; }
    .onboarding-metric strong { display: block; margin: 8px 0 4px; font-size: 25px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .onboarding-metric small { color: var(--success); font-size: 10px; }
    .chase-toolbar { min-height: 58px; padding: 11px 13px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .chase-filters { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .filter-chip { height: 29px; border: 1px solid var(--line-strong); border-radius: 99px; padding: 0 10px; background: white; color: var(--muted); font-size: 10px; }
    .filter-chip.active { border-color: #aaa6ff; background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; }
    .filter-chip b { margin-left: 4px; font-variant-numeric: tabular-nums; }
    .chase-toolbar select { height: 31px; border: 1px solid var(--line-strong); border-radius: 7px; background: white; padding: 0 8px; color: var(--ink); font-size: 10px; }
    .chase-summary { min-width: 170px; text-align: right; color: var(--muted); font-size: 10px; }
    .chase-summary strong { color: var(--ink); font-variant-numeric: tabular-nums; }
    .chase-table { min-width: 1040px; }
    .chase-table th, .chase-table td { padding-left: 8px; padding-right: 8px; }
    .chase-table tbody tr.selected { background: #f5f4ff; }
    .speaker-cell button { max-width: 100%; border: 0; padding: 0; background: none; text-align: left; color: var(--ink); font-weight: 680; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .speaker-cell small { display: block; margin-top: 3px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
    .task-state-cell { text-align: center; }
    .task-state { width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 5px; font-size: 10px; font-weight: 800; }
    .task-state.done { background: var(--success-soft); color: var(--success); }
    .task-state.overdue { background: var(--warning-soft); color: var(--warning); }
    .task-state.risk { background: var(--danger-soft); color: var(--danger); }
    .task-state.upcoming { background: #f0f1f3; color: var(--muted); }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 500; background: rgba(21,22,26,.42); }
    .drawer { position: fixed; z-index: 510; top: 0; right: 0; width: min(500px,96vw); height: 100vh; overflow: auto; background: white; box-shadow: -18px 0 60px rgba(0,0,0,.2); }
    .drawer-head { position: sticky; top: 0; z-index: 2; min-height: 72px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: white; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .drawer-head h2 { margin: 0 0 4px; font-size: 18px; }

    .track-board { min-width: 980px; padding: 14px; background: #17181b; color: #f7f3eb; }
    .track-time-axis { margin-left: 218px; display: grid; grid-template-columns: repeat(7,minmax(105px,1fr)); color: #858892; font-size: 9px; padding: 0 8px 8px; }
    .track-lane { display: grid; grid-template-columns: 150px minmax(0,1fr); min-height: 102px; border-top: 1px solid #34363b; }

    .track-day-slots { display: grid; grid-template-columns: repeat(7,minmax(105px,1fr)); gap: 7px; padding: 8px; background: repeating-linear-gradient(90deg,transparent 0 calc(14.285% - 1px),#2c2e33 calc(14.285% - 1px) 14.285%); }
    .track-slot { min-height: 78px; border: 1px dashed transparent; position: relative; }
    .track-slot.drag-over { border-color: #aaa6ff; background: rgba(99,91,255,.12); }
    .track-tile { position: relative; min-height: 74px; padding: 8px; border: 1px solid #42444a; border-top: 4px solid var(--track-color); border-radius: 5px; background: #25262b; box-shadow: 0 5px 14px rgba(0,0,0,.2); cursor: grab; overflow: hidden; }

<body>
  <div class="prototype-badge">Prototype · mock data</div>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script>
    (() => {
      "use strict";

      const app = document.getElementById("app");
      const toastEl = document.getElementById("toast");
      const modalRoot = document.getElementById("modal-root");

      const tracks = [
        { name: "AI in Financial Services", color: "#635bff" },
        { name: "Agents", color: "#db4c3f" },
        { name: "Evals", color: "#0d9488" },
        { name: "Infra", color: "#d97706" },
        { name: "Open Models", color: "#2563eb" },
        { name: "RAG / Retrieval", color: "#9333ea" },
        { name: "Security", color: "#be185d" },
        { name: "Leadership", color: "#4d7c0f" }
      ];
      const formats = ["Workshop", "Stage Talk", "Lightning", "Online"];
      const formatDurations = { Workshop: 90, "Stage Talk": 20, Lightning: 10, Online: 35 };
      const firstNames = ["Amara", "João", "Sofía", "Kwame", "Élodie", "Nikhil", "Mei-Ling", "Alejandro", "Fatima", "Ravi", "Noor", "Tobias", "Priyanka", "Mateo", "Zainab", "Léa", "Dmitri", "Ananya", "Oluwaseun", "Hana", "Camille", "Jae-Hyun", "Santiago", "Ifeoma", "Márton", "Aisha", "Casey", "Renée", "Theo", "Mina"];
      const lastNames = ["van der Meer", "O'Connell-Singh", "García Márquez", "Okafor", "Al-Khatib", "Kowalska", "Dela Cruz", "Nwosu", "Sørensen", "Mukherjee", "Hernández-López", "Ben-Ari", "Nakamura", "Björnsdóttir", "Ibrahim", "Petrović", "Cheung", "de la Fontaine", "Wachowski", "Adeyemi"];
      const companies = ["Anthropic", "OpenAI", "Modal", "Mistral AI", "Capital One", "JPMorgan Chase", "Bloomberg", "LangChain", "Weights & Biases", "Hugging Face", "Together AI", "Pinecone", "Baseten", "Replicate", "Writer", "Databricks", "MongoDB", "Google DeepMind", "Microsoft AI", "Redwood Research"];
      const titleAngles = ["An operator’s", "A reviewer’s", "A platform team’s", "A field engineer’s", "A research lead’s", "A security team’s", "A founder’s", "A program owner’s"];
      const titleActions = ["field guide to", "postmortem of", "practical case for", "hard-won lessons from", "architecture for", "decision framework for", "unfinished argument about"];
      const titleDomains = ["reliable", "failure-aware", "audit-ready", "low-latency", "human-centered", "privacy-preserving", "evidence-driven"];
      const titleSystems = ["multi-agent systems", "evaluation infrastructure", "enterprise retrieval", "open-weight models", "tool-using agents", "financial copilots", "production inference", "long-context workflows"];
      const titleContextLeads = ["after", "across", "before", "during", "inside", "through", "under", "without"];
      const titleContexts = ["the demo ends", "incompatible risk models collide", "the benchmark becomes the product", "the first serious incident review", "regulated teams have to ship", "the underlying models change", "automation loses its escape hatch"];
      const rooms = ["Metropolitan Ballroom", "Empire East", "Empire West", "Central Park"];
      const waveDates = ["Aug 15", "Sep 1", "Sep 15"];
      const formatRanges = { Workshop:"60–120", "Stage Talk":"15–20", Lightning:"5–10", Online:"5–55" };

      const state = {
        route: "landing",
        submissions: [],
        submissionFilter: "All",
        submissionType: "All",
        submissionTrack: "All",
        submissionSearch: "",
        submissionSort: "newest",
        submissionRecordId: "AIE-0001",
        submissionPage: 1,
        boardSearch: "",
        boardType: "All types",
        boardTrack: "All tracks",
        boardFormat: "All formats",
        boardWave: "All waves",
        selected: new Set(),
        selectAllMatching: false,
        agendaView: "day",
        agendaDay: "Mon · Oct 12",
        agendaBuilderDay: "All days",
        agendaTrack: "All tracks",
        agendaPoolSearch: "",
        agendaScrolls: {},
        agendaSort: "time",
        publicTrack: "All tracks",
        publicSearch: "",
        onboardingFilter: "all",
        onboardingTask: "all",
        onboardingTrack: "All tracks",
        selectedSpeakers: new Set(),
        onboardingDrawer: null,
        onboardingMessages: {},
        reminderTemplate: "Outstanding speaker tasks",
        formTarget: "Abstract",
        cfpTracks: [],
        newSubmissionTracks: ["AI in Financial Services"],
        builderStep: 2,
        builderFields: [
          { id: 1, label: "Session title", kind: "Short text", required: true },
          { id: 2, label: "Abstract", kind: "Long text", required: true },
          { id: 3, label: "Format", kind: "Single select", required: true },
          { id: 4, label: "Track", kind: "Single select", required: true },
          { id: 5, label: "What will attendees learn?", kind: "Long text", required: true },
          { id: 6, label: "Speaker details", kind: "Person", required: true }
        ],
        builderActive: 1,
        reviewIndex: 0,
        reviewScores: {},
        tasks: [
          { id: 1, title: "Accept speaker agreement", kind: "Acknowledge", due: "Overdue · Aug 4", overdue: true, done: false },
          { id: 2, title: "Confirm name, title, and company", kind: "Form", due: "Due Aug 12", done: true },
          { id: 3, title: "Upload a high-resolution headshot", kind: "File request", due: "Due Aug 12", done: true },
          { id: 4, title: "Travel and accommodation", kind: "Form", due: "Due Aug 20", done: false },
          { id: 5, title: "Upload final slides", kind: "File request", due: "Due Oct 5", done: false }
        ],
        portalEditing: false,
        portalRecordId: "AIE-0027",
        portalSessionTitle: "Beyond the demo: reliable multi-agent systems",
        portalSessionDescription: "A field-tested account of evaluation ladders, recovery behavior, and the incidents that changed how the team operates agent systems.",
        scheduled: [],
        roomCapacities: [1200,420,420,210],
        taskTemplates: [
          {id:1,title:"Confirm slot",kind:"Acknowledge",description:"Confirm participation for each accepted role.",due:7},
          {id:2,title:"Bio + headshot",kind:"Form",description:"Review profile copy and upload a high-resolution headshot.",due:14},
          {id:3,title:"A/V needs",kind:"Form",description:"Tell the production team what belongs in the room.",due:21},
          {id:4,title:"Upload slides",kind:"File request",description:"Upload the final presentation deck.",due:42}
        ],
        commsTemplates: [
          {id:"acceptance",name:"Acceptance",subject:"You’re speaking at {{event.name}}",body:"Hi {{speaker.first_name}},\n\nWe’re delighted to accept {{session.title}}. Open your portal to confirm and complete your tasks."},
          {id:"rejection",name:"Rejection",subject:"An update on {{session.title}}",body:"Hi {{speaker.first_name}},\n\nThank you for sharing {{session.title}}. We aren’t able to include it in this year’s program."},
          {id:"task-overdue",name:"Task overdue",subject:"AIE NYC: {{task.title}} is overdue",body:"Hi {{speaker.first_name}},\n\nPlease complete {{task.title}} in your speaker portal."}
        ],
        activeCommsTemplate: "acceptance",
        commsTriggers: {confirmation:true,closing:true,added:true,acceptance:true,rejection:true,assigned:true,overdue:true},
        outbox: [
          {id:"MSG-01842",recipient:"amara.vandermeer@example.com",template:"Acceptance",subject:"You’re speaking at AIE NYC 2026",outcome:"Delivered",time:"Today · 10:04 AM"},
          {id:"MSG-01841",recipient:"joao.garcia@example.com",template:"Task overdue",subject:"AIE NYC: Bio + headshot is overdue",outcome:"Bounced",time:"Today · 9:42 AM"},
          {id:"MSG-01840",recipient:"fatima.alkhatib@example.com",template:"Submission confirmation",subject:"We received your abstract",outcome:"Delivered",time:"Today · 9:17 AM"}
        ],
        importStep: 0,
        importBatch: null,
        airtableLog: ["09:42:17 connected to appAIE2026", "09:42:18 local 1,040 · Airtable 1,040", "09:42:18 outbox clear · mirror healthy"],
        apiTokens: [{id:"tok_92Jf",name:"Agenda publisher",prefix:"mq_live_92Jf…",created:"Aug 8",lastUsed:"2 minutes ago"}],
        aiEnabled: false,
        emptyInstall: false,
        event: loadEvent()
      };

      function loadEvent() {
        const fallback = { name: "AIE NYC 2026", start: "2026-10-12", end: "2026-10-14", timezone: "America/New_York", venue: "Sheraton New York Times Square", accent: "Violet" };
        try { return { ...fallback, ...JSON.parse(localStorage.getItem("marquee-prototype-event") || "{}") }; }
        catch (_) { return fallback; }
      }

      function seededRandom(seed) {
        let x = Math.sin(seed * 999) * 10000;
        return x - Math.floor(x);
      }

      function personName(i) {
        const first = firstNames[(i * 7 + 3) % firstNames.length];
        const last = lastNames[((i % firstNames.length) * 11 + Math.floor(i / firstNames.length) * 7 + 5) % lastNames.length];
        return `${first} ${last}`;
      }

      function makeTitle(i) {
        const n = i % 56;
        const openingIndex = (n * 17) % 56;
        const subjectIndex = (n * 13 + 5) % 56;
        const contextIndex = (n * 23 + 11) % 56;
        const opening = `${titleAngles[openingIndex % titleAngles.length]} ${titleActions[Math.floor(openingIndex / titleAngles.length)]}`;
        const subject = `${titleDomains[subjectIndex % titleDomains.length]} ${titleSystems[Math.floor(subjectIndex / titleDomains.length)]}`;
        const context = `${titleContextLeads[contextIndex % titleContextLeads.length]} ${titleContexts[Math.floor(contextIndex / titleContextLeads.length)]}`;
        let title = `${opening} ${subject} ${context}`;
        if (i % 17 === 0) title += ": lessons from two years, fourteen teams, and one very long incident review";
        return title;
      }

      function seedSubmissions() {
        const out = [];
        const statusFor = i => {
          if (i < 26) return "Published";
          if (i < 32) return "Scheduled";
          if (i < 190) return "Accepted";
          if (i < 280) return "In Review";
          if (i < 630) return "Submitted";
          if (i < 750) return "Waitlisted";
          if (i < 1010) return "Rejected";
          return "Withdrawn";
        };
        for (let i = 0; i < 1040; i++) {
          const accepted = i < 190;
          const entity = i < 40 ? "Session" : "Abstract";
          const speaker = i === 26 ? "Amara van der Meer" : (i === 13 || i === 47 || i === 88 ? "Casey O'Connell-Singh" : personName(i));
          const coSpeakers = i === 72 ? [speaker, personName(333), personName(477), personName(698)] : (i % 23 === 0 ? [speaker, personName(i + 101)] : [speaker]);
          const trackName = i >= 150 && i < 364
            ? "Agents"
            : i >= 364 && i < 590
              ? tracks.filter(t => t.name !== "Agents")[(i * 5 + 1) % 7].name
              : tracks[(i * 5 + 1) % tracks.length].name;
          const primaryTrackIndex = tracks.findIndex(t=>t.name===trackName);
          const carriedTracks = i % 20 < 3
            ? [trackName, tracks[(primaryTrackIndex+3)%tracks.length].name, ...(i%40===0?[tracks[(primaryTrackIndex+5)%tracks.length].name]:[])]
            : [trackName];
          const boardStage = i < 26 ? "Published" : i < 32 ? "Scheduled" : i < 92 ? "Accepted" : i < 190 ? "Onboarding" : i < 280 ? "In Review" : i < 630 ? "Submitted" : "Waved";
          out.push({
            id: `AIE-${String(i + 1).padStart(4,"0")}`,
            title: i===26 ? "Beyond the demo: reliable multi-agent systems" : makeTitle(i), entity, speaker, speakers: coSpeakers,
            company: i===26 ? "Capital One" : companies[(i * 13 + 4) % companies.length],
            status: statusFor(i), accepted,
            wave: accepted ? (i < 63 ? 1 : i < 126 ? 2 : 3) : null,
            waveDate: accepted ? waveDates[i < 63 ? 0 : i < 126 ? 1 : 2] : null,
            track: trackName,
            tracks: carriedTracks,
            boardStage,
            timeInStageHours: ((i*37)%720)+2,
            format: formats[(i * 3 + 1) % formats.length],
            score: i >= 150 && i < 240 ? (2.8 + seededRandom(i) * 2.1).toFixed(1) : "—",
            submitted: `2026-0${6 + (i % 2)}-${String(2 + (i * 7) % 27).padStart(2,"0")}`,
            source: entity === "Session" ? "Admin created" : "Public CFP"
          });
        }
        return out;
      }

      state.submissions = seedSubmissions();

      const onboardingTaskDefs = [
        { key:"confirm", label:"Confirm slot", kind:"Action", due:"Aug 22" },
        { key:"bio", label:"Bio + headshot", kind:"Form", due:"Aug 28" },
        { key:"av", label:"A/V needs", kind:"Form", due:"Sep 3" },
        { key:"slides", label:"Upload slides", kind:"File request", due:"Oct 2" },
        { key:"travel", label:"Travel details", kind:"Form", due:"Sep 10" }
      ];

      function seedOnboardingSpeakers() {
        const byName = new Map();
        state.submissions.filter(s=>s.accepted).forEach(s=>{
          if (!byName.has(s.speaker)) byName.set(s.speaker, {
            id:`P-${String(byName.size+1).padStart(3,"0")}`, name:s.speaker, company:s.company,
            email:`speaker.${byName.size+1}@example.org`, title:byName.size%4===0?"Distinguished Engineer, Applied AI":"Founder & Principal Engineer",
            track:s.track, wave:s.waveDate, sessions:[], statuses:[],
            bio:"Builds production AI systems where reliability, accountability, and human judgment matter. Previously led applied research and platform teams across finance and developer infrastructure."
          });
          byName.get(s.speaker).sessions.push(s);
        });
        const people = [...byName.values()];
        const fullyComplete = Math.max(0, people.length - 103);
        people.forEach((p,i)=>{
          p.statuses = onboardingTaskDefs.map((_,j)=>{
            if (i < fullyComplete) return "done";
            if (i < fullyComplete + 38 && j === i % onboardingTaskDefs.length) return "risk";
            if ((i + j) % 4 === 0) return "overdue";
            if ((i + j) % 5 === 0) return "done";
            return "upcoming";
          });
        });
        return people;
      }

      const onboardingSpeakers = seedOnboardingSpeakers();

      function ensureOnboardingSpeaker(submission) {
        let person = onboardingSpeakers.find(p=>p.name===submission.speaker);
        if (person) {
          if (!person.sessions.some(s=>s.id===submission.id)) person.sessions.push(submission);
          return;
        }
        person = {
          id:`P-${String(onboardingSpeakers.length+1).padStart(3,"0")}`, name:submission.speaker, company:submission.company,
          email:`speaker.${onboardingSpeakers.length+1}@example.org`, title:"Speaker", track:submission.track, wave:submission.waveDate,
          sessions:[submission], statuses:["upcoming","overdue","upcoming","upcoming","upcoming"],
          bio:"Accepted speaker profile awaiting completion."
        };
        onboardingSpeakers.push(person);
      }

      function seedAgenda() {
        const accepted = state.submissions.filter(s => s.accepted).slice(0, 32);
        state.scheduled = accepted.map((s, i) => ({
          ...s,
          day: ["Mon · Oct 12", "Tue · Oct 13", "Wed · Oct 14"][Math.floor(i / 24)],
          time: ["09:00", "10:00", "11:00", "13:30", "14:30", "15:30"][Math.floor((i % 24) / 4)],
          room: rooms[i % rooms.length],
          duration: formatDurations[s.format],
          conflict: i === 13 || i === 14,
          speaker: i === 13 || i === 14 ? "Casey O'Connell-Singh" : s.speaker
        }));
        state.scheduled[13].speakers = ["Casey O'Connell-Singh"];
        state.scheduled[14].speakers = ["Casey O'Connell-Singh"];
        state.scheduled[15].room = state.scheduled[14].room;
      }
      seedAgenda();

      const routeNames = {
        landing: "Demo", settings: "Event settings", dashboard: "Program pipeline", board: "Program board", forms: "Form builder",
        cfp: "Public CFP form", portal: "Speaker portal", evaluation: "Evaluation plan", reviewer: "Reviewer queue",
        submissions: "Abstracts", submissionDetail:"Submission record", submissionNew:"Create submission",
        onboarding: "Speaker onboarding", agenda: "Agenda builder", publicAgenda: "Event site", comms:"Communications",
        taskTemplates:"Task templates", importer:"Sessionize importer", airtable:"Airtable mirror", apiTokens:"API tokens",
        apiDocs:"API documentation", aiAssist:"AI assist", publicSession:"Session", publicSpeaker:"Speaker"
      };

      function esc(value) {
        return String(value ?? "").replace(/[&<>'"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" }[ch]));
      }

      function toast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => toastEl.classList.remove("show"), 2400);
      }

      function trackChips(record, compact = false) {
        if (!record || record.kind === "break") return "";
        return `<div class="track-chip-row">${(record.tracks||[record.track]).map((name,i)=>`<span class="chip" style="border-left:3px solid ${trackColor(name)};${compact?"font-size:7px;padding:2px 5px":""}">${esc(name)}${i===0&&!compact?" · Primary":""}</span>`).join("")}</div>`;
      }

      function sessionSlot(recordOrId) {
        const id = typeof recordOrId === "string" ? recordOrId : recordOrId?.id;
        if (!id) return null;
        if (typeof recordOrId === "object" && recordOrId.day && recordOrId.time && recordOrId.room) return recordOrId;
        return state.scheduled.find(item=>item.id===id && item.kind!=="break") || null;
      }

      function scheduleMeta(recordOrId, compact = false, publish = true) {
        const slot = sessionSlot(recordOrId);
        if (!slot) return "";
        const unpublished = slot.status !== "Published";
        return `<div class="slot-meta ${compact?"compact":""}" data-slot-for="${esc(slot.id)}"><span class="slot-chip">${esc(slot.day)} · ${esc(slot.time)} · ${esc(slot.room)}</span>${unpublished?`<span class="not-public">Not yet public</span>${publish?`<button class="publish-link" data-publish-id="${esc(slot.id)}">Publish</button>`:""}`:""}</div>`;
      }

      function formatTimeInStage(hours) {
        if (hours < 24) return `${hours}h in stage`;
        const days = Math.floor(hours/24);
        return `${days}d in stage`;
      }

      function boardStageFor(submission) {
        const slot = sessionSlot(submission);
        if (slot?.status === "Published") return "Published";
        if (slot) return "Scheduled";
        return submission.boardStage || (submission.accepted ? "Onboarding" : submission.status === "In Review" ? "In Review" : "Submitted");
      }

      function showPublishModal(id) {
        const slot=sessionSlot(id), submission=state.submissions.find(item=>item.id===id);
        if(!slot||slot.status==="Published")return;
        modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div class="eyebrow">Publish Session</div><h2>Make ${esc(submission?.title||slot.title)} public?</h2><p>This places the Session on the live event site and exposes its public permalink.</p></div><div class="modal-body"><div class="message-preview"><strong>${esc(slot.day)} · ${esc(slot.time)} · ${esc(slot.room)}</strong><br><span class="subtle">Tracks, speakers, and the latest title and description will become public together.</span></div></div><div class="modal-actions"><button class="button" id="cancel-publish">Keep private</button><button class="button primary" id="confirm-publish">Publish Session</button></div></section></div>`;
        document.getElementById("cancel-publish").onclick=()=>modalRoot.innerHTML="";
        document.getElementById("confirm-publish").onclick=()=>{
          slot.status="Published";
          if(submission){submission.status="Published";submission.boardStage="Published";submission.timeInStageHours=1;}

          toast("Session published · live on the public site");
          render();

      }

        if (/^submissions\/new$/.test(path)) return "submissionNew";

        if (/^s\/[^/]+$/.test(path)) { state.publicRecordId = decodeURIComponent(path.split("/")[1]); return "publicSession"; }
        if (/^p\/[^/]+$/.test(path)) { state.publicPersonName = decodeURIComponent(path.slice(2)); return "publicSpeaker"; }
        return ({"settings/tasks":"taskTemplates","settings/airtable":"airtable","settings/api":"apiTokens","api/docs":"apiDocs","evaluation/ai":"aiAssist","import":"importer"})[path] || path;
      }

      function currentRoute() {
        const raw = location.hash.replace(/^#\/?/, "") || "landing";

        state.emptyInstall = new URLSearchParams(query).get("empty") === "1";

                  <button class="metric-box" style="border:0;text-align:left;background:white" data-route="agenda"><span class="eyebrow">Unscheduled</span><div class="metric">${counts.AcceptedTotal - counts.Scheduled}</div><span class="subtle">accepted sessions</span></button>

                </div>

              </div>

              <div class="card-body" style="padding-top:4px;padding-bottom:4px">

      const programBoardStages = [
        {name:"Submitted",hint:"Received and waiting"},
        {name:"In Review",hint:"Committee work underway"},
        {name:"Waved",hint:"Decision wave prepared"},
        {name:"Accepted",hint:"Decision confirmed"},
        {name:"Onboarding",hint:"Speaker work underway",derived:true,entry:"Open an accepted record to manage speaker tasks and onboarding."},
        {name:"Scheduled",hint:"Placed on working agenda",derived:true,entry:"Open an accepted record, then choose Place on agenda."},
        {name:"Published",hint:"Live on public site",derived:true,entry:"Open a scheduled record, then choose Publish Session."}
      ];

      function filteredBoardSubmissions() {
        const q=state.boardSearch.trim().toLowerCase();
        return state.submissions.filter(s=>
          (!q||[s.id,s.title,s.company,...s.speakers].some(value=>String(value).toLowerCase().includes(q))) &&
          (state.boardType==="All types"||`${s.entity}s`===state.boardType) &&
          (state.boardTrack==="All tracks"||(s.tracks||[s.track]).includes(state.boardTrack)) &&
          (state.boardFormat==="All formats"||s.format===state.boardFormat) &&
          (state.boardWave==="All waves"||(state.boardWave==="Unwaved"?!s.wave:`Wave ${s.wave}`===state.boardWave))
        );
      }

      function boardCard(submission) {
        const actualStatus = submission.status!==boardStageFor(submission) ? `<span class="chip">${submission.status==="Waitlisted"?"Maybe":esc(submission.status)}</span>` : "";
        return `<article class="board-card" role="link" tabindex="0" data-board-card="${submission.id}" data-board-record="${submission.id}" aria-label="Open ${esc(submission.id)}: ${esc(submission.title)}" style="--track-color:${trackColor(submission.track)}"><div style="display:flex;align-items:center;justify-content:space-between;gap:6px"><span class="chip ${submission.entity==="Session"?"session":""}">${submission.entity}</span>${actualStatus}</div><h3>${esc(submission.title)}</h3><p>${esc(submission.speakers.join(" · "))}</p>${trackChips(submission,true)}${scheduleMeta(submission,true,false)}<div class="board-card-foot"><span>${esc(submission.format)} · ${submission.wave?`Wave ${submission.wave}`:"Unwaved"}</span><strong>${formatTimeInStage(submission.timeInStageHours)}</strong></div></article>`;

      function boardView() {
        const matching=filteredBoardSubmissions();
        return shell(`<div class="page">
          ${pageHead("Program board", `${matching.length.toLocaleString()} matching submissions across seven lifecycle stages · click any card to open its record and take action.`, `<button class="button" data-route="dashboard">Pipeline dashboard</button><button class="button primary" data-route="submissions">Open list</button>`)}
          <section class="card"><div class="toolbar" aria-label="Program board filters"><input id="board-search" value="${esc(state.boardSearch)}" aria-label="Search board" placeholder="Search title, speaker, ID, or company"><select id="board-type-filter" aria-label="Filter by type">${["All types","Abstracts","Sessions"].map(value=>`<option ${state.boardType===value?"selected":""}>${value}</option>`).join("")}</select><select id="board-track-filter" aria-label="Filter by track"><option>All tracks</option>${tracks.map(t=>`<option ${state.boardTrack===t.name?"selected":""}>${esc(t.name)}</option>`).join("")}</select><select id="board-format-filter" aria-label="Filter by format"><option>All formats</option>${formats.map(f=>`<option ${state.boardFormat===f?"selected":""}>${esc(f)}</option>`).join("")}</select><select id="board-wave-filter" aria-label="Filter by wave">${["All waves","Wave 1","Wave 2","Wave 3","Unwaved"].map(w=>`<option ${state.boardWave===w?"selected":""}>${w}</option>`).join("")}</select><span class="toolbar-spacer"></span><div class="board-filter-summary"><strong>${matching.length.toLocaleString()}</strong> of ${state.submissions.length.toLocaleString()}<button class="button small" id="clear-board-filters">Clear filters</button></div></div><div class="card-body" style="padding:10px"><div class="program-board-shell"><div class="program-board">
            ${programBoardStages.map(stage=>{const cards=matching.filter(s=>boardStageFor(s)===stage.name);return `<section class="board-column ${stage.derived?"derived":""}" data-board-column="${stage.name}" data-derived="${stage.derived?"true":"false"}"><header class="board-column-head"><div><strong>${stage.name}</strong><small>${stage.hint}</small></div><span class="board-count">${cards.length}</span></header>${stage.derived?`<div class="board-derived-note">${stage.entry}</div>`:""}<div class="board-card-list">${cards.map(boardCard).join("")||`<div class="subtle" style="padding:24px;text-align:center">No matching submissions</div>`}</div></section>`}).join("")}
          </div></div></div></section>
        </div>`);
      }

      function showLifecycleTransition(id,targetStage) {
        const submission=state.submissions.find(s=>s.id===id); if(!submission)return;
        const fromStage=boardStageFor(submission); if(fromStage===targetStage){toast(`${submission.id} is already in ${targetStage}`);return;}
        const slot=sessionSlot(submission), accepting=targetStage==="Accepted";
        modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div class="eyebrow">Lifecycle transition</div><h2>Move ${esc(submission.id)} to ${esc(targetStage)}?</h2><p>${esc(fromStage)} → ${esc(targetStage)} · the record updates only after confirmation.</p></div><div class="modal-body stack"><div class="message-preview"><strong>${esc(submission.title)}</strong><br><span class="subtle">${esc(submission.speakers.join(" · "))}</span></div>${accepting?`<div class="wave-row"><strong>Portal + acceptance email</strong><span></span><strong>Queue</strong></div><div class="wave-row"><strong>Speaker task set</strong><span></span><strong>Assign</strong></div>`:""}${slot?`<div class="wave-row"><strong>Agenda + public surfaces</strong><span></span><strong class="chip overdue">Remove</strong></div>`:""}<p class="subtle">The transition is stamped in history. Existing review evidence remains attached to the record.</p></div><div class="modal-actions"><button class="button" id="cancel-lifecycle-transition">Cancel</button><button class="button primary" id="confirm-lifecycle-transition">Move to ${esc(targetStage)}</button></div></section></div>`;
        document.getElementById("cancel-lifecycle-transition").onclick=()=>modalRoot.innerHTML="";
        document.getElementById("confirm-lifecycle-transition").onclick=()=>{
          if(slot)state.scheduled=state.scheduled.filter(item=>item.id!==submission.id);
          submission.boardStage=targetStage;
          submission.timeInStageHours=1;
          if(targetStage==="Submitted"){submission.status="Submitted";submission.accepted=false;submission.wave=null;}
          if(targetStage==="In Review"){submission.status="In Review";submission.accepted=false;}
          if(targetStage==="Waved"){submission.status="Waitlisted";submission.accepted=false;submission.wave=submission.wave||2;}
          if(targetStage==="Accepted"){submission.status="Accepted";submission.accepted=true;submission.wave=submission.wave||2;submission.waveDate=submission.waveDate||waveDates[submission.wave-1];ensureOnboardingSpeaker(submission);}
          modalRoot.innerHTML="";
          toast(`${submission.id} moved to ${targetStage} · history stamped`);
          render();
        };
      }

      function bindBoard() {
        let searchTimer;document.getElementById("board-search")?.addEventListener("input",e=>{state.boardSearch=e.target.value;const cursor=e.target.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const next=document.getElementById("board-search");next?.focus();next?.setSelectionRange?.(cursor,cursor);},80);});
        document.getElementById("board-type-filter")?.addEventListener("change",e=>{state.boardType=e.target.value;render();});
        document.getElementById("board-track-filter")?.addEventListener("change",e=>{state.boardTrack=e.target.value;render();});
        document.getElementById("board-format-filter")?.addEventListener("change",e=>{state.boardFormat=e.target.value;render();});

      function pipelineCounts() {
        const result = { Submitted: 0, "In Review": 0, Accepted: 0, Scheduled: 0, Published: 0, AcceptedTotal: 0 };
        state.submissions.forEach(s => { if (result[s.status] !== undefined) result[s.status]++; if (s.accepted) result.AcceptedTotal++; });
        result.Scheduled += result.Published;
        return result;
      }
      function pipelineStage(name, count, note, filter, route = "submissions", meaning = "") {
        return `<button class="pipeline-stage" data-pipeline-filter="${esc(filter)}" data-pipeline-route="${route}"><span class="pipeline-name">${esc(name)}</span><strong class="pipeline-count">${count.toLocaleString()}</strong><span class="pipeline-delta">${esc(note)} →</span>${meaning?`<span class="pipeline-meaning">${esc(meaning)}</span>`:""}</button>`;
      }
      function onboardingCounts() {
        return {
          incomplete:onboardingSpeakers.filter(p=>p.statuses.some(s=>s!=="done")).length,
          overdue:onboardingSpeakers.filter(p=>p.statuses.includes("overdue")||p.statuses.includes("risk")).length,
          overdueTasks:onboardingSpeakers.reduce((n,p)=>n+p.statuses.filter(s=>s==="overdue"||s==="risk").length,0),
          risk:onboardingSpeakers.filter(p=>p.statuses.includes("risk")).length
        };
      }
      function acceptedByWave(wave) { return state.submissions.filter(s => s.accepted && s.wave === wave).length; }

      function filteredSubmissions() {
        const q = state.submissionSearch.trim().toLowerCase();
        let list = state.submissions.filter(s =>
          (state.submissionFilter === "All" ||
            (state.submissionFilter === "Accepted" && s.accepted) ||
            (state.submissionFilter === "Waved" && s.accepted && s.wave <= 2) ||
            (state.submissionFilter === "Scheduled" && ["Scheduled","Published"].includes(s.status)) ||
            (state.submissionFilter === "Unreviewed" && ["Submitted","In Review"].includes(s.status)) ||
            s.status === state.submissionFilter) &&
          (state.submissionType === "All" || s.entity === state.submissionType) &&
          (state.submissionTrack === "All" || (s.tracks||[s.track]).includes(state.submissionTrack)) &&
          (!q || [s.id,s.title,s.speaker,s.company,(s.tracks||[s.track]).join(" ")].some(v => v.toLowerCase().includes(q)))
        );
        if (state.submissionSort === "score") list.sort((a,b) => Number(b.score === "—" ? -1 : b.score) - Number(a.score === "—" ? -1 : a.score));
        if (state.submissionSort === "title") list.sort((a,b) => a.title.localeCompare(b.title));
        return list;
      }

      function apiDocsView() {
        const endpoints=[["GET","/v1/events/:id/submissions","List submissions with status, type, track, search, sort, and cursor filters."],["POST","/v1/events/:id/submissions","Create an Abstract or Session; Session may bypass evaluation."],["PATCH","/v1/submissions/:id","Update status and receive the cascade plan."],["POST","/v1/submissions/:id/reverse-acceptance","Apply explicit retain/cancel choices for dependent work."],["GET","/v1/events/:id/agenda","Read the same filtered agenda shown in the UI."],["POST","/v1/events/:id/imports/sessionize","Create an idempotent import batch."]];
