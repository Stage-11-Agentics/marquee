  <title>Marquee — Pipeline v1.12 prototype</title>
  <!-- v1.12 (2026-08-12): the theme system (MRQ-103, operator directive
       overriding DESIGN.md's no-dark-mode-by-Wednesday ruling). Every color
       that was hardcoded in CSS/JS is now a token; a theme is one CSS block
       on html[data-theme] plus a THEMES registry row. Day is unchanged and
       remains the default (no prefers-color-scheme auto-switch — judges get
       Day unless someone chooses otherwise; choice persists in localStorage).
       Night is the quiet server room: strictly neutral greys, chroma held
       for status and the restrained teal, the agenda canvas still darker
       than the page so day's figure-ground survives. Adding a theme is one
       CSS block + one registry row. Contrast-measured: every text pair
       ≥ 4.5:1, most 6–16:1. Seeded tracks carry per-theme octaves (day hues
       are tuned for white and go muddy on dark ground); custom tracks keep
       their stored color. ?theme= overrides for one load without persisting.
       v1.11 (2026-08-12): the cold start, from the true step zero. Initial
       setup is run by the operator's own coding agent reading SKILL.md
       (client ruling D4); the UI is the receipt. New: an unclaimed-instance
       landing, the agent setup replay (two phases: deploy → claim link, then
       token → conference provisioning), the human claim screen (identity
       cannot ride on magic-link mail — mail is a setup output, so the deploy
       terminal prints a one-time claim link), the token handoff with three
       doors (agent continues · by hand · explore the demo), an Instance panel
       (Mail/Uploads/Spam/Domain honestly configured-or-not; opening intake
       without mail warns and requires acknowledgment, never blocks), the demo
       conference side-by-side (DEMO-chipped in the switcher, explorable via
       peek, removable without touching your data), organizer management with
       mail-independent one-time invite links, and second-conference creation
       through the switcher's ＋ (same checklist, conference-scoped, instance
       rows already green). Decisions: prototypes/cold-start/DECISIONS.md.
       v1.10 (2026-08-11): public-widget widening (collaborator note, rubric
       area "Public Widgets"). The embed dialog grows from two formats to four:
       Agenda, Sessions (flat filterable list), Speakers (cards or list layout),
       and Call for speakers (US-16 promoted into scope — live deadline/formats
       block that flips to closed automatically). Track filter and layout are
       part of the copyable snippet URL. Controls hold fixed positions across
       format switches; inapplicable controls disable, never disappear.
       v1.9 (2026-08-11): venue set reconciled with SPEC Amendment 14 and the
       shipped seed. The 2025 building set (The Times Center, Jay Suites, AWS
       JFK27) was chronologically wrong for a 2026 Sheraton conference and paired
       Sheraton-native room names with 2025 venues. Now: Sheraton New York Times
       Square as primary, New York Marriott Marquis as real overflow a nine-minute
       walk down 7th Ave, Online unpinned. The transit case moves to Metropolitan
       Ballroom → Marquis Room A, which is a genuine cross-building hop: 9 min walk
       + 3 min access = 12 needed against a 10-minute gap.
       v1.8 (2026-08-10): the Sessionboard gap-analysis fold, contract-now band
       (sequence/research/sessionboard-gap-analysis.md § Decided scope):
       markdown-toolbar rich text · Tags + Level taxonomy · post-submit
       auto-redirect · View portal / Back to Admin impersonation · per-plan
       ratings column + text filter operators · submission pacing chart vs the
       2025 edition · form section elements · Notified column · internal/
       external form names · conference-default submission limit (drafts count)
       · pronouns + discrete socials · Client session ID + session capacity ·
       max-sponsors control removed. -->

  <style>
    /* ════════════════════════════════════════════════════════════════════
       MARQUEE v1.5 — FLIGHT DECK
       The ops person's cockpit in daylight: a hairline instrument grid,
       monospaced figures and micro-labels, zero shadow and zero ornament,
       so every number reads like a gauge and the panel scans in one pass.
       Geometry is inherited from v1.4 unchanged; only the surface language
       is replaced. Contrast: all body/label pairs ≥ 4.5:1, most 6-18:1.
       ════════════════════════════════════════════════════════════════════ */
    :root {
      --bg: #eaeef2;
      --panel: #fff;
      --sunk: #f4f7f9;
      --graph: #e3e9ee;
      --ink: #101820;
      --ink-soft: #2c3a46;
      --muted: #57646f;
      --line: #dde4ea;
      --line-strong: #c8d2da;
      --accent: #0b6a72;
      --accent-soft: #e2f0f1;
      --accent-dark: #084f55;
      --danger: #b02a1f;
      --danger-soft: #fbe9e7;
      --warning: #8a5c00;
      --warning-soft: #fdf1dd;
      --success: #0f7a4a;
      --success-soft: #e5f3ec;
      --canvas: #0f1a22;          /* dark instrument canvas (track view)   */
      --canvas-line: #24343f;
      --canvas-ink: #dbe6ec;
      --shadow: none;             /* depth is a rule, never a blur         */
      --radius: 3px;              /* machined, not rounded                 */
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --display: var(--mono);     /* the display face is the machine face  */

      /* ── Theme extensions (v1.11 / MRQ-103): every hex that was hardcoded
         below is now a token so themes can re-light the whole panel. Day
         values are the shipped colors, verbatim. ─────────────────────────── */
      --accent-hover: #095b62;
      --on-accent: #fff;
      --accent-line: #a9cdd0;
      --success-ink: #0c6b41;
      --success-line: #b6dcc7;
      --danger-ink: #8f2118;
      --danger-line: #e6b8b2;
      --warning-line: #e3cda2;
      --warning-ink: #6b4700;
      --warning-edge: #d6b25c;    /* dashed attention border                */
      --on-ink: #dff2f3;          /* text on inverse (--ink) chrome         */
      --on-ink-plain: #eaf3f6;
      --on-ink-line: #4a5a66;
      --on-ink-hover: #6fd3da;
      --backdrop: rgba(16,24,32,.46);
      --veil: rgba(255,255,255,.72);        /* pipeline stage face over bg  */
      --veil-strong: rgba(255,255,255,.82);
      --veil-dim: rgba(255,255,255,.5);
      --wave-tick: rgba(255,255,255,.85);   /* simulated bg through the bar */
      --break-tint: #81838b;      /* neutral: break tiles, prior-year line  */
      --break-stripe: #eaeff3;
      --spectrum: linear-gradient(90deg,#635bff,#db4c3f,#0d9488,#d97706,#2563eb,#9333ea,#4d7c0f);
      /* the dark-instrument sub-language: agenda canvas, status hero, logs */
      --canvas-ink-soft: #a8bdc6;
      --canvas-eyebrow: #7fb3b8;
      --canvas-muted: #7d949f;
      --canvas-link: #6fd3da;
      --canvas-accent: #4fd6b0;
      --canvas-code-ink: #cfe4e6;
      --canvas-log-ink: #b9ccd4;
      --canvas-chip-bg: rgba(255,255,255,.07);
      --canvas-chip-line: #3a4d59;
      --canvas-chip-ink: #cfe0e7;
      --canvas-ok-bg: rgba(79,214,176,.12);
      --canvas-ok-line: #2c6a58;
      --canvas-ok-ink: #86e3c4;
      --canvas-warn-bg: rgba(240,201,128,.14);
      --canvas-warn-line: #7a5f22;
      --canvas-warn-ink: #f0c980;
      --canvas-grid: #1e2c36;
      --canvas-band-line: #1c2a34;
      --canvas-day-ink: #c3d6de;
      --canvas-tile: #16242e;
      --canvas-tile-line: #2f424e;
      --canvas-tile-ink: #eaf3f6;
      --canvas-tile-muted: #90a8b4;
      --canvas-alarm: #ff8a80;
      --canvas-alarm-ink: #2a0f0c;
      --canvas-btn: #1d2f3a;
      --canvas-btn-line: #35505e;
      --canvas-drop: #35b3bd;
      --canvas-drop-bg: rgba(53,179,189,.14);
    }



    /* ════ NIGHT ══════════════════════════════════════════════════════════
       The quiet server room: strictly neutral greys, chroma reserved for
       status and the restrained teal. The agenda canvas stays DARKER than
       the page — the day figure-ground relationship preserved as-is.
       Measured: all text pairs 6.3–15.7:1. ─────────────────────────────── */
    html[data-theme="night"] {
      --bg: #121416;
      --panel: #1a1d20;
      --sunk: #15181b;
      --graph: #21252a;
      --ink: #e9edf0;
      --ink-soft: #c0c8ce;
      --muted: #93a0a9;
      --line: #2a3036;
      --line-strong: #3a4249;
      --accent: #3fbac2;
      --accent-soft: #0f3134;
      --accent-dark: #7cd7dd;
      --accent-hover: #5cc9d0;
      --on-accent: #062629;
      --accent-line: #2a565b;
      --danger: #f5867c;
      --danger-soft: #391715;
      --danger-ink: #ffaba2;
      --danger-line: #6e2d27;
      --warning: #dcb75a;
      --warning-soft: #2f260f;
      --warning-line: #695620;
      --warning-ink: #eeca8a;
      --warning-edge: #83702c;
      --success: #5ac98e;
      --success-soft: #122d1e;
      --success-ink: #92dcb6;
      --success-line: #2b5c42;
      --on-ink: #101315;
      --on-ink-plain: #101315;
      --on-ink-line: #a2adb5;
      --on-ink-hover: #0b6a72;
      --backdrop: rgba(0,0,0,.62);
      --veil: rgba(255,255,255,.04);
      --veil-strong: rgba(255,255,255,.06);
      --veil-dim: rgba(255,255,255,.02);
      --wave-tick: rgba(0,0,0,.45);
      --break-tint: #939ea6;
      --break-stripe: #1b2025;
      --spectrum: linear-gradient(90deg,#8b85ff,#f2705f,#2ec4b6,#f59e0b,#5b8def,#b06ef5,#84cc16);
      --canvas: #0d0f11;
      --canvas-line: #262b30;
      --canvas-ink: #dbe3e8;
      --canvas-ink-soft: #a4b2ba;
      --canvas-eyebrow: #84acb2;
      --canvas-muted: #8d9ca5;
      --canvas-grid: #1d2226;
      --canvas-band-line: #1b2024;
      --canvas-day-ink: #c6ced4;
      --canvas-tile: #14181b;
      --canvas-tile-line: #2c3338;
      --canvas-btn: #1c2226;
      --canvas-btn-line: #363e42;
      --canvas-drop: #3fbac2;
      --canvas-drop-bg: rgba(63,186,194,.14);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    body { margin: 0; min-width: 320px; }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    [hidden] { display: none !important; }
    .tabular, .metric, .pipeline-count, td { font-variant-numeric: tabular-nums lining-nums; }
    .metric, .pipeline-count, .board-count, .onboarding-metric strong,
    .mini-stage strong, .attention-item strong, .filter-chip b { font-family: var(--mono); }
    .eyebrow, .nav-label, .view-label, th, .agenda-list-head, .drawer-section h3,
    .card-head h2, .card-head h3, .review-field dt { font-family: var(--mono); }

    .prototype-badge {
      position: fixed; z-index: 1000; right: 12px; top: 12px;
      background: var(--ink); color: var(--on-ink); border: 1px solid var(--accent);
      box-shadow: none; border-radius: var(--radius);
      padding: 6px 10px; font: 600 10px/1 var(--mono); letter-spacing: .14em;
      text-transform: uppercase; pointer-events: none;
    }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 224px minmax(0,1fr); }
    .sidebar {
      background: var(--panel); border-right: 1px solid var(--line-strong); padding: 20px 14px;
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 21px; }
    .brand-mark { width: 28px; height: 28px; border-radius: var(--radius); background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-dark); display: grid; place-items: center; font: 600 13px/1 var(--mono); }
    .brand-name { font: 600 13px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; }
    .event-switcher { margin: 0 4px 18px; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 9px 10px; background: var(--sunk); transition: border-color 110ms, background 110ms; }
    .event-switcher:hover { border-color: var(--accent); background: var(--accent-soft); }
    .event-switcher small { display: block; color: var(--muted); font: 600 9px/1 var(--mono); text-transform: uppercase; letter-spacing: .16em; margin-bottom: 5px; }
    .event-switcher strong { display: block; font: 600 12px/1.2 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-label { color: var(--muted); font-size: 9px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; margin: 14px 10px 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
    .nav { display: grid; gap: 0; }
    .nav a { min-height: 34px; padding: 8px 10px; border-radius: 0 var(--radius) var(--radius) 0; border-left: 2px solid transparent; color: var(--ink-soft); font-size: 12.5px; display: flex; align-items: center; gap: 9px; transition: background 110ms, color 110ms, border-color 110ms; }
    .nav a:hover { background: var(--sunk); color: var(--ink); }
    .nav a.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; border-left-color: var(--accent); }
    .nav-icon { width: 16px; text-align: center; color: var(--muted); font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
    .nav a.active .nav-icon { color: var(--accent); }
    .sidebar-foot { margin-top: auto; display: grid; gap: 2px; padding-top: 16px; border-top: 1px solid var(--line); }
    .sidebar-foot button { border: 0; background: none; text-align: left; color: var(--muted); padding: 7px 10px; border-radius: var(--radius); font: 400 11.5px/1.2 var(--mono); }
    .sidebar-foot button:hover { background: var(--sunk); color: var(--ink); }
    .main { min-width: 0; }
    .topbar { height: 52px; border-bottom: 1px solid var(--line-strong); background: var(--panel); display: flex; align-items: center; gap: 12px; padding: 0 216px 0 26px; position: sticky; top: 0; z-index: 50; }
    .breadcrumbs { color: var(--muted); font: 400 11.5px/1 var(--mono); letter-spacing: .02em; white-space: nowrap; }
    .breadcrumbs strong { color: var(--ink); font-weight: 600; }
    .global-search { margin-left: auto; width: min(330px,38vw); position: relative; }
    .global-search input { width: 100%; height: 30px; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 0 55px 0 31px; background: var(--sunk); color: var(--ink); font: 400 12px/1 var(--mono); outline: none; }
    .global-search input:focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 2px var(--accent-soft); }
    .search-glyph { position: absolute; left: 10px; top: 6px; color: var(--muted); font-size: 13px; }
    .shortcut { position: absolute; right: 7px; top: 6px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 2px; padding: 2px 5px; font: 600 9.5px/1 var(--mono); background: var(--panel); }
    .search-results { position: absolute; right: 0; top: 38px; width: 420px; max-width: 80vw; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: none; padding: 4px; z-index: 80; }
    .search-result { width: 100%; border: 0; background: transparent; text-align: left; padding: 10px; border-radius: var(--radius); display: grid; grid-template-columns: 72px 1fr; gap: 8px; }
    .search-result:hover { background: var(--accent-soft); }
    .result-type { color: var(--accent-dark); font: 600 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; }
    .result-title { font-size: 12px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .top-user { width: 28px; height: 28px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--sunk); color: var(--ink-soft); display: grid; place-items: center; font: 600 10.5px/1 var(--mono); letter-spacing: .06em; flex: 0 0 auto; }
    /* Theme switch: an instrument selector, fixed width so the topbar never
       jumps when the label changes (elements never jump). */
    .theme-switch { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .theme-switch .glyph { color: var(--muted); font-size: 12px; width: 14px; text-align: center; }
    .theme-switch select { width: 124px; height: 30px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--sunk); color: var(--ink); font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 0 6px; outline: none; }
    .theme-switch select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .page { padding: 26px 30px 56px; max-width: 1500px; margin: 0 auto; }
    .page-head { min-height: 66px; display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 20px; }
    .page-head h1 { margin: 0 0 6px; letter-spacing: -.018em; font-size: 22px; line-height: 1.2; font-weight: 600; }
    .page-head p { margin: 0; color: var(--ink-soft); max-width: 680px; font-size: 12.5px; line-height: 1.55; font-variant-numeric: tabular-nums; }
    .head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; min-height: 36px; }
    .button { min-height: 30px; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 7px 12px; background: var(--panel); color: var(--ink-soft); font: 600 11.5px/1 var(--mono); letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; transition: background 110ms, color 110ms, border-color 110ms; }
    .button:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
    .button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
    .button.danger { color: var(--danger); border-color: var(--line-strong); }
    .button.danger:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger-ink); }
    .button.small { min-height: 26px; padding: 5px 9px; font-size: 10.5px; }
    .button.ghost { border-color: transparent; background: transparent; }
    .button:disabled { opacity: .45; cursor: not-allowed; }
    .card { background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: none; }
    .card-head { padding: 12px 16px; border-bottom: 1px solid var(--line-strong); background: var(--sunk); display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; }
    .card-head h2, .card-head h3 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .card-body { padding: 16px; }
    .subtle { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .eyebrow { color: var(--muted); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    .divider { height: 1px; background: var(--line); margin: 16px 0; }
    .grid-2 { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
    .stack { display: grid; gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field label { font: 600 10px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); min-height: 34px; padding: 8px 10px; color: var(--ink); font-size: 12.5px; outline: none; }
    .field textarea { min-height: 90px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .field-note { font-size: 10px; color: var(--muted); min-height: 13px; }
    .field-error { color: var(--danger); font-size: 11px; min-height: 15px; }
    .segment { display: inline-flex; border: 1px solid var(--line-strong); background: var(--sunk); border-radius: var(--radius); padding: 2px; gap: 2px; }
    .segment button { border: 0; background: transparent; border-radius: 2px; padding: 6px 10px; color: var(--muted); font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; min-width: 56px; }
    .segment button.active { background: var(--panel); color: var(--accent-dark); box-shadow: inset 0 0 0 1px var(--accent); }
    .chip { display: inline-flex; align-items: center; gap: 5px; min-height: 20px; padding: 3px 7px; border-radius: 2px; border: 1px solid var(--line-strong); background: var(--sunk); color: var(--ink-soft); font: 400 10px/1.2 var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .chip.accepted, .chip.published, .chip.scheduled { color: var(--success-ink); background: var(--success-soft); border-color: var(--success-line); }
    .chip.review, .chip.in-review { color: var(--warning); background: var(--warning-soft); border-color: var(--warning-line); }
    .chip.rejected, .chip.overdue { color: var(--danger-ink); background: var(--danger-soft); border-color: var(--danger-line); font-weight: 600; }
    .chip.session { color: var(--accent-dark); background: var(--accent-soft); border-color: var(--accent-line); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%,10px); z-index: 1200; background: var(--ink); color: var(--on-ink); border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px 13px; font: 400 11.5px/1.4 var(--mono); box-shadow: none; opacity: 0; pointer-events: none; transition: opacity 110ms, transform 110ms; max-width: min(500px,88vw); }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .modal-backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 500; display: grid; place-items: center; padding: 18px; }
    .modal { width: min(540px,100%); background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: none; overflow: hidden; }
    .modal-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0 0 7px; font-size: 16px; font-weight: 600; letter-spacing: -.015em; }
    .modal-head p { margin: 0; color: var(--ink-soft); font-size: 12px; line-height: 1.55; }
    .modal-body { padding: 14px 20px 18px; }
    .modal-actions { padding: 12px 20px; border-top: 1px solid var(--line-strong); background: var(--sunk); display: flex; justify-content: flex-end; gap: 8px; }

    /* v1.2 completion surfaces */
    .route-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
    .route-tabs .button.active { color:var(--accent-dark); border-color:var(--accent); background:var(--accent-soft); }
    .empty-state { min-height:420px; display:grid; place-items:center; text-align:center; padding:48px 24px; }
    .empty-state > div { max-width:520px; }
    .empty-mark { width:52px; height:52px; border-radius:var(--radius); margin:0 auto 18px; display:grid; place-items:center; background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent-dark); font-size:22px; }
    .empty-state h2 { margin:0 0 9px; font-size:18px; font-weight:600; }
    .empty-state p { margin:0 auto 20px; color:var(--muted); font-size:12.5px; line-height:1.6; }
    .empty-preview { position:fixed; z-index:999; right:12px; bottom:12px; font:600 9px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); background:var(--panel); border:1px solid var(--line-strong); border-radius:var(--radius); padding:5px 9px; }

    /* ── v1.11 · cold start ─────────────────────────────────────────────── */
    .term { background:var(--canvas); border:1px solid var(--canvas-line); border-radius:var(--radius); padding:16px 18px; font:11px/1.7 var(--mono); color:#cfe4e6; overflow-x:auto; }
    .term-line { display:grid; grid-template-columns:52px 1fr; gap:10px; margin-bottom:7px; }
    .term-who { color:#7fb3b8; font-weight:600; text-align:right; white-space:nowrap; }
    .term-line.op .term-who { color:#e8d48b; }
    .term-body { white-space:pre-wrap; word-break:break-word; }
    .term-ok { color:#8fd0a0; }
    .term-note { color:#8b9aa3; }
    .term-claim { display:block; margin-top:4px; padding:8px 10px; border:1px dashed #3a4d59; border-radius:2px; color:#cfe4e6; background:rgba(255,255,255,.04); word-break:break-all; }
    .setup-doors { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .door-card { display:flex; flex-direction:column; gap:6px; text-align:left; padding:14px; min-height:118px; border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--panel); cursor:pointer; transition:border-color 110ms, background 110ms; }
    .door-card:hover { border-color:var(--accent); background:var(--accent-soft); }
    .door-card.primary-door { border-color:var(--accent); }
    .door-card strong { font-size:12px; }
    .door-card span { font-size:11px; color:var(--muted); line-height:1.5; }
    .door-card .door-go { margin-top:auto; font:600 9px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--accent-dark); }
    .instance-rows { display:flex; flex-direction:column; }
    .inst-row { display:grid; grid-template-columns:150px 112px 1fr auto; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); min-height:40px; }
    .inst-row:last-child { border-bottom:0; }
    .inst-row .inst-name { font-weight:600; font-size:11px; }
    .chip.inst-ok { color:var(--ok, #1e7a46); border-color:var(--line-strong); width:104px; justify-content:center; }
    .chip.inst-off { color:var(--danger, #a3341f); border-color:var(--danger, #a3341f); width:104px; justify-content:center; }
    .inst-note { font-size:10.5px; color:var(--muted); line-height:1.5; }
    .switcher-alt { display:grid; grid-template-columns:1fr auto; gap:6px; align-items:center; margin:-12px 4px 18px; padding:6px 8px; border:1px solid var(--line); border-radius:var(--radius); background:var(--sunk); font-size:10.5px; color:var(--ink-soft); cursor:pointer; text-align:left; min-height:32px; }
    .switcher-alt:hover { border-color:var(--accent); }
    .switcher-alt.removed { color:var(--muted); cursor:default; border-style:dashed; }
    .switcher-alt.removed:hover { border-color:var(--line); }
    .switcher-alt .demo-chip { font:600 8px/1 var(--mono); letter-spacing:.12em; padding:3px 5px; border:1px solid var(--line-strong); border-radius:2px; color:var(--accent-dark); background:var(--panel); }
    .peek-bar { position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:12px; padding:8px 26px; background:var(--canvas); color:#cfe4e6; font:600 10px/1.4 var(--mono); letter-spacing:.06em; }
    .peek-bar .button { background:transparent; color:#cfe4e6; border-color:#3a4d59; }
    .peek-bar .button:hover { border-color:#7fb3b8; }
    .peek-bar-spacer { margin-left:auto; }
    .claim-note { border:1px solid var(--line-strong); border-left:3px solid var(--accent); border-radius:var(--radius); background:var(--sunk); padding:10px 12px; font-size:11px; color:var(--ink-soft); line-height:1.6; }
    .token-line { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
    .org-row { display:grid; grid-template-columns:1fr 210px 92px 84px; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); min-height:44px; }
    .org-row:last-child { border-bottom:0; }
    .org-row .org-name { font-weight:600; font-size:11.5px; }
    .org-row .org-note { display:block; font-weight:400; font-size:10px; color:var(--muted); }
    .org-row .org-email { font:400 10.5px/1.4 var(--mono); color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .org-row .chip { width:84px; justify-content:center; }
    @media (max-width:1100px) { .setup-doors { grid-template-columns:1fr; } .org-row { grid-template-columns:1fr 92px 84px; } .org-row .org-email { display:none; } .inst-row { grid-template-columns:118px 112px 1fr; } .inst-row .inst-fix { grid-column:3; justify-self:end; } }
    .empty-preview:hover { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
    .detail-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr); gap:14px; align-items:start; }
    .definition-list { display:grid; grid-template-columns:150px 1fr; gap:0; }
    .definition-list dt, .definition-list dd { margin:0; padding:10px 0; border-bottom:1px solid var(--line); font-size:11px; }
    .definition-list dt { color:var(--muted); font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; }
    .definition-list dd { font-weight:600; }
    .history-row { position:relative; padding:0 0 18px 22px; font-size:11px; line-height:1.5; }
    .history-row::before { content:""; position:absolute; left:5px; top:4px; bottom:-4px; width:1px; background:var(--line-strong); }
    .history-row::after { content:""; position:absolute; left:2px; top:4px; width:7px; height:7px; border-radius:0; background:var(--accent); }
    .history-row:last-child::before { display:none; }
    .settings-row { display:grid; grid-template-columns:18px minmax(0,1fr) minmax(80px,.45fr) auto; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--line); }
    .settings-row:last-child { border-bottom:0; }
    .settings-row input, .settings-row select { width:100%; min-width:0; height:30px; border:1px solid var(--line-strong); border-radius:var(--radius); padding:0 8px; background:var(--panel); font-size:12px; }
    .settings-row.dragging { opacity:.45; }
    .drag-button { border:0; background:transparent; color:var(--muted); padding:0; cursor:grab; }
    .search-dialog { width:min(720px,100%); align-self:start; margin-top:min(14vh,120px); }
    .search-dialog .search-input { width:100%; height:50px; border:0; border-bottom:1px solid var(--line-strong); padding:0 20px; font:400 14px/1 var(--mono); outline:none; }
    .search-dialog-results { max-height:460px; overflow:auto; padding:6px; }
    .search-dialog .search-result { grid-template-columns:92px 1fr auto; align-items:center; min-height:48px; }
    .search-dialog .search-result kbd { color:var(--muted); font:400 9px/1 var(--mono); }
    .comms-layout { display:grid; grid-template-columns:minmax(230px,.65fr) minmax(360px,1fr); gap:14px; align-items:start; }
    .list-button { width:100%; border:0; border-bottom:1px solid var(--line); background:var(--panel); text-align:left; padding:12px 16px; display:flex; justify-content:space-between; gap:10px; }
    .list-button:hover { background:var(--sunk); }
    .list-button.active { background:var(--accent-soft); color:var(--accent-dark); box-shadow:inset 2px 0 0 var(--accent); }
    .list-button:last-child { border-bottom:0; }
    .toggle-line { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
    .toggle-line:last-child { border-bottom:0; }
    .switch { width:38px; height:20px; border:1px solid var(--line-strong); border-radius:2px; background:var(--sunk); padding:2px; }
    .switch::after { content:""; display:block; width:14px; height:14px; border-radius:1px; background:var(--muted); transition:transform 110ms, background 110ms; }
    .switch.on { background:var(--accent-soft); border-color:var(--accent); }
    .switch.on::after { transform:translateX(18px); background:var(--accent); }
    .import-steps { display:grid; grid-template-columns:repeat(5,1fr); margin-bottom:16px; overflow:hidden; border:1px solid var(--line-strong); border-radius:var(--radius); }
    .import-step { padding:10px; background:var(--sunk); color:var(--muted); border-right:1px solid var(--line); font:600 9.5px/1.3 var(--mono); letter-spacing:.06em; text-transform:uppercase; text-align:center; }
    .import-step:last-child { border-right:0; }
    .import-step.active { background:var(--accent-soft); color:var(--accent-dark); }
    .code-block { background:var(--canvas); color:var(--canvas-code-ink); border:1px solid var(--canvas-line); border-radius:var(--radius); padding:14px; overflow:auto; font:11px/1.65 var(--mono); white-space:pre; }
    .live-log { background:var(--canvas); color:var(--canvas-log-ink); border:1px solid var(--canvas-line); border-radius:var(--radius); padding:12px; min-height:150px; font:10px/1.75 var(--mono); }
    .live-log strong { color:var(--canvas-accent); font-weight:600; }
    .agenda-list-head, .agenda-list-row { display:grid; grid-template-columns:110px 72px minmax(220px,1fr) minmax(150px,.7fr) 130px 150px 90px; gap:10px; align-items:center; padding:0 14px; }
    .agenda-list-head { min-height:36px; position:sticky; top:0; z-index:2; background:var(--sunk); border-bottom:1px solid var(--line-strong); color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.12em; font-weight:600; }
    .agenda-list-head button { border:0; background:transparent; color:inherit; text-align:left; padding:0; font:inherit; text-transform:inherit; letter-spacing:inherit; }
    .agenda-list-row { min-height:56px; border-bottom:1px solid var(--line); font-size:10.5px; }
    .agenda-list-row > * { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .week-grid { min-width:900px; display:grid; grid-template-columns:68px repeat(3,minmax(260px,1fr)); }
    .week-cell { min-height:100px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; }
    .week-cell.time { background:var(--sunk); color:var(--muted); text-align:right; font:400 9px/1.3 var(--mono); padding-right:10px; }
    .week-cell.head { min-height:40px; position:sticky; top:0; z-index:2; background:var(--sunk); font:600 10px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase; }
    .week-session { border-left:3px solid var(--track-color,var(--accent)); border-radius:2px; background:var(--sunk); border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:7px; margin-bottom:5px; font-size:9px; }
    .week-session strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .session-tile .tile-actions, .track-tile .tile-actions { display:flex; gap:3px; margin-top:4px; }
    .tile-actions button { width:19px; height:18px; border:1px solid var(--line-strong); border-radius:2px; background:var(--panel); font-size:9px; padding:0; }
    .tile-actions button:hover { background:var(--accent-soft); border-color:var(--accent); }
    .break-tile { border-left-color:var(--muted) !important; background:repeating-linear-gradient(135deg,var(--sunk),var(--sunk) 6px,var(--break-stripe) 6px,var(--break-stripe) 12px) !important; }
    .api-route { display:grid; grid-template-columns:62px 210px 1fr; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font:400 11px/1.4 var(--mono); }
    .method { font-weight:700; color:var(--accent-dark); letter-spacing:.08em; }
    .outcome-table { width:100%; min-width:620px; }
    .outcome-table td { height:42px; }
    .track-picker { display:flex; flex-wrap:wrap; gap:6px; padding:10px; border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--panel); outline:none; }
    .track-picker:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
    .track-picker button { border:1px solid var(--line-strong); background:var(--sunk); border-radius:2px; padding:5px 9px; color:var(--muted); font:400 10px/1.2 var(--mono); }
    .track-picker button.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark); font-weight:600; }
    .track-picker button small { margin-left:5px; font-size:8px; text-transform:uppercase; letter-spacing:.08em; }

    /* Landing */
    .landing { min-height: 100vh; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; }
    .landing-nav { padding: 20px clamp(20px,5vw,70px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: var(--panel); }
    .landing-nav .brand { padding: 0; }
    .landing-links { display: flex; gap: 8px; }
    .hero { width: min(1180px,90vw); margin: auto; display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(35px,8vw,100px); align-items: center; padding: 55px 0 70px; }
    .hero-copy .eyebrow { color: var(--accent-dark); margin-bottom: 15px; }
    .hero h1 { font: 500 clamp(38px,5.2vw,62px)/1.02 var(--mono); letter-spacing: -.055em; margin: 0 0 22px; max-width: 720px; }
    .hero p { color: var(--ink-soft); font-size: 16px; line-height: 1.65; max-width: 600px; margin: 0 0 28px; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .hero-actions .button { min-height: 40px; padding: 10px 16px; }
    .hero-note { margin-top: 15px; color: var(--muted); font-size: 11px; }
    .hero-pipeline { background: var(--panel); border: 1px solid var(--line-strong); border-top: 3px solid var(--accent); border-radius: var(--radius); box-shadow: none; padding: 20px;
      background-image: linear-gradient(var(--graph) 1px, transparent 1px), linear-gradient(90deg, var(--graph) 1px, transparent 1px); background-size: 8px 8px, 8px 8px; }
    .mini-pipeline { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 17px 0; }
    .mini-stage { border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 12px; min-height: 72px; background: var(--veil-strong); }
    .mini-stage strong { display: block; font-size: 21px; margin-top: 9px; font-variant-numeric: tabular-nums; }
    .mini-attention { padding: 12px; background: var(--warning-soft); border: 1px solid var(--warning-line); color: var(--warning-ink); border-radius: var(--radius); font-size: 11px; line-height: 1.5; }
    .landing-foot { border-top: 1px solid var(--line); padding: 18px clamp(20px,5vw,70px); color: var(--muted); font: 400 11px/1 var(--mono); display: flex; justify-content: space-between; }

    /* Pipeline dashboard — the instrument strip */
    .pipeline-card { overflow: hidden;
      background-image: linear-gradient(var(--graph) 1px, transparent 1px), linear-gradient(90deg, var(--graph) 1px, transparent 1px); background-size: 8px 8px, 8px 8px; }
    .pipeline { display: grid; grid-template-columns: repeat(7,minmax(120px,1fr)); overflow-x: auto; border-top: 3px solid transparent; border-image: var(--spectrum) 1; }
    .pipeline-stage { position: relative; min-width: 130px; border: 0; border-right: 1px solid var(--line); background: var(--veil); text-align: left; padding: 18px 16px 16px; min-height: 120px; display: grid; align-content: start; transition: background 110ms; }
    .pipeline-stage:last-child { border-right: 0; }
    .pipeline-stage:hover { background: var(--accent-soft); }
    .pipeline-stage::after { display: none; }
    .pipeline-stage:last-child::after { display: none; }
    .pipeline-name { color: var(--muted); font: 600 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
    .pipeline-count { display: block; font: 400 30px/1 var(--mono); letter-spacing: -.05em; margin: 9px 0 8px; }
    .pipeline-delta { color: var(--accent-dark); font: 400 10.5px/1.4 var(--mono); }
    .pipeline-meaning { display:block; min-height:22px; margin-top:7px; color:var(--muted); font-size:9.5px; line-height:1.4; }
    .pipeline-stage.at-zero { background: var(--veil-dim); }
    .pipeline-stage.at-zero:hover { background: var(--veil-dim); }
    .pipeline-stage.at-zero .pipeline-count { color: var(--line-strong); }

    /* Fresh-install walk --------------------------------------------------- */
    .page.narrow { max-width: 720px; }
    .event-switcher-row { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: stretch; margin: 0 4px 18px; }
    .event-switcher-row .event-switcher { margin: 0; }
    .event-add { display: grid; place-items: center; width: 30px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--sunk); color: var(--muted); font: 400 15px/1 var(--mono); transition: border-color 110ms, background 110ms, color 110ms; }
    .event-add:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); }
    .setup-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .choice-card { display: grid; align-content: start; gap: 5px; text-align: left; padding: 13px 14px; min-height: 78px; border: 1px solid var(--line-strong); border-left: 3px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); transition: border-color 110ms, background 110ms; }
    .choice-card:hover { border-color: var(--accent); }
    .choice-card.active { border-color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }
    .choice-card strong { font: 600 12px/1.2 var(--mono); }
    .choice-card span { color: var(--muted); font-size: 11.5px; line-height: 1.5; }
    .setup-actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .setup-actions .subtle { margin-right: auto; font-size: 11.5px; }
    .setup-card { margin-bottom: 14px; }
    .setup-card .setup-progress { color: var(--muted); font: 600 10px/1 var(--mono); letter-spacing: .1em; }
    .setup-steps { display: grid; gap: 0; padding-top: 2px; padding-bottom: 2px; }
    /* Fixed row height and an always-present action slot: ticking a step must
       never move the steps beneath it. */
    .setup-step { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 12px; min-height: 54px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .setup-step:last-child { border-bottom: 0; }
    .setup-mark { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--muted); font: 600 10px/1 var(--mono); }
    .setup-step.done .setup-mark { border-color: var(--success); background: var(--success-soft); color: var(--success); }
    .setup-step.next .setup-mark { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); }
    .setup-copy { display: grid; gap: 3px; }
    .setup-copy strong { font: 600 12px/1.2 var(--mono); }
    .setup-step.done .setup-copy strong { color: var(--muted); }
    .setup-copy span { color: var(--muted); font-size: 11.5px; line-height: 1.4; }
    .setup-step.later { opacity: .62; }

    .attention-strip { margin: 14px 0; display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .attention-item { border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--radius); text-align: left; padding: 11px 13px 11px 12px; min-height: 60px; border-left: 3px solid var(--warning); transition: background 110ms, border-color 110ms; }
    .attention-item:hover { background: var(--accent-soft); border-color: var(--accent); border-left-color: var(--accent); }
    .attention-item strong { display: block; font: 600 13px/1.2 var(--mono); letter-spacing: -.02em; margin-bottom: 5px; }
    .attention-item span { color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
    .dashboard-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 14px; align-items: start; }
    .wave-list { display: grid; }
    .wave-row { display: grid; grid-template-columns: 1fr 80px 62px; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding: 12px 0; }
    .wave-row:last-child { border-bottom: 0; }
    .wave-date { color: var(--muted); font-size: 10.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .wave-bar { height: 8px; background: var(--sunk); border: 1px solid var(--line-strong); border-radius: 0; overflow: hidden; position: relative; }
    .wave-bar::after { content:""; position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(90deg, var(--wave-tick) 1px, transparent 1px); background-size:10% 100%; }
    .wave-bar i { display: block; height: 100%; background: var(--accent); border-radius: 0; }

    /* Program board + scheduled-session legibility */
    .slot-meta { display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:6px; }
    .slot-chip { display:inline-flex; align-items:center; max-width:100%; border:1px solid var(--success-line); border-radius:2px; background:var(--success-soft); color:var(--success-ink); padding:3px 6px; font:600 8px/1.25 var(--mono); letter-spacing:.04em; white-space:normal; }
    .slot-meta.compact { gap:3px; margin-top:4px; }
    .slot-meta.compact .slot-chip { padding:2px 5px; font-size:7px; }
    .not-public { display:inline-flex; align-items:center; border-radius:2px; background:var(--warning-soft); border:1px solid var(--warning-line); color:var(--warning-ink); padding:2px 6px; font:600 8px/1.3 var(--mono); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
    .publish-link { border:0; border-bottom:1px solid currentColor; background:transparent; color:var(--accent-dark); padding:2px 1px; font:600 8px/1 var(--mono); letter-spacing:.04em; cursor:pointer; }
    .track-chip-row { display:flex; gap:4px; flex-wrap:wrap; min-width:0; }
    .program-board-shell { overflow-x:auto; padding-bottom:10px; }
    .program-board { display:grid; grid-template-columns:repeat(7,minmax(248px,1fr)); gap:8px; min-width:1800px; align-items:start; }
    .board-column { min-height:620px; border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--sunk); overflow:hidden; }
    .board-column-head { position:sticky; top:0; z-index:3; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; min-height:67px; padding:11px 12px; border-bottom:1px solid var(--line-strong); background:var(--panel); }
    .board-column-head strong { display:block; font:600 10.5px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; }
    .board-column-head small { display:block; margin-top:5px; color:var(--muted); font-size:8.5px; line-height:1.35; }
    .board-derived-note { margin:8px; padding:8px; border:1px dashed var(--warning-edge); border-radius:2px; background:var(--warning-soft); color:var(--warning-ink); font-size:8.5px; line-height:1.45; }
    .board-card-list { height:calc(100vh - 275px); min-height:520px; overflow-y:auto; padding:8px; }
    .board-card { content-visibility:auto; contain:layout paint style; contain-intrinsic-size:148px; border:1px solid var(--line-strong); border-left:3px solid var(--track-color,var(--accent)); border-radius:2px; background:var(--panel); padding:9px; margin-bottom:6px; box-shadow:none; cursor:pointer; transition:border-color 110ms, background 110ms; }
    .board-card:hover, .board-card:focus { border-color:var(--accent); background:var(--accent-soft); outline:none; }
    .board-card h3 { margin:7px 0 5px; font-size:10px; line-height:1.35; font-weight:600; }
    .board-card p { margin:0; color:var(--muted); font-size:8.5px; line-height:1.4; white-space:normal; }
    .board-card-foot { display:flex; justify-content:space-between; gap:7px; align-items:center; margin-top:8px; color:var(--muted); font:400 8.5px/1 var(--mono); }
    .board-count { flex:0 0 auto; display:grid; place-items:center; min-width:24px; height:22px; padding:0 6px; border-radius:2px; background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent-dark); font-size:10px; font-weight:600; }
    .board-filter-summary { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:10.5px; font-variant-numeric:tabular-nums; }
    .record-action-card { border-left:3px solid var(--accent); }
    .record-action-buttons { display:flex; gap:7px; flex-wrap:wrap; }
    .metric-grid { display: grid; grid-template-columns: repeat(2,1fr); border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
    .metric-box { padding: 13px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 84px; background: var(--panel); transition: background 110ms; }
    .metric-box:hover { background: var(--accent-soft); }
    .metric-box:nth-child(2n) { border-right: 0; }
    .metric-box:nth-last-child(-n+2) { border-bottom: 0; }
    .metric { font-size: 25px; letter-spacing: -.045em; font-weight: 400; margin: 7px 0 2px; }
    .spark { height: 34px; display: flex; align-items: end; gap: 2px; margin-top: 8px; }
    .spark i { flex: 1; background: var(--accent-soft); border-top: 1px solid var(--accent); border-radius: 0; }

    /* Tables */
    .table-card { overflow: hidden; }
    .toolbar { padding: 11px 14px; border-bottom: 1px solid var(--line-strong); background: var(--sunk); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 56px; }
    .toolbar input, .toolbar select { height: 30px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); padding: 0 9px; font: 400 11.5px/1 var(--mono); outline: none; }
    .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .toolbar input { min-width: 210px; }
    .toolbar-spacer { flex: 1; }
    .selection-bar { padding: 10px 14px; min-height: 46px; background: var(--accent-soft); border-bottom: 1px solid var(--accent); display: flex; align-items: center; gap: 10px; color: var(--accent-dark); font-size: 11px; }
    .selection-bar strong { min-width: 92px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .table-wrap { overflow: auto; min-height: 460px; }
    table { width: 100%; min-width: 900px; border-collapse: collapse; table-layout: fixed; }
    th { height: 34px; position: sticky; top: 0; z-index: 2; background: var(--sunk); border-bottom: 1px solid var(--line-strong); color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; text-align: left; padding: 0 10px; }
    td { height: 46px; border-bottom: 1px solid var(--line); padding: 7px 10px; font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    tbody tr:hover { background: var(--sunk); }
    .submission-row { cursor: pointer; }
    .submission-row:focus-within { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
    .check-col { width: 38px; text-align: center; }
    .type-col { width: 82px; }
    .title-col { width: 31%; }
    .speaker-col { width: 18%; }
    .status-col { width: 104px; }
    .track-col { width: 16%; }
    .score-col { width: 65px; text-align: right; }
    .saved-view-bar { padding: 9px 14px; border-bottom: 1px solid var(--line); display:flex; align-items:center; gap:6px; flex-wrap:wrap; background:var(--panel); }
    .saved-view-bar .view-label { color:var(--muted); font-size:9px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; margin-right:2px; }
    .saved-view { height:26px; border:1px solid var(--line-strong); border-radius:2px; padding:0 10px; background:var(--panel); color:var(--muted); font:400 10px/1 var(--mono); }
    .saved-view:hover { border-color:var(--accent); color:var(--accent-dark); }
    .saved-view.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark); font-weight:600; }
    .view-meta { color:var(--muted); font-size:9.5px; font-variant-numeric:tabular-nums; }
    .draft-warning { color:var(--warning); font:600 9.5px/1 var(--mono); }
    .table-title { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
    .pagination { min-height: 46px; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line-strong); background: var(--sunk); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .page-buttons { display: flex; gap: 5px; }

    /* Form builder */
    .builder { display: grid; grid-template-columns: 280px minmax(340px,1fr) minmax(300px,.78fr); gap: 12px; align-items: start; }
    .builder-steps { padding: 8px; }
    .builder-step { width: 100%; border: 0; border-left: 2px solid transparent; background: transparent; border-radius: 0 var(--radius) var(--radius) 0; padding: 10px; text-align: left; display: flex; gap: 10px; color: var(--muted); font-size: 11.5px; }
    .builder-step:hover { background: var(--sunk); }
    .builder-step.active { color: var(--accent-dark); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
    .step-number { width: 20px; height: 20px; border-radius: 2px; border: 1px solid var(--line-strong); background: var(--panel); display: grid; place-items: center; font: 600 9px/1 var(--mono); flex: 0 0 auto; }
    .active .step-number { background: var(--accent); border-color: var(--accent); color: white; }
    .form-fields { padding: 12px; display: grid; gap: 8px; }
    .form-field-row { border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 12px; display: grid; grid-template-columns: 18px 1fr auto; gap: 9px; align-items: center; background: var(--panel); }
    .form-field-row.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .drag-handle { color: var(--muted); letter-spacing: -3px; }
    .field-kind { color: var(--muted); font: 400 9px/1.3 var(--mono); margin-top: 3px; letter-spacing: .06em; text-transform: uppercase; }
    .field-controls { display: flex; gap: 3px; }
    .field-controls button { width: 24px; height: 24px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: 2px; color: var(--muted); }
    .field-controls button:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
    .add-field { border: 1px dashed var(--line-strong); background: var(--sunk); border-radius: var(--radius); padding: 12px; color: var(--accent-dark); font: 600 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .add-field:hover { border-color: var(--accent); background: var(--accent-soft); }
    .preview-card { position: sticky; top: 70px; }
    .preview-window { margin: 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--sunk); }
    .preview-top { height: 34px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; gap: 5px; padding: 0 10px; }
    .preview-top i { width: 6px; height: 6px; border-radius: 1px; background: var(--line-strong); }
    .preview-form { padding: 22px 18px; }
    .preview-form h3 { margin: 0 0 5px; font-size: 14px; font-weight: 600; }
    .preview-form p { margin: 0 0 17px; color: var(--muted); font-size: 10px; }
    .preview-input { height: 30px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--panel); margin-top: 6px; }
    .form-catalog { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
    .form-catalog-card { border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--panel); padding:13px; text-align:left; cursor:pointer; transition:border-color 110ms, background 110ms; }
    .form-catalog-card:hover { border-color:var(--accent); background:var(--sunk); }
    .form-catalog-card.active { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
    .form-catalog-card strong { display:block; margin:8px 0 5px; font-size:11px; font-weight:600; }
    .form-catalog-card small { color:var(--muted); font-size:9.5px; line-height:1.45; }
    .prototype-state-switch { display:flex; gap:5px; flex-wrap:wrap; margin:0 0 18px; padding:8px; border:1px dashed var(--line-strong); border-radius:var(--radius); background:var(--sunk); }
    .prototype-state-switch span { align-self:center; color:var(--muted); font:600 9px/1 var(--mono); text-transform:uppercase; letter-spacing:.12em; margin-right:4px; }

    /* Public form + portal */
    .public-shell { min-height: 100vh; background: var(--bg); }
    .public-top { height: 60px; background: var(--panel); border-bottom: 1px solid var(--line-strong); display: flex; align-items: center; justify-content: space-between; padding: 0 216px 0 clamp(18px,5vw,70px); }
    .public-event { display: flex; align-items: center; gap: 10px; font: 600 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .public-event .brand-mark { width: 24px; height: 24px; font-size: 11px; }
    .public-body { width: min(750px,calc(100% - 32px)); margin: 0 auto; padding: 44px 0 80px; }
    .public-body.wide { width: min(1160px,calc(100% - 32px)); }
    .public-card { background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: none; padding: clamp(20px,4vw,36px); }
    .public-card h1 { font-size: 26px; letter-spacing: -.03em; margin: 0 0 10px; font-weight: 600; }
    .public-card > p { color: var(--ink-soft); line-height: 1.6; font-size: 13px; }
    .cfp-progress { display: flex; gap: 4px; margin: 26px 0 28px; }
    .cfp-progress i { height: 3px; border-radius: 0; flex: 1; background: var(--line-strong); }
    .cfp-progress i.active { background: var(--accent); }
    .cfp-form { display: grid; gap: 16px; }
    .save-status { min-height: 18px; color: var(--muted); font: 400 10px/1.4 var(--mono); }
    .portal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .portal-head h1 { margin: 0 0 7px; font-size: 23px; font-weight: 600; letter-spacing: -.02em; }
    .portal-progress { width: 190px; }
    .progress-track { height: 8px; background: var(--sunk); border: 1px solid var(--line-strong); border-radius: 0; overflow: hidden; margin-top: 7px; }
    .progress-track i { display: block; height: 100%; background: var(--success); transition: width 110ms; }
    .status-hero { background: var(--canvas); color: var(--canvas-ink); border: 1px solid var(--canvas-line); border-radius: var(--radius); padding: 20px; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; margin-bottom: 14px; }
    .status-hero .eyebrow { color: var(--canvas-eyebrow); }
    .status-hero h2 { margin: 7px 0 5px; font-size: 17px; font-weight: 600; }
    .status-hero p { margin: 0; color: var(--canvas-ink-soft); font-size: 11.5px; }
    /* Dark-hero overrides: light-mode text tokens land on the dark status hero
       (measured 1.9-2.9:1). Inherited from v1.4; fixed here. */
    .status-hero .field-note, .status-hero .subtle, .status-hero .save-status { color: var(--canvas-ink-soft); }
    .status-hero .publish-link { color: var(--canvas-link); }
    .status-hero .chip { background: var(--canvas-chip-bg); border-color: var(--canvas-chip-line); color: var(--canvas-chip-ink); }
    .status-hero .slot-chip { background: var(--canvas-ok-bg); border-color: var(--canvas-ok-line); color: var(--canvas-ok-ink); }
    .status-hero .not-public { background: var(--canvas-warn-bg); border-color: var(--canvas-warn-line); color: var(--canvas-warn-ink); }
    .portal-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; }
    .task-row { min-height: 64px; padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; }
    .task-row:last-child { border-bottom: 0; }
    .task-toggle { width: 24px; height: 24px; border-radius: 2px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--on-accent); }
    .task-row.done .task-toggle { background: var(--success); border-color: var(--success); }
    .task-row.done .task-title { text-decoration: line-through; color: var(--muted); }
    /* Cancelled is a third outcome, not a variant of done: the work stopped
       mattering, nobody did it, and completed work is never restyled by it. */
    .task-row.cancelled .task-toggle { background: var(--sunk); border-style: dashed; color: var(--muted); }
    .task-row.cancelled .task-title { color: var(--muted); }
    .cancelled-block { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line-strong); }
    .cancelled-block > .eyebrow { display: block; margin-bottom: 3px; }
    .cancelled-reason { color: var(--muted); font-size: 10.5px; line-height: 1.5; margin: 0 0 4px; }
    .task-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .task-meta { color: var(--muted); font-size: 10.5px; }
    .profile-block { text-align: center; padding: 8px 0 14px; }
    .avatar { width: 60px; height: 60px; border-radius: var(--radius); margin: 0 auto 10px; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-dark); display: grid; place-items: center; font: 600 18px/1 var(--mono); }

    /* Evaluation */
    .round-flow { display: grid; grid-template-columns: 1fr 50px 1fr; align-items: center; gap: 10px; }
    .round-card { border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 16px; background: var(--panel); }
    .round-card strong { display: block; margin: 5px 0 12px; font-size: 13px; font-weight: 600; }
    .round-arrow { text-align: center; color: var(--accent); font-family: var(--mono); font-size: 22px; }
    .committee-list { display: grid; gap: 10px; }
    .committee-person { display: grid; grid-template-columns: 28px 1fr 70px; gap: 9px; align-items: center; }
    .mini-avatar { width: 26px; height: 26px; border-radius: 2px; border: 1px solid var(--line-strong); background: var(--sunk); display: grid; place-items: center; font: 600 9px/1 var(--mono); }
    .review-layout { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(310px,.6fr); gap: 16px; }
    .review-copy { font-size: 13px; line-height: 1.65; color: var(--ink-soft); }
    .review-copy h2 { color: var(--ink); font-size: 19px; letter-spacing: -.02em; font-weight: 600; }
    .review-submission-card { cursor: pointer; transition: border-color 110ms, background 110ms; }
    .review-submission-card:hover { border-color: var(--accent); background: var(--sunk); }
    .review-submission-card:focus-visible { outline: 2px solid var(--accent); border-color: var(--accent); }
    .review-open-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .review-detail-modal { width: min(900px,100%); max-height: calc(100vh - 36px); display: flex; flex-direction: column; }
    .review-detail-modal .modal-head { border-bottom: 1px solid var(--line-strong); }
    .review-detail-scroll { overflow-y: auto; padding-top: 16px; }
    .review-detail-section + .review-detail-section { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
    .review-detail-section h3 { margin: 0 0 10px; font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .review-detail-section p, .review-detail-section li { color: var(--ink-soft); font-size: 12px; line-height: 1.65; }
    .review-detail-section p { margin: 0 0 10px; }
    .review-field-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .review-field { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sunk); }
    .review-field dt { color: var(--muted); font-size: 9px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    .review-field dd { margin: 5px 0 0; color: var(--ink); font-size: 11px; line-height: 1.5; }
    .blind-redaction { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-style: italic; }
    .blind-redaction::before { content: ""; width: 18px; height: 7px; border-radius: 0; background: repeating-linear-gradient(135deg,var(--line-strong) 0 3px,var(--sunk) 3px 6px); }
    .review-file-list { display: grid; gap: 8px; }
    .review-file-row { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); }
    .review-file-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 2px; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-dark); font: 600 9px/1 var(--mono); }
    .review-score { position: sticky; top: 70px; }
    .score-buttons { display: grid; grid-template-columns: repeat(5,1fr); gap: 5px; margin: 14px 0; }
    .score-button { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 2px; min-height: 44px; font: 400 16px/1 var(--mono); color: var(--ink-soft); }
    .score-button:hover, .score-button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
    .decision-buttons { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin:10px 0 16px; }
    .decision-button { min-height:40px; border:1px solid var(--line-strong); border-radius:2px; background:var(--panel); color:var(--ink-soft); font:600 10px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; }
    .decision-button:hover { border-color:var(--accent); color:var(--accent-dark); }
    .decision-button.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-dark); box-shadow:inset 0 0 0 1px var(--accent); }
    .scope-row { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }

    /* Agenda */
    .agenda-layout { display: grid; grid-template-columns: 250px minmax(0,1fr); gap: 12px; }
    .unscheduled { max-height: 700px; overflow: auto; padding: 10px; }
    .unscheduled-item { border: 1px solid var(--line-strong); background: var(--panel); border-left: 3px solid var(--track-color,var(--accent)); border-radius: 2px; padding: 9px; margin-bottom: 6px; cursor: grab; }
    .unscheduled-item:hover { background: var(--sunk); }
    .unscheduled-item:active { cursor: grabbing; }
    .unscheduled-item strong { display: block; font-size: 10px; line-height: 1.35; margin-bottom: 5px; font-weight: 600; }
    .unscheduled-item span { color: var(--muted); font: 400 9px/1.3 var(--mono); }
    .agenda-board { overflow: auto; min-height: 620px; }
    .agenda-grid { min-width: 760px; display: grid; grid-template-columns: 68px repeat(4,minmax(160px,1fr)); position: relative; }
    .agenda-cell { min-height: 87px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; }
    .agenda-cell.time { color: var(--muted); font: 400 9px/1.3 var(--mono); text-align: right; padding-right: 10px; background: var(--sunk); }
    .agenda-cell.head { min-height: 40px; position: sticky; top: 0; z-index: 2; background: var(--sunk); font: 600 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; }
    .agenda-cell.drop-target.drag-over { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
    .session-tile { border-left: 3px solid var(--track-color,var(--accent)); background: var(--panel); border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 2px; padding: 8px; box-shadow: none; height: 100%; position: relative; overflow: hidden; }
    .session-tile strong { display: block; font-size: 9px; line-height: 1.3; margin-bottom: 5px; font-weight: 600; }
    .session-tile span { color: var(--muted); font: 400 8px/1.3 var(--mono); }
    .session-tile.conflict { background: var(--danger-soft); box-shadow: inset 0 0 0 1px var(--danger); }
    .conflict-flag { color: var(--danger) !important; font-weight: 600; display: block; margin-top: 5px; }
    .swimlanes { display: grid; grid-template-columns: repeat(8,minmax(170px,1fr)); min-width: 1180px; }
    .swimlane { border-right: 1px solid var(--line); min-height: 580px; background: var(--sunk); }
    .swimlane-head { position: sticky; top: 0; z-index: 2; background: var(--panel); border-top: 4px solid var(--track-color); border-bottom: 1px solid var(--line-strong); padding: 10px; font: 600 10px/1.3 var(--mono); letter-spacing: .06em; min-height: 49px; }
    .swimlane-body { padding: 8px; display: grid; gap: 7px; align-content: start; }
    .swimlane-session { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 2px; padding: 9px; }
    .swimlane-session:hover { border-color: var(--accent); }
    .swimlane-session time { color: var(--muted); font: 400 8px/1 var(--mono); }
    .swimlane-session strong { display: block; font-size: 9px; line-height: 1.35; margin-top: 5px; font-weight: 600; }
    .agenda-list-row { display: grid; grid-template-columns: 120px 90px minmax(180px,1fr) 170px 130px; border-bottom: 1px solid var(--line); gap: 10px; align-items: center; min-height: 52px; padding: 0 14px; font-size: 10.5px; }
    .public-agenda-controls { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
    .public-session { display: grid; grid-template-columns: 95px 1fr auto; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: start; }
    .public-session time { color: var(--muted); font: 400 11px/1.4 var(--mono); }
    .public-session h3 { margin: 0 0 7px; font-size: 14px; font-weight: 600; }
    .public-session p { margin: 0; color: var(--muted); font-size: 11.5px; }

    /* Onboarding chase board */
    .onboarding-metrics { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; margin-bottom: 12px; }
    .onboarding-metric { min-height: 92px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); padding: 13px 14px; text-align: left; transition: background 110ms, border-color 110ms; }
    .onboarding-metric:hover { background: var(--sunk); border-color: var(--accent); }
    .onboarding-metric.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .onboarding-metric span { display: block; color: var(--muted); font: 600 9px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
    .onboarding-metric strong { display: block; margin: 9px 0 4px; font-size: 25px; letter-spacing: -.05em; font-weight: 400; font-variant-numeric: tabular-nums; }
    .onboarding-metric small { color: var(--success); font-size: 10px; }
    .chase-toolbar { min-height: 56px; padding: 11px 13px; border-bottom: 1px solid var(--line-strong); background: var(--sunk); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .chase-filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .filter-chip { height: 27px; border: 1px solid var(--line-strong); border-radius: 2px; padding: 0 10px; background: var(--panel); color: var(--muted); font: 400 10px/1 var(--mono); }
    .filter-chip:hover { border-color: var(--accent); color: var(--accent-dark); }
    .filter-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
    .filter-chip b { margin-left: 4px; font-variant-numeric: tabular-nums; }
    .chase-toolbar select { height: 29px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); padding: 0 8px; color: var(--ink); font: 400 10.5px/1 var(--mono); }
    .chase-summary { min-width: 170px; text-align: right; color: var(--muted); font-size: 10.5px; }
    .chase-summary strong { color: var(--ink); font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .chase-table { min-width: 1040px; }
    .chase-table th, .chase-table td { padding-left: 8px; padding-right: 8px; }
    .chase-table tbody tr.selected { background: var(--accent-soft); }
    .speaker-cell button { max-width: 100%; border: 0; padding: 0; background: none; text-align: left; color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .speaker-cell small { display: block; margin-top: 3px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
    .task-state-cell { text-align: center; }
    .task-state { width: 21px; height: 21px; display: inline-grid; place-items: center; border-radius: 2px; border: 1px solid transparent; font: 600 10px/1 var(--mono); }
    .task-state.done { background: var(--success-soft); border-color: var(--success-line); color: var(--success-ink); }
    .task-state.overdue { background: var(--warning-soft); border-color: var(--warning-line); color: var(--warning); }
    .task-state.risk { background: var(--danger-soft); border-color: var(--danger-line); color: var(--danger-ink); }
    .task-state.upcoming { background: var(--sunk); border-color: var(--line-strong); color: var(--muted); }
    .task-state.cancelled { background: transparent; border-color: var(--line-strong); border-style: dashed; color: var(--muted); }
    .drawer-backdrop { position: fixed; inset: 0; z-index: 500; background: var(--backdrop); }
    .drawer { position: fixed; z-index: 510; top: 0; right: 0; width: min(500px,96vw); height: 100vh; overflow: auto; background: var(--panel); border-left: 1px solid var(--line-strong); box-shadow: none; }
    .drawer-head { position: sticky; top: 0; z-index: 2; min-height: 68px; padding: 14px 18px; border-bottom: 1px solid var(--line-strong); background: var(--sunk); display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .drawer-head h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; letter-spacing: -.015em; }
    .drawer-close { width: 30px; height: 30px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); }
    .drawer-close:hover { background: var(--accent-soft); border-color: var(--accent); }
    .drawer-content { padding: 18px; }
    .drawer-section { margin-bottom: 22px; }
    .drawer-section h3 { margin: 0 0 10px; color: var(--muted); font-size: 9.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .task-line { min-height: 46px; padding: 8px 9px; border: 1px solid var(--line-strong); border-radius: var(--radius); display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 9px; align-items: center; margin-bottom: 6px; }
    .task-line strong { font-size: 11px; font-weight: 600; }
    .task-line small { display: block; color: var(--muted); font-size: 9.5px; margin-top: 3px; }
    .timeline { margin-left: 5px; padding-left: 16px; border-left: 1px solid var(--line-strong); }
    .timeline-item { position: relative; padding: 0 0 14px; font-size: 11px; }
    .timeline-item::before { content: ""; position: absolute; left: -19px; top: 4px; width: 5px; height: 5px; border-radius: 0; background: var(--accent); border: 2px solid var(--panel); }
    .timeline-item time { display: block; margin-top: 4px; color: var(--muted); font: 400 9px/1 var(--mono); }
    .message-preview { padding: 14px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--sunk); font-size: 12px; line-height: 1.55; }

    /* Track canvas — the one dark instrument surface, kept from v1.4 */
    .agenda-view-toggle { flex: 0 0 302px; width: 302px; }
    .agenda-view-toggle button { width: 60px; min-width: 60px; }
    .track-board { min-width: 980px; padding: 14px; background: var(--canvas); color: var(--canvas-ink); }
    .track-time-axis { margin-left: 218px; display: grid; grid-template-columns: repeat(7,minmax(105px,1fr)); color: var(--canvas-muted); font: 400 9px/1 var(--mono); padding: 0 8px 8px; }
    .track-lane { display: grid; grid-template-columns: 150px minmax(0,1fr); min-height: 102px; border-top: 1px solid var(--canvas-line); }
    .track-lane-label { position: sticky; left: 0; z-index: 3; padding: 14px 12px; background: var(--canvas); border-right: 1px solid var(--canvas-line); }
    .track-lane-label i { display: block; width: 26px; height: 3px; margin-bottom: 9px; background: var(--track-color); }
    .track-lane-label strong { display: block; font: 500 13px/1.15 var(--mono); letter-spacing: -.02em; }
    .track-lane-label span { display: block; margin-top: 6px; color: var(--canvas-muted); font: 400 9px/1.3 var(--mono); }
    .track-lane-days { min-width: 0; }
    .track-day-band { display: grid; grid-template-columns: 58px minmax(0,1fr); min-height: 94px; border-bottom: 1px solid var(--canvas-band-line); }
    .track-day-label { padding: 11px 7px; border-right: 1px solid var(--canvas-line); color: var(--canvas-muted); font: 400 8px/1.35 var(--mono); text-transform: uppercase; }
    .track-day-label b { display: block; margin-bottom: 4px; color: var(--canvas-day-ink); font: 500 13px/1 var(--mono); }
    .track-day-slots { display: grid; grid-template-columns: repeat(7,minmax(105px,1fr)); gap: 6px; padding: 8px; background: repeating-linear-gradient(90deg,transparent 0 calc(14.285% - 1px),var(--canvas-grid) calc(14.285% - 1px) 14.285%); }
    .track-slot { min-height: 78px; border: 1px dashed transparent; position: relative; }
    .track-slot.drag-over { border-color: var(--canvas-drop); background: var(--canvas-drop-bg); }
    .track-tile { position: relative; min-height: 74px; padding: 8px; border: 1px solid var(--canvas-tile-line); border-top: 3px solid var(--track-color); border-radius: 2px; background: var(--canvas-tile); box-shadow: none; cursor: grab; overflow: hidden; }
    .track-tile + .track-tile { margin-top: 5px; }
    .track-tile strong { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; color: var(--canvas-tile-ink); font-size: 9px; line-height: 1.3; font-weight: 600; }
    .track-tile span { display: block; margin-top: 5px; color: var(--canvas-tile-muted); font: 400 8px/1.3 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-tile.conflict { border-color: var(--canvas-alarm); box-shadow: inset 0 0 0 1px var(--canvas-alarm); }
    .track-conflict { position: absolute; right: 5px; top: 4px; width: 16px; height: 16px; border-radius: 2px; display: grid; place-items: center; background: var(--canvas-alarm); color: var(--canvas-alarm-ink); font: 700 9px/1 var(--mono); }
    /* ── v1.6: buildings, room AV metadata, room detail panel ───────────── */
    .building-row { display:grid; grid-template-columns:18px minmax(0,1fr) minmax(0,1.6fr) 124px auto; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--line); }
    .building-row:last-child { border-bottom:0; }
    .building-row input { width:100%; min-width:0; height:30px; border:1px solid var(--line-strong); border-radius:var(--radius); padding:0 8px; background:var(--panel); font-size:12px; }
    .building-row input:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); outline:none; }
    .building-rooms { color:var(--muted); font:400 10px/1 var(--mono); text-align:right; white-space:nowrap; }

    .room-row { padding:11px 0; border-bottom:1px solid var(--line); display:grid; gap:8px; }
    .room-row:last-child { border-bottom:0; }
    .room-row-main { display:grid; grid-template-columns:18px minmax(0,1fr) 74px minmax(0,150px) auto; align-items:center; gap:9px; }
    .room-row-main input, .room-row-main select { width:100%; min-width:0; height:30px; border:1px solid var(--line-strong); border-radius:var(--radius); padding:0 8px; background:var(--panel); font-size:12px; }
