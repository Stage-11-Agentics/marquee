<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marquee — Sponsor portal · design prototype</title>
<!-- ═══════════════════════════════════════════════════════════════════════
     MARQUEE — SPONSOR PORTAL · design round prototype (2026-08-14)
     Brief: sequence/sponsors-design.md §3.3 (ruling 3 — dedicated round).
     The sponsor portal is the speaker portal's sibling, not a new species:
     same Flight Deck day treatment, same magic-link door, same task
     machinery (SPEC §3.7), same public-shell chrome as pipeline-v1.1's
     portal routes. What changes is the center of gravity — a speaker's
     portal orbits their session; a sponsor contact's orbits the
     SPONSORSHIP, the company's deal with this conference.

     Calls signed in this round's interview (Atin, 2026-08-14):
     · Visibility — whole sponsorship, anyone completes. Every deliverable
       of the sponsorship is visible with its assignee named; any signed-in
       contact can complete any open task, attribution recorded.
     · Hero — the sponsorship itself: company + tier + status + a DERIVED
       what-your-deal-carries line (Sessions · booth · passes), never a
       generic tier blurb.
     · Sessions — read-only cards; the task machinery is the single write
       path ("Name your speaker" fills the Session).
     Standing rulings honored: person-assigned tasks only (no company task
     type); booth renders as ordinary sponsorship data, absent = ordinary
     too (Silver view proves it); no public intake — "Confirm your company
     details" is a portal task; judge's vocabulary (Session) throughout;
     tier-scoped content variation deliberately NOT modeled (later band —
     the portal shows the deliverables it is given).

     Layout precedent, deliberately mirrored from the binding prototype:
     hero → location card → task grid. The speaker's "Where you are
     speaking" becomes the sponsor's "Your booth" — same loc-lines, same
     map-as-receipt, same leave-by accent box repurposed for load-in.

     Prototype chrome (dashed switcher, badge) is not product UI.
     Serve over HTTP: http://127.0.0.1:8123/sponsor-portal/?v=1
     ═══════════════════════════════════════════════════════════════════ -->
<style>
  /* Flight Deck day tokens — verbatim from pipeline-v1.1 (skin-c lineage). */
  :root {
    --bg: #eaeef2; --panel: #fff; --sunk: #f4f7f9; --graph: #e3e9ee;
    --ink: #101820; --ink-soft: #2c3a46; --muted: #57646f;
    --line: #dde4ea; --line-strong: #c8d2da;
    --accent: #0b6a72; --accent-soft: #e2f0f1; --accent-dark: #084f55;
    --accent-hover: #095b62; --on-accent: #fff;
    --danger: #b02a1f; --danger-soft: #fbe9e7; --danger-ink: #8f2118; --danger-line: #e6b8b2;
    --warning: #8a5c00; --warning-soft: #fdf1dd; --warning-line: #e3cda2; --warning-ink: #6b4700;
    --success: #0f7a4a; --success-soft: #e5f3ec; --success-ink: #0c6b41; --success-line: #b6dcc7;
    --backdrop: rgba(16,24,32,.46);
    --on-ink: #dff2f3;
    /* dark-instrument sub-language: the status hero */
    --canvas: #0f1a22; --canvas-line: #24343f; --canvas-ink: #dbe6ec;
    --canvas-ink-soft: #a8bdc6; --canvas-eyebrow: #7fb3b8; --canvas-muted: #7d949f;
    --canvas-chip-bg: rgba(255,255,255,.07); --canvas-chip-line: #3a4d59; --canvas-chip-ink: #cfe0e7;
    --canvas-ok-bg: rgba(79,214,176,.12); --canvas-ok-line: #2c6a58; --canvas-ok-ink: #86e3c4;
    --canvas-warn-bg: rgba(240,201,128,.14); --canvas-warn-line: #7a5f22; --canvas-warn-ink: #f0c980;
    --shadow: none; --radius: 3px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { margin: 0; min-width: 320px; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  .tabular { font-variant-numeric: tabular-nums lining-nums; }

  .prototype-badge {
    position: fixed; z-index: 1000; right: 12px; top: 12px;
    background: var(--ink); color: var(--on-ink); border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 6px 10px; font: 600 10px/1 var(--mono);
    letter-spacing: .14em; text-transform: uppercase; pointer-events: none;
  }

  .button { min-height: 30px; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 7px 12px; background: var(--panel); color: var(--ink-soft); font: 600 11.5px/1 var(--mono); letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; transition: background 110ms, color 110ms, border-color 110ms; }
  .button:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }
  .button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
  .button.danger { color: var(--danger); border-color: var(--line-strong); }
  .button.danger:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger-ink); }
  .button.small { min-height: 26px; padding: 5px 9px; font-size: 10.5px; }
  .button.ghost { border-color: transparent; background: transparent; }

  .card { background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: none; }
  .card-head { padding: 12px 16px; border-bottom: 1px solid var(--line-strong); background: var(--sunk); display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; }
  .card-head h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-family: var(--mono); }
  .card-body { padding: 16px; }
  .subtle { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .eyebrow { color: var(--muted); font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; font-family: var(--mono); }
  .divider { height: 1px; background: var(--line); margin: 16px 0; }
  .grid-2 { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
  .stack { display: grid; gap: 14px; }
  .field { display: grid; gap: 6px; }
  .field label { font: 600 10px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); min-height: 34px; padding: 8px 10px; color: var(--ink); font-size: 12.5px; outline: none; }
  .field textarea { min-height: 90px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .field-note { font-size: 10px; color: var(--muted); min-height: 13px; }
  .field-error { color: var(--danger); font-size: 11px; min-height: 15px; }

  .chip { display: inline-flex; align-items: center; gap: 5px; min-height: 20px; padding: 3px 7px; border-radius: 2px; border: 1px solid var(--line-strong); background: var(--sunk); color: var(--ink-soft); font: 400 10px/1.2 var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip.overdue { color: var(--danger-ink); background: var(--danger-soft); border-color: var(--danger-line); font-weight: 600; }
  .chip.session { color: var(--accent-dark); background: var(--accent-soft); border-color: var(--accent-line, #a9cdd0); }
  .chip.committed { color: var(--success-ink); background: var(--success-soft); border-color: var(--success-line); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%,10px); z-index: 1200; background: var(--ink); color: var(--on-ink); border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px 13px; font: 400 11.5px/1.4 var(--mono); opacity: 0; pointer-events: none; transition: opacity 110ms, transform 110ms; max-width: min(520px,88vw); }
  .toast.show { opacity: 1; transform: translate(-50%,0); }

  .modal-backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 500; display: grid; place-items: center; padding: 18px; }
  .modal { width: min(540px,100%); background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
  .modal-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { margin: 0 0 7px; font-size: 16px; font-weight: 600; letter-spacing: -.015em; }
  .modal-head p { margin: 0; color: var(--ink-soft); font-size: 12px; line-height: 1.55; }
  .modal-body { padding: 14px 20px 18px; }
  .modal-actions { padding: 12px 20px; border-top: 1px solid var(--line-strong); background: var(--sunk); display: flex; justify-content: flex-end; gap: 8px; }
  .message-preview { padding: 14px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--sunk); font-size: 12px; line-height: 1.55; }
  .toggle-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .toggle-line:last-child { border-bottom: 0; }

  /* Public shell — identical chrome to the speaker portal */
  .public-shell { min-height: 100vh; background: var(--bg); }
  .public-top { height: 60px; background: var(--panel); border-bottom: 1px solid var(--line-strong); display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(18px,5vw,70px); }
  .public-event { display: flex; align-items: center; gap: 10px; font: 600 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .brand-mark { width: 24px; height: 24px; flex: 0 0 24px; border-radius: var(--radius); background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-dark); display: grid; place-items: center; font: 600 11px/1 var(--mono); }
  .public-body { width: min(750px,calc(100% - 32px)); margin: 0 auto; padding: 44px 0 80px; }
  .public-body.wide { width: min(1160px,calc(100% - 32px)); }
  .public-card { background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: clamp(20px,4vw,36px); }
  .public-card h1 { font-size: 26px; letter-spacing: -.03em; margin: 0 0 10px; font-weight: 600; }
  .public-card > p { color: var(--ink-soft); line-height: 1.6; font-size: 13px; }

  .portal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .portal-head h1 { margin: 0 0 7px; font-size: 23px; font-weight: 600; letter-spacing: -.02em; }
  .portal-progress { width: 190px; }
  .progress-track { height: 8px; background: var(--sunk); border: 1px solid var(--line-strong); border-radius: 0; overflow: hidden; margin-top: 7px; }
  .progress-track i { display: block; height: 100%; background: var(--success); transition: width 110ms; }

  .status-hero { background: var(--canvas); color: var(--canvas-ink); border: 1px solid var(--canvas-line); border-radius: var(--radius); padding: 20px; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; margin-bottom: 14px; }
  .status-hero .eyebrow { color: var(--canvas-eyebrow); }
  .status-hero h2 { margin: 7px 0 5px; font-size: 17px; font-weight: 600; }
  .status-hero p { margin: 0; color: var(--canvas-ink-soft); font-size: 11.5px; }
  .status-hero .subtle { color: var(--canvas-ink-soft); }
  .status-hero .chip { background: var(--canvas-chip-bg); border-color: var(--canvas-chip-line); color: var(--canvas-chip-ink); }
  /* The derived deal line: what this sponsorship actually carries, read
     from attached data. Chips hold fixed height; the row never reflows. */
  .deal-line { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 11px; min-height: 22px; }
  .hero-side { text-align: right; display: grid; gap: 4px; justify-items: end; }
  .hero-side strong { font-size: 13px; font-weight: 600; }
  .hero-side .mono { font: 400 10.5px/1.4 var(--mono); color: var(--canvas-ink-soft); }

  .portal-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; }

  .task-row { min-height: 64px; padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; }
  .task-row:last-child { border-bottom: 0; }
  .task-toggle { width: 24px; height: 24px; border-radius: 2px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--on-accent); display: grid; place-items: center; font: 600 12px/1 var(--mono); }
  .task-row.done .task-toggle { background: var(--success); border-color: var(--success); }
  .task-row.done .task-title { text-decoration: line-through; color: var(--muted); }
  .task-row.cancelled .task-toggle { background: var(--sunk); border-style: dashed; color: var(--muted); }
  .task-row.cancelled .task-title { color: var(--muted); }
  .cancelled-block { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line-strong); }
  .cancelled-block > .eyebrow { display: block; margin-bottom: 3px; }
  .cancelled-reason { color: var(--muted); font-size: 10.5px; line-height: 1.5; margin: 0 0 4px; }
  .task-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .task-meta { color: var(--muted); font-size: 10.5px; }
  /* Complete ↔ Update swap must not move the row (elements never jump). */
  .task-row .button { min-width: 84px; }

  .profile-block { text-align: center; padding: 8px 0 14px; }
  .avatar { width: 60px; height: 60px; border-radius: var(--radius); margin: 0 auto 10px; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-dark); display: grid; place-items: center; font: 600 18px/1 var(--mono); }
  .mini-avatar { width: 26px; height: 26px; border-radius: 2px; border: 1px solid var(--line-strong); background: var(--sunk); display: grid; place-items: center; font: 600 9px/1 var(--mono); flex: 0 0 auto; }
  .contact-row { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 9px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); min-height: 44px; }
  .contact-row:last-child { border-bottom: 0; }
  .contact-row strong { font-size: 11px; display: block; }
  .contact-row small { display: block; color: var(--muted); font-size: 9.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .slot-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .slot-chip { display: inline-flex; align-items: center; max-width: 100%; border: 1px solid var(--success-line); border-radius: 2px; background: var(--success-soft); color: var(--success-ink); padding: 3px 6px; font: 600 8px/1.25 var(--mono); letter-spacing: .04em; white-space: normal; }
  .not-public { display: inline-flex; align-items: center; border-radius: 2px; background: var(--warning-soft); border: 1px solid var(--warning-line); color: var(--warning-ink); padding: 2px 6px; font: 600 8px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }

  /* Session blocks — the organizer drawer's Sessions treatment, reused. */
  .session-block { border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--panel); padding: 13px; }
  .session-block + .session-block { margin-top: 10px; }
  .session-block h3 { margin: 9px 0 5px; font-size: 12.5px; font-weight: 600; line-height: 1.4; }
  .session-actions { display: flex; gap: 7px; margin-top: 10px; min-height: 26px; align-items: center; }

  /* Booth location card — the speaker location card, verbatim machinery. */
  .loc-line { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 10px; align-items: baseline; padding: 6px 0; }
  .loc-label { font: 600 9px/1.7 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .loc-value { font-size: 12px; line-height: 1.5; }
  .loc-leave { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 9px 11px; font-size: 12px; line-height: 1.55; margin-top: 4px; }
  .loc-leave b { font-family: var(--mono); font-weight: 600; }

  .mq-map { position: relative; overflow: hidden; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--sunk);
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 8px 8px; }
  .mq-plane { position: absolute; top: 0; left: 50%; transform: translateX(-50%); height: 100%; }
  .mq-tile { position: absolute; width: 256px; height: 256px; filter: grayscale(1) contrast(.9) brightness(1.07); -webkit-user-drag: none; user-select: none; }
  .mq-map.no-tiles .mq-tile { display: none; }
  .mq-overlay { position: absolute; inset: 0; pointer-events: none; }
  .mq-pin { position: absolute; width: 11px; height: 11px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); }
  .mq-attrib { position: absolute; right: 3px; bottom: 2px; z-index: 2; font: 400 8.5px/1.5 var(--mono); color: var(--muted); background: var(--panel); padding: 0 3px; border-radius: 2px; }

  /* Prototype-only chrome: dashed, self-declaring, not product UI. */
  .prototype-state-switch { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 18px; padding: 8px; border: 1px dashed var(--line-strong); border-radius: var(--radius); background: var(--sunk); }
  .prototype-state-switch span { color: var(--muted); font: 600 9px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; margin: 0 2px 0 6px; }
  .prototype-state-switch select { height: 27px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--panel); color: var(--ink); font: 400 10.5px/1 var(--mono); padding: 0 6px; }

  @media (max-width: 900px) {
    .portal-grid, .grid-2 { grid-template-columns: 1fr; }
    .portal-head { flex-direction: column; gap: 10px; }
    .status-hero { grid-template-columns: 1fr; }
    .hero-side { justify-items: start; text-align: left; }
  }
</style>
</head>
<body>
<div class="prototype-badge">Marquee · Sponsor portal · v0.1</div>
<div id="app"></div>
<div id="modal-root"></div>

<script>
(() => {

  // ── Map: the binding prototype's tile mosaic, single-pin case ──────────
  const TILE_PX = 256, tileURL = (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
  function mercatorPx(lat, lng, z) {
    const scale = TILE_PX * Math.pow(2, z), sin = Math.sin(lat * Math.PI / 180);
    return { x: (lng + 180) / 360 * scale, y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * scale };
  }
  function venueMap(b, w, h) {
    const z = 16, p = mercatorPx(b.lat, b.lng, z);
    const planeW = w + 512;
    const left = p.x - planeW / 2, top = p.y - h / 2;
    let tiles = "";
    for (let tx = Math.floor(left / TILE_PX); tx <= Math.floor((left + planeW) / TILE_PX); tx++)
      for (let ty = Math.floor(top / TILE_PX); ty <= Math.floor((top + h) / TILE_PX); ty++)
        tiles += `<img class="mq-tile" alt="" src="${tileURL(z, tx, ty)}" style="left:${Math.round(tx * TILE_PX - left)}px;top:${Math.round(ty * TILE_PX - top)}px" onerror="this.closest('.mq-map').classList.add('no-tiles')">`;
    return `<div class="mq-map" style="height:${h}px"><div class="mq-plane" style="width:${planeW}px">${tiles}<div class="mq-overlay"><i class="mq-pin" style="left:${(p.x - left).toFixed(1)}px;top:${(p.y - top).toFixed(1)}px"></i></div></div><span class="mq-attrib">© OpenStreetMap contributors</span></div>`;
  }

  function showTask(id) {
    const task = sp().tasks.find(t => t.id === Number(id));
    if (!task || task.cancelledAt) return;
    const bodyKey = state.sponsorshipId === "silver" && task.id === 4 ? "silver-4" : task.id;
    const body = (TASK_BODIES[bodyKey] || TASK_BODIES[2])(task);

      const ack = document.getElementById("task-ack"), file = document.getElementById("task-file"), required = document.getElementById("task-required");
      if ((ack && !ack.checked) || (file && !task.done && !file.files.length) || (required && !required.value.trim())) {

      task.done = true; task.overdue = false;
      task.completedBy = viewer().name; task.completedOn = "just now";
      if (file && file.files.length) task.fileName = file.files[0].name;
      // "Name your speaker" is the single write path into the Session —

      if (bodyKey === 4 && required) {

    if (edit) edit.onclick = showCompanyEdit;

  app.addEventListener("click", e => {
    const route = e.target.closest("[data-route]");
    if (route) { e.preventDefault(); state.route = route.dataset.route === "signin" ? "signin" : "portal"; state.signinSent = false; render(); return; }
    const enter = e.target.closest("[data-enter]");
    if (enter) { state.sponsorshipId = enter.dataset.enter; state.viewerId = enter.dataset.viewer; state.route = "portal"; render(); return; }
    const task = e.target.closest("[data-task]");
    if (task) { showTask(task.dataset.task); return; }
    const hb = e.target.closest("[data-handbook]");
    if (hb) { showHandbook(hb.dataset.handbook); return; }
    const inv = e.target.closest("[data-invite]");
    if (inv) { const s = sp().sessions.find(x => x.id === inv.dataset.invite); toast(`Calendar invite downloaded — ${s ? s.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40) : "session"}.ics`); return; }
  });

  render();
})();
</script>
</body>
</html>
