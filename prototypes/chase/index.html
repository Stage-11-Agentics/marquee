<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marquee — Chase prototype</title>
  <style>
    :root {
      --ink: #18201d;
      --muted: #6c7772;
      --faint: #929c97;
      --line: #dfe5e1;
      --line-strong: #cbd4cf;
      --canvas: #f3f5f3;
      --paper: #ffffff;
      --rail: #18201d;
      --rail-muted: #aeb9b3;
      --accent: #136a4d;
      --accent-soft: #e6f2ed;
      --green: #167654;
      --green-soft: #e6f4ed;
      --amber: #9a6514;
      --amber-soft: #fff3db;
      --red: #a34238;
      --red-soft: #fbeae7;
      --blue: #345f9d;
      --blue-soft: #eaf0fa;
      --purple: #76569c;
      --shadow: 0 18px 50px rgba(24,32,29,.16);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); color: var(--ink); font-family: var(--sans); }
    body { margin: 0; min-width: 320px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .mono, .count, time, .metric strong, .task-cell { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .tiny { font-size: 11px; }
    .small { font-size: 13px; }
    .nowrap { white-space: nowrap; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    .prototype-badge {
      position: fixed; z-index: 1000; right: 14px; bottom: 14px; padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.3); border-radius: 4px; background: #7a3f16;
      color: white; box-shadow: 0 3px 14px rgba(0,0,0,.24); font: 700 10px/1 var(--mono);
      letter-spacing: .08em; text-transform: uppercase;
    }

    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 208px minmax(0,1fr); }
    .rail {
      min-height: 100vh; position: sticky; top: 0; align-self: start; height: 100vh;
      padding: 18px 12px; background: var(--rail); color: white; display: flex; flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
    .brand-mark { width: 27px; height: 27px; border: 1px solid #617068; display: grid; place-items: center; border-radius: 4px; }
    .brand-mark:before { content: "M"; font: 800 14px/1 Georgia, serif; color: #f3b45d; }
    .brand-name { font: 700 16px/1 Georgia, serif; letter-spacing: .01em; }
    .event-switcher { margin: 0 4px 14px; padding: 10px; border: 1px solid #35413b; background: #202a26; border-radius: 6px; }
    .event-switcher strong { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-switcher span { color: var(--rail-muted); font: 10px/1.5 var(--mono); }
    .nav-group { margin: 0 0 14px; }
    .nav-label { color: #7f8d86; padding: 0 10px 5px; font: 700 9px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .nav-link {
      width: 100%; height: 34px; display: flex; align-items: center; gap: 9px; padding: 0 10px;
      border: 0; border-radius: 5px; background: transparent; color: #c9d1cd; text-align: left; font-size: 12px;
    }
    .nav-link:hover { background: #232e29; color: white; }
    .nav-link.active { background: #304039; color: white; }
    .nav-icon { width: 16px; color: #89968f; text-align: center; font: 12px/1 var(--mono); }
    .nav-link.active .nav-icon { color: #f3b45d; }
    .rail-footer { margin-top: auto; padding: 10px 8px 2px; border-top: 1px solid #34413b; color: var(--rail-muted); }
    .rail-footer strong { display: block; color: white; font-size: 11px; }
    .rail-footer span { font-size: 10px; }

    .workspace { min-width: 0; }
    .topbar {
      height: 56px; position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 16px;
      padding: 0 28px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.95); backdrop-filter: blur(10px);
    }
    .crumb { min-width: 190px; }
    .crumb strong { display: block; font-size: 13px; }
    .crumb span { color: var(--muted); font-size: 10px; }
    .global-search {
      margin-left: auto; width: min(410px, 45vw); height: 34px; display: flex; align-items: center; gap: 8px;
      padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 5px; background: #f8faf8; color: var(--muted);
    }
    .global-search button { flex: 1; border: 0; background: transparent; color: var(--muted); text-align: left; font-size: 12px; }
    kbd { border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: white; color: var(--muted); font: 10px/1 var(--mono); }
    .avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #e7ede9; color: #33443c; font: 700 10px/1 var(--mono); }

    main { padding: 24px 28px 70px; }
    .page-head { min-height: 62px; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .page-head h1 { margin: 0 0 5px; font: 600 25px/1.1 Georgia, serif; letter-spacing: -.01em; }
    .page-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .head-actions { min-width: 220px; display: flex; justify-content: flex-end; gap: 8px; }

    .btn {
      min-height: 34px; border: 1px solid var(--line-strong); border-radius: 5px; padding: 7px 12px;
      background: white; color: var(--ink); font-size: 12px; font-weight: 650;
    }
    .btn:hover { border-color: #9eaaa3; background: #fafbfa; }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .btn.primary:hover { background: #0f5b42; }
    .btn.danger { border-color: #e1bab4; color: var(--red); background: var(--red-soft); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.small-btn { min-height: 28px; padding: 4px 9px; font-size: 11px; }
    .btn:disabled { cursor: default; opacity: .45; }

    .panel { border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
    .panel-head { min-height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { margin: 0; font-size: 13px; }
    .panel-body { padding: 16px; }
    .grid { display: grid; gap: 14px; }
    .grid.two { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .grid.three { grid-template-columns: repeat(3,minmax(0,1fr)); }
    .grid.four { grid-template-columns: repeat(4,minmax(0,1fr)); }
    .metric { min-height: 88px; padding: 14px; border: 1px solid var(--line); border-radius: 7px; background: white; }
    .metric span { display: block; color: var(--muted); font-size: 11px; }
    .metric strong { display: block; margin-top: 7px; font-size: 24px; letter-spacing: -.04em; }
    .metric small { color: var(--green); font-size: 10px; }

    .chips { min-height: 34px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip { height: 28px; border: 1px solid var(--line-strong); border-radius: 99px; padding: 0 10px; background: white; color: var(--muted); font-size: 11px; }
    .chip.active { border-color: #9bc5b5; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .chip b { margin-left: 5px; font: 700 10px/1 var(--mono); }
    .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .select, .input, .textarea { border: 1px solid var(--line-strong); border-radius: 5px; background: white; color: var(--ink); }
    .select, .input { height: 34px; padding: 0 9px; font-size: 12px; }
    .textarea { min-height: 90px; width: 100%; padding: 9px; resize: vertical; font-size: 12px; }
    .field { display: grid; gap: 5px; }
    .field label { color: var(--muted); font-size: 11px; font-weight: 650; }
    .field .input, .field .select { width: 100%; }
    .field-error { min-height: 16px; color: var(--red); font-size: 11px; }

    .board-toolbar { min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    .board-summary { min-width: 245px; text-align: right; color: var(--muted); font-size: 11px; }
    .board-summary strong { color: var(--ink); font-family: var(--mono); }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { height: 38px; padding: 0 9px; background: #f8faf8; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 9px; letter-spacing: .06em; text-align: left; text-transform: uppercase; }
    td { height: 48px; padding: 6px 9px; border-bottom: 1px solid #edf0ee; font-size: 11px; vertical-align: middle; }
    tbody tr:hover { background: #fafcfb; }
    tbody tr.selected { background: #eef7f3; }
    tbody tr:last-child td { border-bottom: 0; }
    .cell-person { overflow: hidden; }
    .cell-person button { max-width: 100%; border: 0; padding: 0; background: transparent; color: var(--ink); text-align: left; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .cell-person small { display: block; margin-top: 2px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-cell { text-align: center; }
    .task-dot { width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 4px; font-size: 10px; font-weight: 800; }
    .task-dot.done { background: var(--green-soft); color: var(--green); }
    .task-dot.overdue { background: var(--amber-soft); color: var(--amber); }
    .task-dot.risk { background: var(--red-soft); color: var(--red); }
    .task-dot.upcoming { background: #edf1ef; color: var(--muted); }
    .task-dot.na { background: transparent; color: #b7bfbb; }
    .status { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 4px 7px; font-size: 10px; font-weight: 700; }
    .status:before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status.accepted, .status.complete { color: var(--green); background: var(--green-soft); }
    .status.review { color: var(--blue); background: var(--blue-soft); }
    .status.waitlisted, .status.overdue { color: var(--amber); background: var(--amber-soft); }
    .status.rejected, .status.conflict { color: var(--red); background: var(--red-soft); }
    .status.submitted { color: #56615c; background: #edf1ef; }
    .status.session { color: var(--purple); background: #f0eaf6; }

    .sparkline { height: 72px; display: flex; align-items: flex-end; gap: 4px; }
    .sparkline i { flex: 1; min-width: 7px; border-radius: 2px 2px 0 0; background: #9bc8b7; }
    .wave-card { padding: 14px; border-left: 1px solid var(--line); }
    .wave-card:first-child { border-left: 0; }
    .wave-card strong { font: 700 13px/1 var(--mono); }
    .wave-card small { display: block; margin-top: 3px; color: var(--muted); }

    .drawer-backdrop, .modal-backdrop, .palette-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(18,25,22,.38); }
    .drawer { position: fixed; z-index: 210; top: 0; right: 0; width: min(480px, 96vw); height: 100vh; overflow: auto; background: white; box-shadow: var(--shadow); }
    .drawer-head { position: sticky; top: 0; z-index: 2; min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: white; }
    .drawer-head h2 { margin: 0 0 3px; font: 600 19px/1.2 Georgia, serif; }
    .drawer-content { padding: 18px; }
    .drawer-section { margin-bottom: 22px; }
    .drawer-section h3 { margin: 0 0 9px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
    .close { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 5px; background: white; }
    .task-list { display: grid; gap: 7px; }
    .task-line { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 5px; }
    .task-line strong { font-size: 11px; }
    .task-line span { color: var(--muted); font: 10px/1 var(--mono); }
    .timeline { border-left: 1px solid var(--line-strong); margin-left: 5px; padding-left: 15px; }
    .timeline-item { position: relative; padding: 0 0 14px; font-size: 11px; }
    .timeline-item:before { content: ""; position: absolute; left: -19px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); border: 2px solid white; }
    .timeline-item time { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }

    .modal { position: fixed; z-index: 310; left: 50%; top: 50%; width: min(620px, calc(100vw - 28px)); max-height: 90vh; overflow: auto; transform: translate(-50%,-50%); border-radius: 8px; background: white; box-shadow: var(--shadow); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font: 600 18px/1.2 Georgia, serif; }
    .modal-body { padding: 18px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
    .preview-card { padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: #f8faf8; font-size: 12px; line-height: 1.55; }

    .palette-backdrop { z-index: 400; background: rgba(10,15,13,.5); }
    .palette { position: fixed; z-index: 410; top: 12vh; left: 50%; width: min(620px, calc(100vw - 28px)); transform: translateX(-50%); border-radius: 8px; background: white; box-shadow: var(--shadow); overflow: hidden; }
    .palette-input { width: 100%; height: 54px; padding: 0 16px; border: 0; border-bottom: 1px solid var(--line); outline: none; font-size: 15px; }
    .palette-results { max-height: 430px; overflow: auto; padding: 7px; }
    .search-result { width: 100%; display: grid; grid-template-columns: 76px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px; border: 0; border-radius: 5px; background: white; text-align: left; }
    .search-result:hover { background: #f1f6f3; }
    .search-type { color: var(--accent); font: 700 9px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; }
    .search-result strong { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-result small { color: var(--muted); font-size: 10px; }

    .toast { position: fixed; z-index: 1200; left: 50%; bottom: 22px; min-width: 260px; max-width: min(520px,calc(100vw - 30px)); transform: translateX(-50%); padding: 10px 14px; border-radius: 5px; background: #18201d; color: white; box-shadow: var(--shadow); font-size: 11px; text-align: center; }

    .landing { min-height: 100vh; background: #f3f1eb; }
    .landing-nav { height: 66px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px,5vw,72px); border-bottom: 1px solid #d8d5cc; }
    .landing-nav .brand { padding: 0; color: var(--ink); }
    .landing-nav .brand-mark { border-color: #aeb5b0; }
    .landing-main { min-height: calc(100vh - 66px); display: grid; grid-template-columns: 1.02fr .98fr; }
    .landing-copy { display: flex; flex-direction: column; justify-content: center; padding: 7vw; }
    .eyebrow { margin-bottom: 16px; color: var(--accent); font: 700 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .landing h1 { max-width: 720px; margin: 0 0 20px; font: 500 clamp(46px,6vw,82px)/.96 Georgia, serif; letter-spacing: -.045em; }
    .landing-copy > p { max-width: 610px; margin: 0 0 28px; color: #59635e; font-size: 16px; line-height: 1.55; }
    .demo-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .demo-actions .btn { min-height: 43px; padding: 10px 16px; }
    .landing-proof { display: flex; flex-direction: column; justify-content: center; padding: 5vw; background: #202924; color: white; }
    .proof-window { border: 1px solid #455249; border-radius: 8px; background: #f8faf8; color: var(--ink); box-shadow: 0 24px 80px rgba(0,0,0,.25); overflow: hidden; transform: rotate(.8deg); }
    .proof-top { height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: #25312b; }
    .proof-top i { width: 7px; height: 7px; border-radius: 50%; background: #5e6d65; }
    .proof-content { padding: 18px; }
    .proof-row { display: grid; grid-template-columns: 1.7fr repeat(4,.7fr); gap: 8px; align-items: center; height: 38px; border-bottom: 1px solid var(--line); font-size: 10px; }
    .proof-row b { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .proof-kicker { margin-top: 20px; color: #bbc8c1; font-size: 12px; line-height: 1.5; }

    .settings-layout { display: grid; grid-template-columns: 190px minmax(0,1fr); gap: 16px; }
    .settings-menu { padding: 8px; }
    .settings-menu button { width: 100%; height: 34px; border: 0; border-radius: 4px; background: transparent; text-align: left; color: var(--muted); font-size: 11px; }
    .settings-menu button.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .full { grid-column: 1/-1; }
    .swatch-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .swatch { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; font-size: 10px; }
    .swatch i { width: 8px; height: 8px; border-radius: 2px; }

    .builder { display: grid; grid-template-columns: minmax(320px,.85fr) minmax(360px,1.15fr); gap: 16px; }
    .field-card { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px; border-bottom: 1px solid var(--line); }
    .field-card:last-child { border-bottom: 0; }
    .drag-handle { color: #9ba49f; font: 12px/1 var(--mono); }
    .field-card strong { display: block; font-size: 11px; }
    .field-card small { color: var(--muted); font-size: 10px; }
    .field-card-actions { display: flex; gap: 3px; }
    .icon-btn { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 4px; background: white; color: var(--muted); }
    .preview-shell { max-width: 580px; margin: 0 auto; border: 1px solid var(--line); border-radius: 7px; background: #fbfcfb; overflow: hidden; }
    .preview-banner { padding: 22px; background: #1d2b25; color: white; }
    .preview-banner span { color: #bac8c1; font: 10px/1 var(--mono); }
    .preview-form { padding: 20px; }

    .public-page { min-height: 100vh; background: #f2f0e9; }
    .public-head { display: flex; align-items: center; justify-content: space-between; min-height: 62px; padding: 0 clamp(18px,5vw,70px); background: #17362c; color: white; }
    .public-head strong { font: 600 16px/1 Georgia, serif; }
    .public-head nav { display: flex; gap: 18px; color: #c3d2cc; font-size: 11px; }
    .public-card { width: min(720px,calc(100vw - 28px)); margin: 36px auto 90px; border: 1px solid #d8d6ce; border-radius: 8px; background: white; box-shadow: 0 12px 35px rgba(40,42,37,.08); overflow: hidden; }
    .public-card-head { padding: 30px; background: #f8faf8; border-bottom: 1px solid var(--line); }
    .public-card-head h1 { margin: 0 0 8px; font: 500 31px/1.1 Georgia, serif; }
    .public-card-head p { margin: 0; color: var(--muted); line-height: 1.5; }
    .public-form { padding: 28px 30px; display: grid; gap: 17px; }
    .save-line { min-height: 20px; color: var(--muted); font: 10px/1.5 var(--mono); }

    .portal-wrap { width: min(980px,calc(100vw - 28px)); margin: 0 auto; padding: 26px 0 80px; }
    .portal-hero { padding: 24px; border-radius: 8px; background: #19342c; color: white; }
    .portal-hero-top { display: flex; justify-content: space-between; gap: 18px; }
    .portal-hero h1 { margin: 0 0 4px; font: 500 26px/1.1 Georgia, serif; }
    .portal-hero p { margin: 0; color: #bdd0c8; font-size: 12px; }
    .meter { height: 7px; margin-top: 18px; border-radius: 99px; background: #324b41; overflow: hidden; }
    .meter span { display: block; height: 100%; background: #f3b45d; }
    .portal-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 14px; margin-top: 14px; }

    .plan-row { display: grid; grid-template-columns: minmax(0,1.5fr) .7fr .7fr .7fr auto; align-items: center; gap: 10px; min-height: 54px; padding: 8px 13px; border-bottom: 1px solid var(--line); font-size: 11px; }
    .plan-row:last-child { border-bottom: 0; }
    .progress { height: 5px; border-radius: 99px; background: #e7ece9; overflow: hidden; }
    .progress i { display: block; height: 100%; background: var(--accent); }
    .committee { display: flex; align-items: center; }
    .committee .avatar { margin-left: -5px; border: 2px solid white; }
    .committee .avatar:first-child { margin-left: 0; }

    .review-shell { min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0,1fr); background: #f4f6f4; }
    .review-side { min-height: 100vh; padding: 24px 18px; background: #18201d; color: white; }
    .review-side h1 { font: 500 20px/1.15 Georgia, serif; }
    .review-side .progress { margin: 13px 0 8px; background: #35413b; }
    .review-side p { color: #aeb9b3; font-size: 11px; line-height: 1.5; }
    .shortcut-list { margin-top: 30px; border-top: 1px solid #35413b; padding-top: 14px; color: #aeb9b3; font-size: 10px; line-height: 2; }
    .review-main { padding: 34px clamp(20px,7vw,90px) 90px; }
    .review-card { max-width: 850px; margin: 0 auto; border: 1px solid var(--line); border-radius: 8px; background: white; overflow: hidden; }
    .review-card-head { padding: 24px; border-bottom: 1px solid var(--line); }
    .review-card-head h2 { margin: 9px 0; font: 500 28px/1.15 Georgia, serif; }
    .review-card-body { padding: 24px; line-height: 1.65; color: #34423c; font-size: 13px; }
    .scorebar { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-top: 1px solid var(--line); background: white; }
    .scores { display: flex; gap: 6px; }
    .score { width: 38px; height: 38px; border: 1px solid var(--line-strong); border-radius: 5px; background: white; font: 700 12px/1 var(--mono); }
    .score.active { border-color: var(--accent); background: var(--accent); color: white; }

    .entity-chip { display: inline-flex; align-items: center; gap: 5px; color: var(--purple); font-size: 10px; font-weight: 700; }
    .entity-chip:before { content: ""; width: 6px; height: 6px; border: 1px solid currentColor; transform: rotate(45deg); }
    .bulkbar { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--line); background: #f8faf8; }
    .pagination { display: flex; justify-content: space-between; align-items: center; padding: 11px 13px; border-top: 1px solid var(--line); }

    .agenda-layout { display: grid; grid-template-columns: 245px minmax(0,1fr); gap: 14px; }
    .pool { align-self: start; position: sticky; top: 72px; }
    .pool-list { max-height: calc(100vh - 230px); overflow: auto; padding: 7px; }
    .session-tile { margin-bottom: 6px; padding: 8px; border-left: 4px solid var(--track,#888); border-radius: 4px; background: white; box-shadow: 0 1px 0 rgba(0,0,0,.06); font-size: 10px; }
    .session-tile[draggable=true] { cursor: grab; }
    .session-tile strong { display: block; margin-bottom: 4px; font-size: 10px; line-height: 1.3; }
    .session-tile span { color: var(--muted); font-family: var(--mono); }
    .session-tile.conflicted { background: var(--red-soft); outline: 1px solid #e8b5ad; }
    .view-tabs { display: flex; gap: 2px; }
    .view-tab { height: 30px; min-width: 54px; border: 1px solid var(--line); background: white; color: var(--muted); font-size: 10px; }
    .view-tab:first-child { border-radius: 5px 0 0 5px; }
    .view-tab:last-child { border-radius: 0 5px 5px 0; }
    .view-tab.active { background: #22312a; color: white; border-color: #22312a; }
    .agenda-grid { overflow: auto; padding: 8px; background: #eef1ef; }
    .room-grid { display: grid; grid-template-columns: 64px repeat(4,minmax(150px,1fr)); min-width: 720px; }
    .grid-head { min-height: 38px; padding: 10px 7px; background: #f8faf8; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 10px; font-weight: 700; }
    .time-cell { min-height: 86px; padding: 7px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #f8faf8; color: var(--muted); font: 10px/1 var(--mono); }
    .slot { min-height: 86px; padding: 5px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: white; }
    .slot.dragover { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }
    .swimlanes { min-width: 760px; }
    .swimlane { display: grid; grid-template-columns: 155px repeat(6,minmax(120px,1fr)); min-height: 78px; border-bottom: 1px solid var(--line); }
    .lane-title { padding: 12px; border-left: 5px solid var(--track); background: #f8faf8; font-size: 11px; font-weight: 700; }
    .lane-slot { padding: 5px; border-left: 1px solid var(--line); background: white; }
    .agenda-list-row { display: grid; grid-template-columns: 90px minmax(0,1fr) 160px 150px; gap: 10px; align-items: center; padding: 11px; border-bottom: 1px solid var(--line); background: white; font-size: 11px; }

    .public-agenda-hero { padding: 48px clamp(20px,6vw,80px) 34px; background: #17362c; color: white; }
    .public-agenda-hero h1 { margin: 0 0 7px; font: 500 clamp(34px,5vw,58px)/1 Georgia, serif; }
    .public-agenda-hero p { color: #bcd0c8; }
    .public-agenda-main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }
    .public-session { display: grid; grid-template-columns: 90px minmax(0,1fr) 190px; gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .public-session time { color: var(--muted); font-size: 11px; }
    .public-session h2 { margin: 0 0 5px; font: 500 18px/1.2 Georgia, serif; }
    .public-session p { margin: 0; color: var(--muted); font-size: 11px; }
    .embed-code { padding: 12px; border-radius: 5px; background: #1c2521; color: #dce6e1; overflow: auto; font: 10px/1.6 var(--mono); }

    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 64px minmax(0,1fr); }
      .rail { padding-inline: 8px; }
      .brand-name, .event-switcher, .nav-label, .nav-link span:not(.nav-icon), .rail-footer { display: none; }
      .brand { padding-inline: 10px; }
      .nav-link { justify-content: center; padding: 0; }
      .builder, .agenda-layout, .portal-grid { grid-template-columns: 1fr; }
      .pool { position: static; }
      .landing-main { grid-template-columns: 1fr; }
      .landing-proof { min-height: 520px; }
      .grid.four { grid-template-columns: repeat(2,1fr); }
    }
    @media (max-width: 620px) {
      .app-shell { display: block; }
      .rail { min-height: 52px; height: 52px; position: sticky; z-index: 70; padding: 6px 8px; flex-direction: row; overflow-x: auto; }
      .brand { padding: 6px; }
      .brand-mark { width: 27px; }
      .nav-group { display: flex; margin: 0; }
      .nav-link { width: 38px; height: 38px; }
      .topbar { top: 52px; height: 48px; padding: 0 12px; }
      .crumb span, .avatar { display: none; }
      .crumb { min-width: 100px; }
      main { padding: 18px 12px 70px; }
      .global-search { width: 43px; margin-left: auto; }
      .global-search button { font-size: 0; }
      .global-search kbd { display: none; }
      .page-head { display: block; }
      .head-actions { min-width: 0; justify-content: flex-start; margin-top: 12px; }
      .grid.two, .grid.three, .grid.four, .form-grid, .settings-layout { grid-template-columns: 1fr; }
      .settings-menu { display: none; }
      .builder { grid-template-columns: 1fr; }
      .public-card-head, .public-form { padding: 20px; }
      .review-shell { display: block; }
      .review-side { min-height: auto; }
      .review-main { padding: 20px 12px 80px; }
      .scorebar { display: block; }
      .scores { margin-bottom: 10px; }
      .public-session { grid-template-columns: 70px minmax(0,1fr); }
      .public-session > :last-child { grid-column: 2; }
      .prototype-badge { right: 8px; bottom: 8px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="overlay"></div>
  <div class="prototype-badge">Prototype — mock data</div>

  <script>
    (() => {
      'use strict';

      const event = {
        name: 'AIE NYC 2026', start: '2026-10-12', end: '2026-10-14',
        timezone: 'America/New_York', venue: 'Sheraton New York Times Square', cfpClose: '2026-09-12'
      };
      const tracks = [
        ['AI in Financial Services','#a85a45'], ['Agents','#3e7a69'], ['Evals','#5f6fa8'], ['Infra','#9a7438'],
        ['Open Models','#7c5f99'], ['RAG / Retrieval','#2f7690'], ['Security','#a14b57'], ['Leadership','#65735f']
      ];
      const formats = [['Workshop','90m'],['Stage Talk','20m'],['Lightning','10m'],['Online','45m']];
      const rooms = [['Empire Ballroom','860'],['Liberty 1','320'],['Liberty 2','280'],['Riverside','180']];
      const firstNames = ['Ana María','Jean-Baptiste','Nneka','Søren','Priyanka','Mateo','Fatima','Aleksandar','Mei-Ling','Oluwaseun','Renée','Jiří','Amina','Théo','Lucía','Mohammed','Caroline','Kwame','Yuki','Eoin','Márta','Santiago','Noor','Joaquín'];
      const lastNames = ['García-López','van der Meer','Okafor','Kovačević','Mukherjee','de la Cruz','Al-Hassan','Petrova-Sokolov','Watanabe','O’Connell','N’Diaye','Schönberg','Ibrahim-Khalil','Rossi-Bernard','Zhang-Williams','Fernández','Adeyemi','Nowak','Björnsdóttir','Velázquez'];
      const companies = ['Bloomberg','JPMorgan Chase','Capital One','Anthropic','OpenAI','Hugging Face','LangChain','Cohere','Weights & Biases','Modal','Replicate','Harvey','Ramp','Datadog','Jane Street','Two Sigma','Mistral AI','Groq','Perplexity','MongoDB','Cloudflare','Pinecone','Unstructured','Glean'];
      const titleA = ['When Agents Negotiate With Other Agents','The Evaluation Gap Nobody Budgets For','Retrieval After the Vector Database','Building Reliable Tool-Using Systems','What Three Years of Production LLMs Taught Us','Can Open Models Survive the Enterprise?','The Unreasonably Effective Context Window','From Prototype to Regulated Production','Why Your Agent Needs a Flight Recorder','Designing Human Escalation That Actually Works','The Long Road From Demo to Durable Infrastructure','Small Models, Serious Workloads'];
      const titleB = ['Without Losing the Human in the Loop','Across Banks, Labs, and High-Stakes Teams','At 100 Million Requests per Day','Under Adversarial Production Conditions','When the Benchmark Stops Being the Product','A Field Guide for Teams Who Have to Ship','and the Architecture We Rebuilt Twice','With Constraints the Demo Never Shows'];
      const taskDefs = [
        {key:'confirm', label:'Confirm slot', due:'Aug 22', kind:'action'},
        {key:'bio', label:'Bio + headshot', due:'Aug 28', kind:'form'},
        {key:'av', label:'A/V needs', due:'Sep 03', kind:'form'},
        {key:'slides', label:'Upload slides', due:'Oct 02', kind:'file'},
        {key:'travel', label:'Travel details', due:'Sep 10', kind:'form'}
      ];
      const waves = ['Aug 15','Sep 1','Sep 15'];

      const state = {
        route: '', boardFilter: 'all', taskFilter: 'all', trackFilter: 'all', selectedSpeakers: new Set(),
        submissionsPage: 0, submissionsFilter: 'all', selectedSubmissions: new Set(), selectAllMatching: false,
        drawer: null, modal: null, palette: false, search: '', reviewIndex: 0, reviewScore: null, reminderTemplate: 'Outstanding speaker tasks', embedSurface: 'Schedule itinerary', embedTrack: 'All published tracks',
        agendaView: 'day', publicSubmitted: false, formTarget: 'Abstract', formName: 'AIE NYC 2026 — Call for Speakers',
        formFields: [
          {id:'title',label:'Session title',type:'Short text',required:true},
          {id:'format',label:'Format',type:'Single select',required:true},
          {id:'track',label:'Primary track',type:'Single select',required:true},
          {id:'abstract',label:'Abstract',type:'Long text',required:true},
          {id:'outcomes',label:'What will attendees learn?',type:'Long text',required:true},
          {id:'speaker',label:'Speaker details',type:'Email + profile',required:true}
        ],
        portalDone: new Set(['confirm','av']), messages: {}, toastTimer: null, agenda: [], settingsSaved: false
      };
      try { Object.assign(event, JSON.parse(localStorage.getItem('marquee-chase-event') || '{}')); } catch (_) {}

      function personName(i) { return firstNames[i % firstNames.length] + ' ' + lastNames[(i * 7 + 3) % lastNames.length]; }
      function titleFor(i) { return titleA[i % titleA.length] + (i % 3 ? ': ' + titleB[(i * 5) % titleB.length] : ''); }
      function seededStatus(i) {
        if (i < 150) return 'accepted';
        if (i < 240) return 'review';
        if (i < 480) return 'waitlisted';
        if (i < 950) return 'rejected';
        if (i < 980) return 'submitted';
        return 'withdrawn';
      }
      const submissions = Array.from({length:1000}, (_,i) => ({
        id:'A-' + String(i+1).padStart(4,'0'), entity:'Abstract', title:i===7?'Panel: Who Owns the Agent When the Agent Acts?':titleFor(i), status:seededStatus(i),
        speaker: (i === 2 || i === 4) ? personName(0) : personName(i), company:companies[(i*5)%companies.length],
        format:formats[i%formats.length][0], track:tracks[(i*3)%tracks.length][0], score:(2.4 + ((i*17)%27)/10).toFixed(1),
        wave: i < 55 ? waves[0] : i < 105 ? waves[1] : i < 150 ? waves[2] : '—', submitted:'2026-' + (i%2?'07':'08') + '-' + String((i%27)+1).padStart(2,'0'),
        coSpeakers: i === 7 ? [personName(207), personName(208), personName(209), personName(210)] : []
      }));
      const adminSessions = Array.from({length:40}, (_,i) => ({
        id:'S-' + String(i+1).padStart(3,'0'), entity:'Session', title:(i%3?'Sponsor briefing: ':'Invited conversation: ') + titleFor(i+41),
        status:'accepted', speaker:personName(i+311), company:companies[(i*7)%companies.length], format:formats[(i+1)%formats.length][0],
        track:tracks[(i+2)%tracks.length][0], score:'—', wave:'Admin', submitted:'2026-08-' + String((i%27)+1).padStart(2,'0')
      }));
      const records = submissions.concat(adminSessions);
      const speakers = submissions.slice(0,150).map((s,i) => {
        const statuses = taskDefs.map((t,j) => {
          if ((i+j*3)%7 < 3) return 'done';
          if ((i+j)%11 === 0) return 'risk';
          if ((i*2+j)%5 < 2) return 'overdue';
          return 'upcoming';
        });
        return {
          id:'P-' + String(i+1).padStart(3,'0'), name:s.speaker, company:s.company, email:'speaker.'+(i+1)+'@example.org',
          track:s.track, session:s.title, sessionId:s.id, wave:s.wave, statuses,
          bio:'Builds production AI systems where reliability, accountability, and human judgment matter. Previously led applied research and platform teams across finance and developer infrastructure.',
          title:i%4===0?'Distinguished Engineer, Applied AI':'Founder & Principal Engineer',
          headshot:'', reminders:[]
        };
      });
      speakers[0].statuses = taskDefs.map(t => state.portalDone.has(t.key) ? 'done' : (t.key==='bio' ? 'overdue' : 'upcoming'));
      const agendaSource = submissions.slice(0,32).map((s,i) => ({
        id:s.id, title:s.title, speaker:s.speaker, track:s.track, format:s.format,
        room:rooms[i%rooms.length][0], day:i<20?'Oct 12':'Oct 13', time:['09:00','09:30','10:00','10:30','11:00','11:30','13:00','13:30'][i%8],
        scheduled:i<24
      }));
      agendaSource[1].speaker = agendaSource[0].speaker;
      agendaSource[1].time = agendaSource[0].time;
      agendaSource[1].room = rooms[1][0];
      state.agenda = agendaSource;

      const $ = (selector, root=document) => root.querySelector(selector);
      const esc = (value='') => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
      const trackColor = name => (tracks.find(t=>t[0]===name)||['','#777'])[1];
      const routeNames = {dashboard:'Chase board',settings:'Event settings',forms:'Form builder',publicform:'Public CFP',portal:'Speaker portal',evaluation:'Evaluation plan',review:'Reviewer queue',submissions:'Abstracts & sessions',agenda:'Agenda builder',publicagenda:'Public agenda'};

      function toast(message) {
        clearTimeout(state.toastTimer);
        let el = $('#toast');
        if (!el) { el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
        el.textContent = message;
        state.toastTimer = setTimeout(() => el.remove(), 2600);
      }
      function copyText(value) {
        const fallback=()=>{const area=document.createElement('textarea');area.value=value;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();};
        if(navigator.clipboard?.writeText) navigator.clipboard.writeText(value).catch(fallback); else fallback();
      }

      function navigate(route) {
        location.hash = route;
        if ((location.hash.slice(1)||'landing') === route) render();
      }

      function shell(content, route) {
        const nav = [
          ['dashboard','⌁','Chase'],['submissions','A','Abstracts'],['forms','F','Forms'],['evaluation','E','Evaluation'],['agenda','▦','Agenda'],
          ['portal','P','Speaker portal'],['publicagenda','↗','Event site'],['settings','⚙','Settings']
        ];
        return `<div class="app-shell">
          <aside class="rail">
            <div class="brand"><div class="brand-mark"></div><div class="brand-name">Marquee</div></div>
            <div class="event-switcher"><strong>${esc(event.name)}</strong><span>PROGRAM · OCT 12–14</span></div>
            <div class="nav-group"><div class="nav-label">Operate</div>
              ${nav.slice(0,5).map(n=>`<button class="nav-link ${route===n[0]?'active':''}" data-route="${n[0]}" title="${n[2]}"><span class="nav-icon">${n[1]}</span><span>${n[2]}</span></button>`).join('')}
            </div>
            <div class="nav-group"><div class="nav-label">Surfaces</div>
              ${nav.slice(5).map(n=>`<button class="nav-link ${route===n[0]?'active':''}" data-route="${n[0]}" title="${n[2]}"><span class="nav-icon">${n[1]}</span><span>${n[2]}</span></button>`).join('')}
            </div>
            <div class="rail-footer"><strong>Atin Woodard</strong><span>Organizer · Demo mode</span></div>
          </aside>
          <section class="workspace">
            <header class="topbar">
              <div class="crumb"><strong>${esc(routeNames[route]||'Marquee')}</strong><span>${esc(event.name)}</span></div>
              <div class="global-search"><span>⌕</span><button data-action="open-palette">Find anything…</button><kbd>⌘K</kbd></div>
              <div class="avatar">AW</div>
            </header>
            <main>${content}</main>
          </section>
        </div>`;
      }

      function landing() {
        const previewPeople = speakers.slice(0,5);
        return `<div class="landing">
          <header class="landing-nav">
            <div class="brand"><div class="brand-mark"></div><div class="brand-name">Marquee</div></div>
            <button class="btn" data-route="publicagenda">View AIE NYC agenda</button>
          </header>
          <div class="landing-main">
            <section class="landing-copy">
              <div class="eyebrow">Open-source program operations</div>
              <h1>Fantastic conferences, effortlessly.</h1>
              <p>Run the whole program lifecycle — CFP, review, acceptance, speaker onboarding, agenda, and publishing — without losing the people behind the process.</p>
              <div class="demo-actions">
                <button class="btn primary" data-route="dashboard">Enter as organizer</button>
                <button class="btn" data-route="portal">Enter as speaker</button>
                <button class="btn ghost" data-route="publicform">Open public CFP →</button>
              </div>
              <p class="tiny" style="margin-top:18px">No signup. Populated with 1,000 abstracts, 40 direct sessions, and 150 accepted speakers.</p>
            </section>
            <section class="landing-proof">
              <div class="proof-window">
                <div class="proof-top"><i></i><i></i><i></i></div>
                <div class="proof-content">
                  <div class="small muted" style="margin-bottom:12px">WHO NEEDS ATTENTION · LIVE</div>
                  ${previewPeople.map((p,i)=>`<div class="proof-row"><b>${esc(p.name)}</b>${p.statuses.slice(0,4).map(st=>`<span class="task-dot ${st}">${st==='done'?'✓':st==='overdue'?'!':'·'}</span>`).join('')}</div>`).join('')}
                </div>
              </div>
              <div class="proof-kicker">The chase work is not a report. It is the home surface — live, actionable, and already sorted by who is furthest behind.</div>
            </section>
          </div>
        </div>`;
      }

      function settingsPage() {
        return shell(`<div class="page-head"><div><h1>Event settings</h1><p>One source for every downstream surface.</p></div><div class="head-actions"><button class="btn primary" data-action="save-settings">Save event</button></div></div>
          <div class="settings-layout">
            <aside class="panel settings-menu"><button class="active" data-action="settings-basics">Basics</button><button data-unwired="AC-8">Formats</button><button data-unwired="AC-11">Tracks & rooms</button><button data-unwired="AC-6">Branding</button><button data-unwired="AC-105">API & tokens</button><button data-unwired="AC-162">Airtable sync</button></aside>
            <section class="panel"><div class="panel-head"><h2>Event basics</h2><span class="small muted">Changes apply to forms, portals, agenda, and calendar invites</span></div>
              <form class="panel-body form-grid" id="settings-form">
                <div class="field full"><label>Event name</label><input class="input" name="name" value="${esc(event.name)}"></div>
                <div class="field"><label>Starts</label><input class="input" type="date" name="start" value="${event.start}"></div>
                <div class="field"><label>Ends</label><input class="input" type="date" name="end" value="${event.end}"></div>
                <div class="field"><label>Timezone</label><select class="select" name="timezone"><option>America/New_York</option><option>America/Los_Angeles</option><option>Europe/London</option></select></div>
                <div class="field"><label>Venue</label><input class="input" name="venue" value="${esc(event.venue)}"></div>
                <div class="field full"><label>Session formats and defaults</label><div class="swatch-list">${formats.map(f=>`<span class="swatch"><i style="background:${trackColor(tracks[formats.indexOf(f)][0])}"></i>${f[0]} · <span class="mono">${f[1]}</span></span>`).join('')}<button type="button" class="btn small-btn" data-unwired="AC-8">Edit formats</button></div></div>
                <div class="field full"><label>Tracks</label><div class="swatch-list">${tracks.map(t=>`<span class="swatch"><i style="background:${t[1]}"></i>${t[0]}</span>`).join('')}<button type="button" class="btn small-btn" data-unwired="AC-11">Edit tracks</button></div></div>
                <div class="field full"><label>Rooms</label><div class="swatch-list">${rooms.map(r=>`<span class="swatch">${r[0]} · <span class="mono">${r[1]}</span></span>`).join('')}</div></div>
              </form>
            </section>
          </div>`, 'settings');
      }

      function boardStatusCount(filter) {
        if (filter==='all') return speakers.length;
        if (filter==='incomplete') return speakers.filter(p=>p.statuses.some(s=>s!=='done')).length;
        return speakers.filter(p=>p.statuses.includes(filter)).length;
      }
      function filteredSpeakers() {
        return speakers.filter(p => {
          const statusOk = state.boardFilter==='all' || (state.boardFilter==='incomplete' ? p.statuses.some(s=>s!=='done') : p.statuses.includes(state.boardFilter));
          const trackOk = state.trackFilter==='all' || p.track===state.trackFilter;
          const taskIndex = taskDefs.findIndex(t=>t.key===state.taskFilter);
          const taskOk = taskIndex<0 || p.statuses[taskIndex]!=='done';
          return statusOk && trackOk && taskOk;
        }).sort((a,b)=>severity(b)-severity(a));
      }
      function severity(p) { return p.statuses.reduce((n,s)=>n+(s==='risk'?4:s==='overdue'?2:s==='upcoming'?1:0),0); }
      function taskDot(status) { return `<span class="task-dot ${status}" title="${status}">${status==='done'?'✓':status==='risk'?'×':status==='overdue'?'!':'·'}</span>`; }

      function dashboardPage() {
        const shown = filteredSpeakers();
        const overdue = boardStatusCount('overdue'), risk = boardStatusCount('risk');
        const incomplete = boardStatusCount('incomplete');

      function agendaConflictIds() {
        const set=new Set();
        state.agenda.filter(x=>x.scheduled).forEach((a,i,all)=>all.slice(i+1).forEach(b=>{ if(a.day===b.day&&a.time===b.time&&(a.room===b.room||a.speaker===b.speaker)){set.add(a.id);set.add(b.id);} }));
        return set;

      function tile(s) {
        const conflict=agendaConflictIds().has(s.id);
        return `<div class="session-tile ${conflict?'conflicted':''}" draggable="true" data-session-id="${s.id}" style="--track:${trackColor(s.track)}"><strong>${esc(s.title)}</strong><span>${esc(s.speaker)} · ${s.format}${conflict?' · CONFLICT':''}</span></div>`;

        return `<div class="room-grid"><div class="grid-head">Oct 12</div>${rooms.map(r=>`<div class="grid-head">${r[0]}<br><span class="muted mono">CAP ${r[1]}</span></div>`).join('')}${times.map(tm=>`<div class="time-cell">${tm}</div>${rooms.map(r=>`<div class="slot" data-room="${r[0]}" data-time="${tm}" data-day="Oct 12">${scheduled.filter(s=>s.day==='Oct 12'&&s.time===tm&&s.room===r[0]).map(tile).join('')}</div>`).join('')}`).join('')}</div>`;
      }

      function speakerDrawer(id) {
        const p=speakers.find(x=>x.id===id); if(!p)return '';

        return `<div class="drawer-backdrop" data-action="close-overlay"></div><aside class="drawer"><header class="drawer-head"><div><h2>${esc(p.name)}</h2><span class="small muted">${esc(p.title)} · ${esc(p.company)}</span></div><button class="close" data-action="close-overlay">×</button></header><div class="drawer-content">

          <section class="drawer-section"><h3>Message history</h3><div class="timeline"><div class="timeline-item">Acceptance and portal invitation queued<time>${p.wave}, 10:04 AM</time></div>${msgs.map(m=>`<div class="timeline-item">${esc(m.subject)}<time>Just now · delivered in demo outbox</time></div>`).join('')||'<div class="small muted">No reminders sent yet.</div>'}</div><button class="btn primary" data-nudge-one="${p.id}">Send reminder</button></section>
          <section class="drawer-section"><h3>Biography</h3><p class="small">${esc(p.bio)}</p><span class="small muted">${esc(p.email)}</span></section>
        </div></aside>`;

      function recordDrawer(id) {
        const r=records.find(x=>x.id===id)||state.agenda.find(x=>x.id===id); if(!r)return '';
        return `<div class="drawer-backdrop" data-action="close-overlay"></div><aside class="drawer"><header class="drawer-head"><div><h2>${esc(r.title)}</h2><span class="small muted">${esc(r.id)} · ${esc(r.entity||'Session')}</span></div><button class="close" data-action="close-overlay">×</button></header><div class="drawer-content"><section class="drawer-section"><h3>Record</h3><div class="preview-card"><span class="status ${r.status||'accepted'}">${esc(r.status||'scheduled')}</span><p><strong>Speaker</strong><br>${esc(r.speaker)}</p>${r.coSpeakers?.length?`<p><strong>Co-speakers · panel of ${r.coSpeakers.length+1}</strong><br>${r.coSpeakers.map(esc).join('<br>')}</p>`:''}<p><strong>Track · Format</strong><br>${esc(r.track)} · ${esc(r.format)}</p>${r.company?`<p><strong>Company</strong><br>${esc(r.company)}</p>`:''}</div></section><section class="drawer-section"><h3>Abstract</h3><p class="small">A practical account of building production AI systems under real constraints, with specific failure modes, evaluation evidence, and decisions the team would make differently.</p></section><button class="btn primary" data-route="${r.status==='accepted'||!r.status?'agenda':'submissions'}">Open in ${r.status==='accepted'||!r.status?'agenda':'abstracts'}</button></div></aside>`;
      }
      function composeModal(ids) {
        const chosen=speakers.filter(p=>ids.includes(p.id)); if(!chosen.length)return '';
        const first=chosen[0], overdue=taskDefs.find((t,i)=>first.statuses[i]==='overdue'||first.statuses[i]==='risk')||taskDefs[1];
        const templates={
          'Outstanding speaker tasks':{subject:`AIE NYC: ${overdue.label} is still outstanding`,task:overdue.label,due:overdue.due},
          'Headshot deadline':{subject:'AIE NYC: your headshot is overdue',task:'Bio + headshot',due:'Aug 28'},
          'Slides due soon':{subject:'AIE NYC: slides are due October 2',task:'Upload slides',due:'Oct 2'}
        };
        const copy=templates[state.reminderTemplate]||templates['Outstanding speaker tasks'];
        return `<div class="drawer-backdrop" data-action="close-overlay"></div><aside class="drawer"><header class="drawer-head"><div><h2>Remind ${chosen.length} ${chosen.length===1?'speaker':'speakers'}</h2><span class="small muted">Demo-safe outbox · no email will be delivered</span></div><button class="close" data-action="close-overlay">×</button></header><div class="drawer-content"><div class="field"><label>Template</label><select class="select" id="reminder-template">${Object.keys(templates).map(name=>`<option ${state.reminderTemplate===name?'selected':''}>${name}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Subject</label><input class="input" id="reminder-subject" value="${esc(copy.subject)}"></div><div class="field" style="margin-top:12px"><label>Message</label><textarea class="textarea" id="reminder-body">Hi {{speaker.first_name}},\n\nWe’re getting ${event.name} ready. Your {{task.title}} task was due {{task.due_date}}. Please finish it in your portal so the program stays on track.\n\nThank you,\nAIE program team</textarea></div><h3 class="small">Merge-field preview · ${esc(first.name)}</h3><div class="preview-card">Hi ${esc(first.name.split(' ')[0])},<br><br>We’re getting ${event.name} ready. Your <strong>${esc(copy.task)}</strong> task was due <strong>${copy.due}</strong>. Please finish it in your portal so the program stays on track.<br><br>Thank you,<br>AIE program team</div></div><footer class="modal-foot" style="position:sticky;bottom:0;background:white"><button class="btn" data-action="close-overlay">Cancel</button><button class="btn primary" data-send-reminder="${chosen.map(p=>p.id).join(',')}">Queue reminder (${chosen.length})</button></footer></aside>`;
      }
      function genericModal(kind) {
        if(kind==='embed') {
          const gallery=state.embedSurface==='Speaker gallery', query=state.embedTrack==='All published tracks'?'':'?track='+encodeURIComponent(state.embedTrack);
          return `<div class="modal-backdrop" data-action="close-overlay"></div><section class="modal"><header class="modal-head"><h2>Embed the event site</h2><button class="close" data-action="close-overlay">×</button></header><div class="modal-body"><div class="grid two"><div class="field"><label>Surface</label><select class="select" id="embed-surface"><option ${gallery?'':'selected'}>Schedule itinerary</option><option ${gallery?'selected':''}>Speaker gallery</option></select></div><div class="field"><label>Track</label><select class="select" id="embed-track"><option ${state.embedTrack==='All published tracks'?'selected':''}>All published tracks</option>${tracks.map(t=>`<option ${state.embedTrack===t[0]?'selected':''}>${t[0]}</option>`).join('')}</select></div></div><h3 class="small">Responsive preview</h3><div class="preview-card">${gallery?`<strong>${esc(speakers[0].name)}</strong><br><span class="muted">${esc(speakers[0].title)} · ${esc(speakers[0].company)}</span>`:`<strong>Monday · Oct 12</strong><br>09:00 · ${esc(state.agenda[0].title)}<br><span class="muted">Empire Ballroom · ${esc(state.agenda[0].speaker)}</span>`}</div><h3 class="small">Embed code</h3><pre class="embed-code">&lt;iframe src="https://marquee.stage11.dev/e/aie-nyc-2026/${gallery?'speakers':'agenda'}/embed${query}"\n  title="AIE NYC 2026 ${gallery?'speakers':'agenda'}" loading="lazy"&gt;&lt;/iframe&gt;</pre></div><footer class="modal-foot"><button class="btn" data-action="close-overlay">Close</button><button class="btn primary" data-action="copy-embed">Copy embed code</button></footer></section>`;
        }
        if(kind==='profile') { const p=speakers[0]; return `<div class="modal-backdrop" data-action="close-overlay"></div><section class="modal"><header class="modal-head"><h2>Edit speaker profile</h2><button class="close" data-action="close-overlay">×</button></header><div class="modal-body form-grid"><div class="field"><label>Name</label><input class="input" value="${esc(p.name)}"></div><div class="field"><label>Company</label><input class="input" value="${esc(p.company)}"></div><div class="field full"><label>Title</label><input class="input" value="${esc(p.title)}"></div><div class="field full"><label>Biography</label><textarea class="textarea">${esc(p.bio)}</textarea></div><div class="field full"><label>Headshot</label><button class="btn" data-unwired="AC-52">Choose image and crop</button></div></div><footer class="modal-foot"><button class="btn" data-action="close-overlay">Cancel</button><button class="btn primary" data-action="save-profile">Save profile</button></footer></section>`; }
        if(kind==='conflicts') return `<div class="modal-backdrop" data-action="close-overlay"></div><section class="modal"><header class="modal-head"><h2>Agenda conflicts</h2><button class="close" data-action="close-overlay">×</button></header><div class="modal-body"><div class="task-list"><div class="task-line"><span class="task-dot risk">×</span><strong>${esc(state.agenda[0].speaker)} is in two sessions<small style="display:block;color:var(--muted)">Oct 12 at ${state.agenda[0].time} · Empire Ballroom and Liberty 1</small></strong><button class="btn small-btn" data-route="agenda">Open</button></div><div class="task-line"><span class="task-dot overdue">!</span><strong>Room overlap in Liberty 2<small style="display:block;color:var(--muted)">Two blocks overlap by 10 minutes</small></strong><button class="btn small-btn" data-route="agenda">Open</button></div></div></div></section>`;
        return '';
      }
      function searchResults() {
        const q=state.search.trim().toLowerCase();
        let results=[];
        if(q.length>0) {
          const ps=speakers.filter(p=>(p.name+' '+p.company+' '+p.session).toLowerCase().includes(q)).slice(0,4).map(p=>({type:'Speaker',id:p.id,title:p.name,meta:p.company}));
          const rs=records.filter(r=>(r.title+' '+r.speaker+' '+r.id).toLowerCase().includes(q)).slice(0,7).map(r=>({type:r.entity,id:r.id,title:r.title,meta:r.speaker}));
          const forms=('call for speakers abstract session application '+state.formName).toLowerCase().includes(q) ? [{type:'Jump',id:'forms',title:state.formName,meta:'Form · collects '+state.formTarget.toLowerCase()+'s'}] : [];
          results=forms.concat(ps,rs).slice(0,9);
        } else results=[{type:'Jump',id:'dashboard',title:'Chase board',meta:'150 accepted speakers · live task status'},{type:'Jump',id:'submissions',title:'Abstracts & sessions',meta:'1,040 records'},{type:'Jump',id:'forms',title:'Call for Speakers form',meta:'Published · collects abstracts'},{type:'Jump',id:'agenda',title:'Agenda builder',meta:'Five schedule views'}];
        return results.length?results.map(r=>`<button class="search-result" data-search-type="${r.type}" data-search-id="${r.id}"><span class="search-type">${r.type}</span><strong>${esc(r.title)}</strong><small>${esc(r.meta)}</small></button>`).join(''):'<div class="panel-body muted small">No matching speaker, abstract, session, or form.</div>';
      }
      function renderOverlay() {
        const el=$('#overlay');
        let html='';
        if(state.palette) html+=`<div class="palette-backdrop" data-action="close-palette"></div><section class="palette"><input class="palette-input" id="palette-input" autocomplete="off" placeholder="Find a speaker, abstract, session, or form…" value="${esc(state.search)}"><div class="palette-results">${searchResults()}</div></section>`;
        if(state.drawer?.type==='speaker') html+=speakerDrawer(state.drawer.id);
        if(state.drawer?.type==='record') html+=recordDrawer(state.drawer.id);
        if(state.modal?.type==='compose') html+=composeModal(state.modal.ids);
        if(state.modal && state.modal.type!=='compose') html+=genericModal(state.modal.type);
        el.innerHTML=html;
        if(state.palette) setTimeout(()=>$('#palette-input')?.focus(),0);
      }

      function closeOverlay() { state.drawer=null; state.modal=null; state.palette=false; renderOverlay(); }
      function openPalette() { state.palette=true; state.search=''; renderOverlay(); }
      function sendReminder(ids) {
        const subject=$('#reminder-subject')?.value||'Outstanding speaker tasks';
        ids.forEach(id=>{ if(!state.messages[id])state.messages[id]=[]; state.messages[id].push({subject,date:new Date().toISOString()}); });
        state.modal=null; state.selectedSpeakers.clear(); render(); toast(`Queued ${ids.length} ${ids.length===1?'reminder':'reminders'} in the demo-safe outbox.`);
      }
      function publicFieldError(name, rawValue) {
        const value=String(rawValue||'').trim();
        if(name==='title'&&value.length<8) return 'Use at least 8 characters so reviewers know what the session is about.';
        if(name==='format'&&!value) return 'Choose the format you can deliver.';
        if(name==='track'&&!value) return 'Choose the closest primary track.';
        if(name==='abstract'&&value.length<120) return 'Tell reviewers a little more — at least 120 characters.';
        if(name==='email'&&!/^\S+@\S+\.\S+$/.test(value)) return 'Enter an email address we can use to send your private edit link.';
        return '';
      }
      function validatePublicForm(form) {
        const fd=new FormData(form), errors={};
        ['title','format','track','abstract','email'].forEach(name=>{const error=publicFieldError(name,fd.get(name));if(error)errors[name]=error;});
        form.querySelectorAll('[data-error]').forEach(el=>el.textContent=errors[el.dataset.error]||'');
        if(Object.keys(errors).length){ const first=form.querySelector(`[name="${Object.keys(errors)[0]}"]`); first?.focus(); return false; }
        return true;
      }

      document.addEventListener('click', e => {
        const route=e.target.closest('[data-route]')?.dataset.route;
        if(route){ closeOverlay(); navigate(route); return; }
        const action=e.target.closest('[data-action]')?.dataset.action;
        if(action==='open-palette'){ openPalette(); return; }
        if(action==='close-palette'||action==='close-overlay'){ closeOverlay(); return; }
        if(action==='open-compose'){ const ids=[...state.selectedSpeakers]; if(ids.length){state.modal={type:'compose',ids};renderOverlay();} return; }
        if(action==='open-conflicts'){ state.modal={type:'conflicts'};renderOverlay();return; }
        if(action==='embed'){state.modal={type:'embed'};renderOverlay();return;}
        if(action==='edit-profile'){state.modal={type:'profile'};renderOverlay();return;}
        if(action==='save-profile'){closeOverlay();toast('Profile saved. Public speaker surfaces will use the update.');return;}
        if(action==='copy-embed'){
          const gallery=state.embedSurface==='Speaker gallery', query=state.embedTrack==='All published tracks'?'':'?track='+encodeURIComponent(state.embedTrack);
          copyText(`<iframe src="https://marquee.stage11.dev/e/aie-nyc-2026/${gallery?'speakers':'agenda'}/embed${query}" title="AIE NYC 2026 ${gallery?'speakers':'agenda'}" loading="lazy"></iframe>`);
          toast('Embed code copied.');return;
        }
        if(action==='calendar'){toast('Calendar invite ready — Google, Outlook, Apple Calendar, and .ics.');return;}
        if(action==='settings-basics'){toast('Event basics are already open.');return;}
        if(action==='save-settings'){
          const form=$('#settings-form'); if(form){const fd=new FormData(form);Object.assign(event,Object.fromEntries(fd.entries()));try{localStorage.setItem('marquee-chase-event',JSON.stringify(event));}catch(_){}state.settingsSaved=true;render();toast('Event saved. Agenda times and calendar invites now use '+event.timezone+'.');} return;
        }
        if(action==='duplicate-form'){toast('Duplicated as “'+state.formName+' — copy”.');return;}
        if(action==='add-field'){state.formFields.push({id:'audience'+Date.now(),label:'Intended audience',type:'Short text',required:false});render();toast('Field added to the live preview.');return;}
        if(action==='reset-public-form'){state.publicSubmitted=false;render();return;}
        if(action==='new-plan'){toast('Prototype — new plan setup is represented by the populated two-round plan (AC-53).');return;}
        if(action==='promote-round'){toast('240 highest-ranked abstracts promoted to Round 2. Round 1 scores remain visible.');return;}
        if(action==='save-next'){if(state.reviewScore){state.reviewIndex=Math.min(89,state.reviewIndex+1);state.reviewScore=null;render();toast('Score saved. Next abstract loaded.');}return;}
        if(action==='select-all-matching'){state.selectAllMatching=true;render();return;}
        if(action==='bulk-accept'){
          const matching=records.filter(r=>state.submissionsFilter==='all'||r.status===state.submissionsFilter||(state.submissionsFilter==='session'&&r.entity==='Session'));
          const ids=(state.selectAllMatching?matching.map(r=>r.id):[...state.selectedSubmissions]);
          let changed=0; ids.forEach(id=>{const r=records.find(x=>x.id===id);if(r&&isAcceptable(r)){
            r.status='accepted';r.wave='Sep 15';changed++;
            if(!speakers.some(p=>p.sessionId===r.id)) speakers.push({id:'P-'+String(speakers.length+1).padStart(3,'0'),name:r.speaker,company:r.company,email:'accepted.'+r.id.toLowerCase()+'@example.org',track:r.track,session:r.title,sessionId:r.id,wave:r.wave,statuses:['upcoming','overdue','upcoming','upcoming','upcoming'],bio:'Accepted speaker profile awaiting completion.',title:'Speaker',headshot:'',reminders:[]});
            if(!state.agenda.some(s=>s.id===r.id)) state.agenda.push({id:r.id,title:r.title,speaker:r.speaker,track:r.track,format:r.format,room:'—',day:'—',time:'—',scheduled:false});
          }});
          state.selectAllMatching=false;state.selectedSubmissions.clear();render();toast(`Accepted ${changed} abstracts. Portals, notifications, and agenda pool updated.`);return;
        }
        if(e.target.closest('[data-unwired]')){toast('Prototype — not wired ('+e.target.closest('[data-unwired]').dataset.unwired+').');return;}

        const filter=e.target.closest('[data-board-filter]')?.dataset.boardFilter;
        if(filter){state.boardFilter=filter;render();return;}
        const subFilter=e.target.closest('[data-sub-filter]')?.dataset.subFilter;
        if(subFilter){state.submissionsFilter=subFilter;state.submissionsPage=0;state.selectedSubmissions.clear();state.selectAllMatching=false;render();return;}
        const page=e.target.closest('[data-page]')?.dataset.page;
        if(page!==undefined){state.submissionsPage=+page;render();return;}
        const agendaView=e.target.closest('[data-agenda-view]')?.dataset.agendaView;
        if(agendaView){state.agendaView=agendaView;render();return;}
        const speakerId=e.target.closest('[data-speaker]')?.dataset.speaker;
        if(speakerId){state.drawer={type:'speaker',id:speakerId};renderOverlay();return;}
        const recordId=e.target.closest('[data-record]')?.dataset.record;
        if(recordId){state.drawer={type:'record',id:recordId};renderOverlay();return;}
        const nudge=e.target.closest('[data-nudge-one]')?.dataset.nudgeOne;
        if(nudge){state.modal={type:'compose',ids:[nudge]};renderOverlay();return;}
        const send=e.target.closest('[data-send-reminder]')?.dataset.sendReminder;
        if(send){sendReminder(send.split(','));return;}
        const score=e.target.closest('[data-score]')?.dataset.score;
        if(score){state.reviewScore=+score;render();return;}
        const task=e.target.closest('[data-portal-task]')?.dataset.portalTask;
        if(task){
          const taskIndex=taskDefs.findIndex(t=>t.key===task);
          if(state.portalDone.has(task)){state.portalDone.delete(task);speakers[0].statuses[taskIndex]='upcoming';}
          else {state.portalDone.add(task);speakers[0].statuses[taskIndex]='done';}
          render();toast(state.portalDone.has(task)?'Task marked complete. Organizer chase board updated live.':'Task reopened. Organizer chase board updated live.');return;
        }
        const move=e.target.closest('[data-move-field]');
        if(move){const i=state.formFields.findIndex(f=>f.id===move.dataset.moveField), j=i+(+move.dataset.dir);if(i>=0&&j>=0&&j<state.formFields.length){[state.formFields[i],state.formFields[j]]=[state.formFields[j],state.formFields[i]];render();}return;}
        const sr=e.target.closest('[data-search-id]');
        if(sr){const type=sr.dataset.searchType,id=sr.dataset.searchId;state.palette=false;if(type==='Jump'){navigate(id);}else{state.drawer={type:type==='Speaker'?'speaker':'record',id};renderOverlay();}return;}
      });

      document.addEventListener('change', e => {
        if(e.target.id==='reminder-template'){state.reminderTemplate=e.target.value;renderOverlay();}
        if(e.target.id==='embed-surface'){state.embedSurface=e.target.value;renderOverlay();}
        if(e.target.id==='embed-track'){state.embedTrack=e.target.value;renderOverlay();}
        if(e.target.id==='task-filter'){state.taskFilter=e.target.value;render();}
        if(e.target.id==='track-filter'){state.trackFilter=e.target.value;render();}
        if(e.target.id==='form-target'){state.formTarget=e.target.value;render();toast(state.formTarget+' target set. '+(state.formTarget==='Abstract'?'Submissions will enter evaluation.':'Submissions may go directly to the agenda.'));}
        if(e.target.id==='agenda-snap'){toast(e.target.value+' applied to drag placement.');}
        if(e.target.id==='select-visible'){filteredSpeakers().forEach(p=>e.target.checked?state.selectedSpeakers.add(p.id):state.selectedSpeakers.delete(p.id));render();}
        if(e.target.classList.contains('speaker-check')){e.target.checked?state.selectedSpeakers.add(e.target.value):state.selectedSpeakers.delete(e.target.value);render();}
        if(e.target.id==='select-page'){
          const filtered=records.filter(r=>state.submissionsFilter==='all'||r.status===state.submissionsFilter||(state.submissionsFilter==='session'&&r.entity==='Session'));
          filtered.slice(state.submissionsPage*25,state.submissionsPage*25+25).filter(isAcceptable).forEach(r=>e.target.checked?state.selectedSubmissions.add(r.id):state.selectedSubmissions.delete(r.id));render();
        }
        if(e.target.classList.contains('record-check')){e.target.checked?state.selectedSubmissions.add(e.target.value):state.selectedSubmissions.delete(e.target.value);render();}
      });
      document.addEventListener('input', e => {
        if(e.target.id==='palette-input'){state.search=e.target.value;const list=$('.palette-results');if(list)list.innerHTML=searchResults();}
      });
      document.addEventListener('focusout', e => {
        if(e.target.form?.id==='public-cfp-form'&&e.target.name){const error=e.target.form.querySelector(`[data-error="${e.target.name}"]`);if(error)error.textContent=publicFieldError(e.target.name,e.target.value);}
      });
      document.addEventListener('submit', e => {
        if(e.target.id==='public-cfp-form'){e.preventDefault();if(validatePublicForm(e.target)){state.publicSubmitted=true;render();}}
      });
      document.addEventListener('keydown', e => {
        const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
        if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return;}
        if(e.key==='/'&&!typing){e.preventDefault();openPalette();return;}
        if(e.key==='Escape'&&(state.palette||state.drawer||state.modal)){closeOverlay();return;}
        if(state.route==='review'&&!typing){if(/[1-5]/.test(e.key)){state.reviewScore=+e.key;render();}if(e.key==='Enter'&&state.reviewScore){state.reviewIndex=Math.min(89,state.reviewIndex+1);state.reviewScore=null;render();}}
      });
      document.addEventListener('dragstart', e => {const t=e.target.closest('[data-session-id]');if(t)e.dataTransfer.setData('text/plain',t.dataset.sessionId);});
      document.addEventListener('dragover', e => {const slot=e.target.closest('.slot');if(slot){e.preventDefault();slot.classList.add('dragover');}});
      document.addEventListener('dragleave', e => {e.target.closest('.slot')?.classList.remove('dragover');});
      document.addEventListener('drop', e => {
        const slot=e.target.closest('.slot');if(!slot)return;e.preventDefault();slot.classList.remove('dragover');const id=e.dataTransfer.getData('text/plain');const s=state.agenda.find(x=>x.id===id);if(s){s.scheduled=true;s.room=slot.dataset.room;s.time=slot.dataset.time;s.day=slot.dataset.day;render();toast('Scheduled at '+s.time+' in '+s.room+'. All agenda views updated.');}
      });
      window.addEventListener('hashchange', render);
      render();
    })();
  </script>
</body>
</html>
