<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color-meta" name="theme-color" content="#eaeef2" />
    <!-- Kept in sync with src/lib/head-icons.ts, which carries the same tags
         for the fallback documents the HTML routes emit without ASSETS.

         The two live formats carry ids because the tab dresses with the page:
         the script below and applyTheme() in src/ui/shell/theme.ts re-point
         them at the worn theme's mark. /favicon.ico is the legacy last resort
         and stays the Day mark — a browser old enough to need it is one no
         register theme was drawn for. -->
    <link id="icon-svg" rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link id="icon-png" rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Marquee — Program operations</title>
    <!--
      Theme is stamped before first paint, not after hydration: a themed app
      that resolves its palette in JS shows a white flash on every load, which
      is exactly the kind of jump the design language forbids. Day is the
      default and needs no attribute; the OS preference is deliberately not
      consulted (see src/ui/shell/theme.ts).

      Two theme classes share this script (mirrors src/ui/shell/theme.ts —
      keep them in sync): palette themes ("night") only move color; register
      themes ("latent-space", "ai-engineer", "swyxy") also load webfonts,
      injected here with display=swap so the first paint never waits on them.
      swyxy's dark palette is a second attribute read from its own key —
      explicit toggle only, never prefers-color-scheme. `?theme=<id>` and
      `?mode=dark` override storage for comparison links without persisting.

      The tab is dressed here too — icon and theme-color — for the same reason
      the palette is: a tab that keeps the Flight Deck M above a latent.space
      page reads as another site's icon on the wrong window, and correcting it
      after hydration means the browser has already fetched and cached the
      wrong one. Every non-Day theme ships /favicon-<id>.svg and
      /favicon-<id>-32.png, so the id is the path.
    -->
    <script>
      try {
        var params = new URLSearchParams(window.location.search);
        // "day" is a valid id that stamps nothing — it must still be honoured
        // as an override, or `?theme=day` falls through to storage and the
        // document wears one theme while the app reports another.
        var ids = { "day": 1, "night": 1, "latent-space": 1, "ai-engineer": 1, "swyxy": 1 };
        var t = params.get("theme");
        // Three layers, matching readTheme() in src/ui/shell/theme.ts: a
        // comparison link, then this person's own choice, then the
        // organization's default as the shell last read it. The org default is
        // mirrored into storage rather than fetched, because a fetch here is
        // the flash this script exists to prevent.
        if (!ids[t]) t = localStorage.getItem("marquee-theme");
        if (!ids[t]) t = localStorage.getItem("marquee-org-default-theme");
        if (ids[t] && t !== "day") {
          document.documentElement.dataset.theme = t;
          var dark = false;
          if (t === "swyxy") {
            var mode = params.get("mode") || localStorage.getItem("marquee-swyxy-mode");
            dark = mode === "dark";
            if (dark) document.documentElement.dataset.swyxyMode = "dark";
          }
          // Null-guarded: a route that rewrites this head is free to drop a
          // tag, and a TypeError here would take the webfonts below with it.
          var dress = function (id, prop, value) {
            var el = document.getElementById(id);
            if (el) el[prop] = value;
          };
          dress("icon-svg", "href", "/favicon-" + t + ".svg");
          dress("icon-png", "href", "/favicon-" + t + "-32.png");
          var colors = { "night": "#121416", "latent-space": "#0b0b0e", "ai-engineer": "#ffffff", "swyxy": "#ffffff" };
          dress("theme-color-meta", "content", dark ? "#0b1120" : colors[t]);
          var fonts = {
            "latent-space": "https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap",
            "ai-engineer": "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
          };
          if (fonts[t]) {
            var pre = document.createElement("link");
            pre.rel = "preconnect"; pre.href = "https://fonts.gstatic.com"; pre.crossOrigin = "anonymous";
            var css = document.createElement("link");
            css.rel = "stylesheet"; css.href = fonts[t]; css.dataset.themeFonts = t;
            document.head.append(pre, css);
          }
        }
      } catch (e) { /* private mode: fall through to Day */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/app.tsx"></script>
  </body>
</html>
